<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>AI 聊天 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #f4f7fb;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px max(20px, calc((100% - 1120px) / 2));
            border-bottom: 1px solid #e8edf4;
            background: #fff;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #172033;
            font-weight: 750;
            text-decoration: none;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-weight: 800;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-chip {
            padding: 7px 14px;
            border-radius: 999px;
            color: #1f2b45;
            background: #f1f4fa;
            font-size: 13.5px;
        }

        .balance-chip b {
            color: #3158d1;
        }

        .version {
            padding: 5px 10px;
            border-radius: 999px;
            color: #3158d1;
            background: #eef2ff;
            font-size: 12.5px;
            font-weight: 700;
        }

        .topbar-link {
            padding: 9px 14px;
            border: 1px solid #dfe5ee;
            border-radius: 10px;
            color: #536179;
            background: #fff;
            font-size: 14px;
            text-decoration: none;
        }

        .topbar-link:hover {
            border-color: #b9c7df;
            color: #3158d1;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 20px;
            width: min(100% - 40px, 1120px);
            margin: 24px auto 40px;
            align-items: start;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            border: 1px solid #e7ebf2;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(30, 50, 90, 0.05);
        }

        .new-chat {
            min-height: 42px;
            border: 0;
            border-radius: 11px;
            color: #fff;
            background: #4169e1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .new-chat:hover {
            background: #3158d1;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 58vh;
            overflow-y: auto;
        }

        .chat-item {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid transparent;
            border-radius: 10px;
            color: #3f4b5f;
            background: #f7f9fd;
            font: inherit;
            font-size: 13.5px;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
        }

        .chat-item:hover {
            background: #eef2fb;
        }

        .chat-item.active {
            border-color: #c9d6f7;
            color: #2447c4;
            background: #eef2ff;
        }

        .chat-item-title {
            display: block;
            overflow: hidden;
            font-weight: 650;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chat-item-time {
            display: block;
            margin-top: 4px;
            color: #9aa4b6;
            font-size: 11.5px;
        }

        .sidebar-note {
            margin: 0;
            color: #9aa4b6;
            font-size: 12.5px;
            text-align: center;
            line-height: 1.6;
        }

        .sidebar-note[hidden] {
            display: none;
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 70vh;
            border: 1px solid #e7ebf2;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(30, 50, 90, 0.05);
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid #eef1f6;
        }

        .panel-header h1 {
            margin: 0;
            font-size: 17px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .panel-meta {
            flex: none;
            color: #9aa4b6;
            font-size: 12.5px;
        }

        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 22px;
            overflow-y: auto;
            max-height: 52vh;
        }

        .empty {
            margin: auto;
            color: #9aa4b6;
            font-size: 14px;
            text-align: center;
            line-height: 1.8;
            white-space: pre-line;
        }

        .bubble {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14.5px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bubble.user {
            align-self: flex-end;
            color: #fff;
            background: #4169e1;
            border-bottom-right-radius: 5px;
        }

        .bubble.assistant {
            align-self: flex-start;
            color: #27344a;
            background: #f4f6fb;
            border-bottom-left-radius: 5px;
        }

        .bubble.pending {
            color: #738097;
            font-style: italic;
        }

        .bubble-meta {
            display: block;
            margin-top: 6px;
            font-size: 11.5px;
            opacity: 0.75;
        }

        .composer {
            padding: 14px 22px 20px;
            border-top: 1px solid #eef1f6;
            background: #fdfefe;
        }

        .model-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .model-bar label {
            color: #4a576d;
            font-size: 13px;
            font-weight: 650;
        }

        select {
            min-height: 38px;
            padding: 0 10px;
            border: 1px solid #dce2ec;
            border-radius: 10px;
            background: #fff;
            color: #172033;
            font: inherit;
            font-size: 13.5px;
            outline: none;
        }

        select:focus {
            border-color: #5478ed;
            box-shadow: 0 0 0 3px rgba(84, 120, 237, 0.14);
        }

        .model-price {
            color: #8994a7;
            font-size: 12.5px;
        }

        textarea {
            width: 100%;
            min-height: 76px;
            padding: 12px 14px;
            border: 1px solid #dce2ec;
            border-radius: 12px;
            background: #fff;
            color: #172033;
            font: inherit;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #5478ed;
            box-shadow: 0 0 0 3px rgba(84, 120, 237, 0.14);
        }

        .composer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 10px;
        }

        .cost-hint {
            color: #8994a7;
            font-size: 12.5px;
            line-height: 1.5;
        }

        .send-button {
            min-height: 42px;
            padding: 0 22px;
            border: 0;
            border-radius: 11px;
            color: #fff;
            background: #4169e1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .send-button:hover {
            background: #3158d1;
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            margin: 12px 0 0;
            padding: 12px 14px;
            border: 1px solid #e3eaf8;
            border-radius: 12px;
            color: #536179;
            background: #f8faff;
            font-size: 13.5px;
            line-height: 1.6;
        }

        .status[hidden] {
            display: none;
        }

        .status.error {
            border-color: #f2d4d7;
            color: #a4313c;
            background: #fff8f8;
        }

        .status.success {
            border-color: #cfe8da;
            color: #1f7a52;
            background: #f6fdf9;
        }

        @media (max-width: 820px) {
            .layout {
                grid-template-columns: 1fr;
                width: min(100% - 24px, 1120px);
            }

            .chat-list {
                max-height: 24vh;
                flex-direction: row;
                flex-wrap: nowrap;
                overflow-x: auto;
            }

            .chat-item {
                min-width: 160px;
            }

            .bubble {
                max-width: 88%;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">V</span>
            <span>Vitual XRing</span>
        </a>
        <div class="topbar-actions">
            <span class="balance-chip">余额 <b id="balance">—</b> VTX</span>
            <span class="version">v5.2</span>
            <a class="topbar-link" href="image.html">AI 生图</a>
            <a class="topbar-link" href="manager.html">返回账户</a>
        </div>
    </header>

    <main class="layout">
        <aside class="sidebar">
            <button id="new-chat" class="new-chat" type="button">＋ 新建对话</button>
            <div id="chat-list" class="chat-list" role="listbox" aria-label="对话列表"></div>
            <p id="chat-empty" class="sidebar-note" hidden>暂无对话</p>
            <p class="sidebar-note" id="storage-note">聊天记录保存在本浏览器中</p>
        </aside>

        <section class="panel">
            <div class="panel-header">
                <h1 id="chat-title">新对话</h1>
                <span id="chat-meta" class="panel-meta"></span>
            </div>

            <div id="messages" class="messages"></div>

            <form id="composer" class="composer">
                <div class="model-bar">
                    <label for="model-select">模型</label>
                    <select id="model-select"></select>
                    <span id="model-price" class="model-price"></span>
                </div>
                <textarea id="message-input" rows="3" maxlength="2000" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
                <div class="composer-actions">
                    <span id="cost-hint" class="cost-hint"></span>
                    <button id="send-button" class="send-button" type="submit">发送</button>
                </div>
                <p id="chat-message" class="status" role="status" aria-live="polite" hidden></p>
            </form>
        </section>
    </main>

    <script src="vtx-crypto.js?v=5.2"></script>
    <script src="vtx-api.js?v=5.2"></script>

    <script>
        const MODELS = [
            {
                id: "openai/gpt-6-astra",
                label: "GPT-6 Astra（满配 · 最高推理）",
                inputPerChar: 10,
                outputPerChar: 2,
                reasoningEffort: "high"
            },
            {
                id: "openai/gpt-6-luna",
                label: "GPT-6 Luna",
                inputPerChar: 4,
                outputPerChar: 0.75
            },
            {
                id: "deepseek/deepseek-v4-flash",
                label: "DeepSeek V4 Flash（经济）",
                inputPerChar: 0.05,
                outputPerChar: 0.0005
            },
            {
                id: "openai/gpt-6.1-sol",
                label: "GPT-6.1 Sol",
                inputPerChar: 4,
                outputPerChar: 0.8
            }
        ];

        const HISTORY_LIMIT = 20;
        const SYSTEM_PROMPT = "你是 Vitual XRing 的助手，请用简体中文、简洁友好地回答。";

        const accountName = sessionStorage.getItem("vtxAccount");
        const storageKey = `vtxChats:${accountName}`;
        const modelKey = `vtxChatModel:${accountName}`;

        const elements = {
            balance: document.getElementById("balance"),
            chatList: document.getElementById("chat-list"),
            chatEmpty: document.getElementById("chat-empty"),
            title: document.getElementById("chat-title"),
            meta: document.getElementById("chat-meta"),
            messages: document.getElementById("messages"),
            input: document.getElementById("message-input"),
            costHint: document.getElementById("cost-hint"),
            send: document.getElementById("send-button"),
            feedback: document.getElementById("chat-message"),
            modelSelect: document.getElementById("model-select"),
            modelPrice: document.getElementById("model-price")
        };

        let account = null;
        let chats = [];
        let activeId = null;
        let busy = false;
        let modelId = localStorage.getItem(modelKey) || MODELS[2].id;

        function chars(text) {
            return Array.from(text).length;
        }

        function toCents(value) {
            const amount = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
            return Number.isFinite(amount) ? Math.round(amount * 100) : 0;
        }

        function fromCents(cents) {
            return (cents / 100).toFixed(2);
        }

        function currentModel() {
            return MODELS.find((model) => model.id === modelId) || MODELS[2];
        }

        function inputCents(text, model) {
            return Math.ceil(Number((chars(text) * model.inputPerChar * 100).toFixed(4)));
        }

        function outputCents(text, model) {
            return Math.max(0, Math.ceil(Number((chars(text) * model.outputPerChar * 100).toFixed(4))));
        }

        function formatPrice(model) {
            const output = model.outputPerChar < 0.01
                ? `${(model.outputPerChar * 20).toFixed(2)} VTX/20 字符`
                : `${model.outputPerChar} VTX/字符`;
            return `输入 ${model.inputPerChar} VTX/字符 · 输出 ${output}`;
        }

        function now() {
            const date = new Date();
            const pad = (value) => String(value).padStart(2, "0");
            return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} `
                + `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function showMessage(text, kind) {
            elements.feedback.textContent = text;
            elements.feedback.className = `status ${kind || ""}`;
            elements.feedback.hidden = false;
        }

        function hideMessage() {
            elements.feedback.hidden = true;
        }

        function activeChat() {
            return chats.find((chat) => chat.id === activeId) || null;
        }

        function titleFor(text) {
            const clean = text.replace(/\s+/g, " ").trim();
            return chars(clean) > 16 ? `${Array.from(clean).slice(0, 16).join("")}…` : clean;
        }

        function loadChats() {
            try {
                const parsed = JSON.parse(localStorage.getItem(storageKey) || "[]");
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function saveChats() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(chats));
            } catch (error) {
                showMessage("聊天记录保存失败：浏览器存储空间可能已满。", "error");
            }
        }

        function renderBalance() {
            elements.balance.textContent = account ? fromCents(toCents(account.money)) : "—";
        }

        function renderModelBar() {
            elements.modelPrice.textContent = formatPrice(currentModel());
        }

        function renderChatList() {
            elements.chatList.textContent = "";
            elements.chatEmpty.hidden = chats.length > 0;

            for (const chat of chats.slice().reverse()) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = chat.id === activeId ? "chat-item active" : "chat-item";
                button.setAttribute("role", "option");
                button.setAttribute("aria-selected", String(chat.id === activeId));

                const title = document.createElement("span");
                title.className = "chat-item-title";
                title.textContent = chat.title || "新对话";

                const time = document.createElement("span");
                time.className = "chat-item-time";
                time.textContent = chat.updatedAt || chat.createdAt || "";

                button.append(title, time);
                button.addEventListener("click", () => {
                    if (busy) {
                        return;
                    }
                    activeId = chat.id;
                    renderChatList();
                    renderMessages();
                });
                elements.chatList.appendChild(button);
            }
        }

        function appendBubble(message) {
            const bubble = document.createElement("div");
            bubble.className = `bubble ${message.role === "user" ? "user" : "assistant"}`;
            bubble.textContent = message.content;

            const metaParts = [];
            if (message.time) {
                metaParts.push(message.time);
            }
            if (message.model) {
                metaParts.push(message.model);
            }
            if (message.cost) {
                metaParts.push(`${message.cost} VTX`);
            }
            if (message.fallback) {
                metaParts.push("已用免费模型代答");
            }
            if (metaParts.length) {
                const meta = document.createElement("span");
                meta.className = "bubble-meta";
                meta.textContent = metaParts.join(" · ");
                bubble.appendChild(meta);
            }

            elements.messages.appendChild(bubble);
            elements.messages.scrollTop = elements.messages.scrollHeight;
            return bubble;
        }

        function renderMessages() {
            const chat = activeChat();
            elements.messages.textContent = "";
            hideMessage();

            if (!chat || !chat.messages || chat.messages.length === 0) {
                elements.title.textContent = chat ? (chat.title || "新对话") : "新对话";
                elements.meta.textContent = "";
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = `输入一条消息开始对话。\n${formatPrice(currentModel())}`;
                elements.messages.appendChild(empty);
                return;
            }

            elements.title.textContent = chat.title || "新对话";
            elements.meta.textContent = `${chat.messages.length} 条消息`;

            for (const message of chat.messages) {
                appendBubble(message);
            }
        }

        function updateCostHint() {
            const model = currentModel();
            const text = elements.input.value;

            if (!text) {
                elements.costHint.textContent = `${formatPrice(model)}`;
                return;
            }

            const cents = inputCents(text, model);
            elements.costHint.textContent = `输入 ${chars(text)} 字符 ≈ ${fromCents(cents)} VTX（${model.label}）`;
        }

        function createChat() {
            const chat = {
                id: `c${Date.now()}${Math.floor(Math.random() * 1000)}`,
                title: "",
                createdAt: now(),
                updatedAt: now(),
                messages: []
            };
            chats.push(chat);
            activeId = chat.id;
            saveChats();
            renderChatList();
            return chat;
        }

        function startNewChat() {
            if (busy) {
                return;
            }
            createChat();
            renderMessages();
            elements.input.value = "";
            updateCostHint();
            elements.input.focus();
        }

        function looksLikeServiceError(text) {
            if (chars(text) > 400) {
                return false;
            }
            const lowered = text.toLowerCase();
            return [
                "reached its budget",
                "raise the key budget",
                "invalid model",
                "requires a token"
            ].some((marker) => lowered.includes(marker));
        }

        async function postChat(messages, maxTokens, targetModel, signal) {
            const payload = {
                model: targetModel,
                referrer: "xsmmc.caldson.us.ci",
                max_tokens: maxTokens,
                messages
            };

            if (currentModel().reasoningEffort) {
                payload.reasoning_effort = currentModel().reasoningEffort;
            }

            const response = await fetch("https://text.pollinations.ai/openai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                signal,
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const hint = response.status === 402
                    ? "所选模型暂时不可用（HTTP 402）"
                    : response.status === 404
                        ? "所选模型不存在（HTTP 404）"
                        : `AI 服务返回错误（HTTP ${response.status}）`;
                const error = new Error(`${hint}，本次不计费。`);
                error.status = response.status;
                throw error;
            }

            const data = await response.json();
            const content = data && data.choices && data.choices[0] && data.choices[0].message
                ? String(data.choices[0].message.content || "").trim()
                : "";

            if (!content) {
                throw new Error("AI 没有返回内容，请重试。");
            }

            if (looksLikeServiceError(content)) {
                const error = new Error("AI 服务额度暂时不可用，本次不计费。");
                error.status = 429;
                throw error;
            }

            return content;
        }

        async function withTimeout(seconds, run) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), seconds * 1000);
            try {
                return await run(controller.signal);
            } finally {
                clearTimeout(timer);
            }
        }

        async function requestOnce(messages, maxTokens, targetModel) {
            return withTimeout(45, async (signal) => {
                return postChat(messages, maxTokens, targetModel, signal);
            });
        }

        async function requestReply(messages, maxTokens) {
            const model = currentModel();
            let lastError;

            for (let attempt = 0; attempt < 2; attempt += 1) {
                try {
                    return await requestOnce(messages, maxTokens, model.id);
                } catch (error) {
                    lastError = error;
                    if (error.status) {
                        break;
                    }
                    await new Promise((resolve) => setTimeout(resolve, 1200));
                }
            }

            if (lastError && lastError.name === "AbortError") {
                throw new Error("AI 服务响应超时，本次不计费，请稍后再试。");
            }
            throw lastError || new Error("AI 请求失败。");
        }

        async function sendMessage(event) {
            event.preventDefault();

            if (busy || !account) {
                return;
            }

            const text = elements.input.value.trim();
            const model = currentModel();

            hideMessage();

            if (!text) {
                showMessage("请输入内容。", "error");
                return;
            }
            if (chars(text) > 2000) {
                showMessage("单条消息不能超过 2000 字符。", "error");
                return;
            }

            const inputCost = inputCents(text, model);
            const balanceCents = toCents(account.money);

            if (balanceCents < inputCost) {
                showMessage(
                    `余额不足：${model.label} 的输入需要 ${fromCents(inputCost)} VTX，当前余额 ${fromCents(balanceCents)} VTX。`,
                    "error"
                );
                return;
            }

            const existingChat = activeChat();
            const chat = existingChat || {
                id: `c${Date.now()}${Math.floor(Math.random() * 1000)}`,
                title: "",
                createdAt: now(),
                updatedAt: now(),
                messages: []
            };
            const history = (chat.messages || [])
                .slice(-HISTORY_LIMIT)
                .map((message) => ({ role: message.role, content: message.content }));

            const maxOutputChars = Math.floor((balanceCents - inputCost) / (model.outputPerChar * 100));
            if (maxOutputChars < 20) {
                showMessage("余额不足以生成回复，请先签到或改用更便宜的模型。", "error");
                return;
            }
            const maxTokens = Math.max(16, Math.min(1200, Math.floor(maxOutputChars / 2)));

            busy = true;
            elements.send.disabled = true;
            elements.send.textContent = "生成中…";
            elements.input.disabled = true;
            elements.modelSelect.disabled = true;

            const pending = document.createElement("div");
            pending.className = "bubble assistant pending";
            pending.textContent = "AI 正在思考…";
            elements.messages.appendChild(pending);
            elements.messages.scrollTop = elements.messages.scrollHeight;

            try {
                const messages = [{ role: "system", content: SYSTEM_PROMPT }, ...history, { role: "user", content: text }];
                const reply = await requestReply(messages, maxTokens);
                pending.remove();

                const totalCents = Math.min(balanceCents, inputCost + outputCents(reply, model));
                const time = now();
                const modelShort = model.label.replace(/（.*?）/g, "").trim();

                const updated = await window.VTXApi.commit((data) => {
                    const target = data[accountName];
                    if (!target) {
                        throw new Error("当前账户在 account.json 中不存在。");
                    }

                    const charge = Math.min(toCents(target.money), totalCents);
                    target.money = fromCents(toCents(target.money) - charge);
                    target.trades = Array.isArray(target.trades) ? target.trades : [];
                    target.trades.push({
                        name: "AI 聊天",
                        description: `${modelShort} · 输入 ${chars(text)} 字符 / 输出 ${chars(reply)} 字符`,
                        price: `-${fromCents(charge)}`,
                        time,
                        from: target.username || accountName,
                        to: "AI"
                    });

                    return `AI 聊天：${target.username || accountName} -${fromCents(charge)} VTX（${modelShort}）`;
                });

                const refreshed = updated;
                account = refreshed[accountName] || account;

                chat.messages = Array.isArray(chat.messages) ? chat.messages : [];
                chat.messages.push({ role: "user", content: text, time, cost: fromCents(inputCost), model: modelShort });
                chat.messages.push({
                    role: "assistant",
                    content: reply,
                    time,
                    cost: fromCents(Math.max(0, totalCents - inputCost)),
                    model: modelShort
                });
                chat.title = chat.title || titleFor(text);
                chat.updatedAt = time;

                if (!existingChat) {
                    chats.push(chat);
                    activeId = chat.id;
                }
                saveChats();

                renderBalance();
                renderChatList();
                renderMessages();
                elements.input.value = "";
                updateCostHint();

                showMessage(`已扣费 ${fromCents(totalCents)} VTX（${modelShort}）。`, "success");
            } catch (error) {
                pending.remove();
                showMessage(
                    error instanceof TypeError
                        ? "网络请求失败，请检查网络后再试。"
                        : error.message,
                    "error"
                );
            } finally {
                busy = false;
                elements.send.disabled = false;
                elements.send.textContent = "发送";
                elements.input.disabled = false;
                elements.modelSelect.disabled = false;
                elements.input.focus();
            }
        }

        function initModelSelect() {
            for (const model of MODELS) {
                const option = document.createElement("option");
                option.value = model.id;
                option.textContent = `${model.label} · ${formatPrice(model)}`;
                elements.modelSelect.appendChild(option);
            }

            if (!MODELS.some((model) => model.id === modelId)) {
                modelId = MODELS[2].id;
            }
            elements.modelSelect.value = modelId;
            renderModelBar();
        }

        document.getElementById("new-chat").addEventListener("click", startNewChat);
        elements.input.addEventListener("input", updateCostHint);
        elements.input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                document.getElementById("composer").requestSubmit();
            }
        });
        elements.modelSelect.addEventListener("change", () => {
            modelId = elements.modelSelect.value;
            localStorage.setItem(modelKey, modelId);
            renderModelBar();
            updateCostHint();
            renderMessages();
        });
        document.getElementById("composer").addEventListener("submit", sendMessage);

        async function init() {
            if (!accountName) {
                window.location.replace("login.html");
                return;
            }

            initModelSelect();

            try {
                const accounts = await window.VTXApi.readAll();
                account = accounts[accountName];

                if (!account) {
                    sessionStorage.removeItem("vtxAccount");
                    window.location.replace("login.html");
                    return;
                }

                chats = loadChats();
                activeId = chats.length ? chats[chats.length - 1].id : null;
                renderBalance();
                renderChatList();
                renderMessages();
                updateCostHint();
            } catch (error) {
                showMessage(
                    error instanceof TypeError
                        ? "无法读取账户数据，请检查网络。"
                        : error.message,
                    "error"
                );
            }
        }

        init();
    </script>
</body>
</html>
