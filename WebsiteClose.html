<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f2430">
    <meta name="robots" content="noindex">
    <title>Vitual XRing 停服公告</title>
    <script>document.write('<script src="vtx-closed.js?t=' + Date.now() + '"><\/script>');</script>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            --ink: #eef2f8;
            --muted: #a8b3c6;
            --line: rgba(255, 255, 255, 0.14);
        }

        * { box-sizing: border-box; }

        [hidden] { display: none !important; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            padding: 28px;
            padding-top: calc(28px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            background:
                radial-gradient(circle at 18% 12%, rgba(127, 155, 255, 0.28) 0, transparent 42%),
                radial-gradient(circle at 84% 86%, rgba(60, 190, 150, 0.22) 0, transparent 40%),
                linear-gradient(160deg, #1a1f2b 0%, #232a3a 100%);
            color: var(--ink);
            -webkit-text-size-adjust: 100%;
        }

        .card {
            width: min(100%, 520px);
            padding: 34px 30px 28px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: rgba(28, 34, 46, 0.78);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.36);
            text-align: center;
        }

        .mark {
            width: 54px;
            height: 54px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 22px;
            letter-spacing: 0.01em;
        }

        .status {
            display: inline-block;
            margin-bottom: 16px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(240, 161, 59, 0.16);
            color: #f3b45f;
            font-size: 12.5px;
            font-weight: 700;
        }

        .status.open {
            background: rgba(60, 190, 150, 0.16);
            color: #5ed3a8;
        }

        p {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .countdown {
            margin: 20px 0 6px;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.03em;
            font-variant-numeric: tabular-nums;
        }

        .countdown small {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 22px;
        }

        button, a.button {
            display: inline-block;
            padding: 11px 20px;
            border: 1px solid transparent;
            border-radius: 12px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            touch-action: manipulation;
        }

        .primary {
            color: #fff;
            background: linear-gradient(135deg, #3867e8, #5b83ff);
        }

        .ghost {
            color: #cfd9ea;
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--line);
        }

        .foot {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: #7d8798;
            font-size: 11.5px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark">V</div>
        <h1 id="title">Vitual XRing 暂时停服</h1>
        <span class="status" id="status">正在停服维护</span>
        <p id="summary">站点正在进行临时维护，此期间所有页面都无法使用，请稍后再来。</p>

        <div class="countdown" id="countdown" hidden><span id="countdown-value">--:--</span><small id="countdown-note">距离恢复</small></div>

        <div class="actions">
            <a class="button primary" id="back-link" href="index.html" hidden>返回刚才的页面</a>
            <button class="ghost" type="button" id="reload-button">重新检测</button>
        </div>

        <p class="foot" id="foot">维护窗口：读取中…</p>
    </main>

    <script>
        (function () {
            "use strict";

            var closure = window.VTXClosure || null;
            var params = new URLSearchParams(window.location.search);
            var title = document.getElementById("title");
            var status = document.getElementById("status");
            var summary = document.getElementById("summary");
            var countdown = document.getElementById("countdown");
            var countdownValue = document.getElementById("countdown-value");
            var note = document.getElementById("countdown-note");
            var foot = document.getElementById("foot");
            var backLink = document.getElementById("back-link");
            var reloadButton = document.getElementById("reload-button");

            // 只接受站内相对路径，避免 ?from= 被用来跳到别的站点
            function safeBack(raw) {
                var value = String(raw || "").trim();
                if (!value || value.charAt(0) === "/" || value.charAt(0) === "\\") {
                    return "";
                }
                if (/^[a-z][a-z0-9+.-]*:/i.test(value) || value.indexOf("\\") >= 0) {
                    return "";
                }
                return value;
            }

            var back = safeBack(params.get("from"));

            // 统一按站点根目录解析，页面放在子目录时也不会拼错
            function backHref(value) {
                if (!value) {
                    return "index.html";
                }
                if (window.location.protocol === "file:") {
                    return value;
                }
                try {
                    return new URL(value, `${window.location.origin}/`).href;
                } catch (error) {
                    return "index.html";
                }
            }

            function showBack(href, text) {
                backLink.href = href;
                backLink.textContent = text;
                backLink.hidden = false;
            }

            function renderOpen() {
                document.title = "服务已恢复 | Vitual XRing";
                title.textContent = "Vitual XRing 已恢复";
                status.textContent = "服务正常";
                status.className = "status open";
                summary.textContent = "停服已经结束，现在可以正常使用站点。";
                countdown.hidden = true;
                reloadButton.textContent = "进入站点";
                showBack(back ? backHref(back) : "index.html", back ? "回到刚才的页面" : "回到首页");
            }

            reloadButton.addEventListener("click", () => {
                if (closure && closure.active) {
                    window.location.reload();
                    return;
                }
                window.location.href = back ? backHref(back) : "index.html";
            });

            if (!closure) {
                title.textContent = "Vitual XRing 暂时停服";
                status.textContent = "状态未知";
                summary.textContent = "停服时间表加载失败（vtx-closed.js 没有读到），请检查网络后重新检测。";
                foot.textContent = "维护窗口：未知";
                return;
            }

            var windows = closure.windows || [];
            foot.textContent = windows.length
                ? `维护窗口：${windows.map((item) => `${closure.formatTime(item.start)} ~ ${closure.formatTime(item.end)}`).join("、")}（北京时间）`
                : "维护窗口：未配置";

            if (!closure.active) {
                renderOpen();
                return;
            }

            var endAt = closure.end;

            (function tick() {
                var remain = endAt - Date.now();
                if (remain <= 0) {
                    renderOpen();
                    return;
                }
                title.textContent = "Vitual XRing 暂时停服";
                status.textContent = "正在停服维护";
                status.className = "status";
                summary.textContent = "站点正在进行临时维护，此期间所有页面都无法使用，请稍后再来。";
                countdown.hidden = false;
                countdownValue.textContent = closure.formatDuration(remain);
                note.textContent = `距离恢复（预计 ${closure.formatTime(endAt)}）`;
                backLink.hidden = true;
                setTimeout(tick, 1000);
            })();
        })();
    </script>
</body>
</html>
