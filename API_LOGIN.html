<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 停服守卫：停服期间任何页面都会跳到 WebsiteClose.html，时间表见 vtx-closed.js -->
    <script>document.write('<script src="vtx-closed.js?t=' + Date.now() + '"><\/script>');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>API 登录 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, #e2edff 0, transparent 34%),
                radial-gradient(circle at 90% 85%, #e4f5f0 0, transparent 30%),
                #f4f7fb;
        }

        .card {
            width: min(100%, 440px);
            padding: 38px;
            border: 1px solid #e7ebf2;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 24px 70px rgba(30, 50, 90, 0.12);
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            color: #fff;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-size: 22px;
            font-weight: 800;
        }

        h1 {
            margin: 22px 0 8px;
            font-size: 26px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #738097;
            line-height: 1.6;
            font-size: 14px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 46px;
            padding: 0 14px;
            border: 1px solid #dce2ec;
            border-radius: 12px;
            outline: none;
            background: #fff;
            color: #172033;
            font: inherit;
        }

        input:focus {
            border-color: #5478ed;
            box-shadow: 0 0 0 3px rgba(84, 120, 237, 0.14);
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: #4169e1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #3158d1;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .ghost-button {
            width: auto;
            min-height: 38px;
            margin: 0;
            padding: 0 16px;
            border: 1px solid #dfe5ee;
            color: #536179;
            background: #fff;
            font-size: 13.5px;
            font-weight: 650;
        }

        .ghost-button:hover {
            border-color: #b9c7df;
            color: #3158d1;
            background: #fff;
        }

        .message {
            min-height: 20px;
            margin: 14px 0 0;
            color: #bd3545;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .message.ok {
            color: #1f7a52;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 22px;
            padding: 5px;
            border-radius: 14px;
            background: #eef2f9;
        }

        .tabs button {
            min-height: 40px;
            margin: 0;
            border-radius: 10px;
            background: transparent;
            color: #64708a;
            font-size: 14px;
            font-weight: 650;
        }

        .tabs button:hover {
            background: rgba(255, 255, 255, 0.6);
            color: #3158d1;
        }

        .tabs button.active {
            background: #fff;
            color: #3158d1;
            box-shadow: 0 2px 10px rgba(49, 88, 209, 0.14);
        }

        .auto-note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            padding: 11px 14px;
            border: 1px solid #d8e3fb;
            border-radius: 11px;
            color: #3158d1;
            background: #f5f8ff;
            font-size: 13.5px;
        }

        .auto-note[hidden],
        .tabs[hidden],
        form[hidden],
        .result[hidden] {
            display: none;
        }

        .result {
            text-align: center;
        }

        .success-mark {
            width: 56px;
            height: 56px;
            margin: 4px auto 14px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            background: linear-gradient(135deg, #23a06a, #1f7a52);
            font-size: 27px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(31, 122, 82, 0.28);
        }

        .result h2 {
            margin: 0 0 8px;
            font-size: 19px;
            color: #172033;
            font-weight: 700;
        }

        .success-text {
            margin: 0 0 18px;
            color: #55617a;
            font-size: 14px;
            line-height: 1.65;
        }

        .result-details {
            margin-bottom: 14px;
            text-align: left;
        }

        .result-details summary {
            cursor: pointer;
            color: #8d95a8;
            font-size: 12px;
            list-style: none;
        }

        .result-details summary::-webkit-details-marker {
            display: none;
        }

        .result-details summary::before {
            content: "▸ ";
        }

        .result-details[open] summary::before {
            content: "▾ ";
        }

        .result-switch {
            margin: 0 auto;
            display: block;
        }

        .result-meta {
            margin: 0 0 18px;
            color: #8994a7;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .token-box {
            margin: 0 0 16px;
            padding: 12px 14px;
            border: 1px solid #e7ebf2;
            border-radius: 12px;
            background: #f7f9fd;
            color: #536179;
            font-family: Consolas, "Courier New", monospace;
            font-size: 11.5px;
            line-height: 1.5;
            text-align: left;
            word-break: break-all;
            max-height: 92px;
            overflow-y: auto;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .hint {
            margin: 18px 0 0;
            color: #9aa4b6;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
            word-break: break-all;
        }

        .version-badge {
            position: fixed;
            top: 18px;
            right: 20px;
            padding: 6px 12px;
            border-radius: 999px;
            color: #3158d1;
            background: #eef2ff;
            font-size: 12.5px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <span class="version-badge">v1.7.0</span>

    <main class="card">
        <div class="brand-mark" aria-hidden="true">V</div>
        <h1>API 登录</h1>
        <p class="subtitle">登录或创建 Vitual XRing 账户。</p>

        <div id="auto-login-note" class="auto-note" hidden>
            <span id="auto-login-text">正在自动登录…</span>
            <button id="switch-account" class="ghost-button" type="button">切换账户</button>
        </div>

        <div class="tabs" id="auth-tabs" role="tablist">
            <button id="tab-login" class="active" type="button" role="tab" aria-selected="true">登录</button>
            <button id="tab-register" type="button" role="tab" aria-selected="false">创建账户</button>
        </div>

        <form id="login-form">
            <div class="field">
                <label for="login-name">登录账户名</label>
                <input id="login-name" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="login-password">密码</label>
                <input id="login-password" type="password" autocomplete="current-password" required>
            </div>
            <button id="login-button" type="submit">登录</button>
            <p id="login-message" class="message" role="alert" aria-live="polite"></p>
        </form>

        <form id="register-form" hidden>
            <div class="field">
                <label for="register-name">登录账户名</label>
                <input id="register-name" type="text" maxlength="20" autocomplete="username" required placeholder="2-20 个字符，不能有空格">
            </div>
            <div class="field">
                <label for="register-display">显示名称（选填）</label>
                <input id="register-display" type="text" maxlength="24" autocomplete="nickname" placeholder="留空则与登录账户名相同">
            </div>
            <div class="field">
                <label for="register-password">密码</label>
                <input id="register-password" type="password" minlength="6" autocomplete="new-password" required placeholder="至少 6 个字符">
            </div>
            <div class="field">
                <label for="register-confirm">确认密码</label>
                <input id="register-confirm" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <button id="register-button" type="submit">创建并登录</button>
            <p id="register-message" class="message" role="alert" aria-live="polite"></p>
        </form>

        <div id="result" class="result" hidden>
            <div class="success-mark" aria-hidden="true">✓</div>
            <h2 id="result-title">登录成功</h2>
            <p id="result-message" class="success-text">登录成功，如果没有自动跳转，请刷新并重试。</p>
            <details class="result-details">
                <summary>开发者信息</summary>
                <p id="result-meta" class="result-meta"></p>
                <pre id="result-json" class="token-box"></pre>
                <div class="result-actions">
                    <button id="copy-json" class="ghost-button" type="button">复制完整结果</button>
                    <button id="copy-token" class="ghost-button" type="button">复制 token</button>
                </div>
            </details>
            <button id="logout-button" class="ghost-button result-switch" type="button">切换账户</button>
        </div>

        <p id="api-hint" class="hint"></p>
    </main>

    <script src="vtx-sdk.js?v=1.7.0"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const PRODUCTION_API = "https://xsmmc.caldson.us.ci";
        const isLocalPreview = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(window.location.hostname);
        // 生产域名下用同源；本地静态预览（如 http-server）默认指向线上 API
        const apiBase = (params.get("api") || (isLocalPreview ? PRODUCTION_API : window.location.origin)).replace(/\/+$/, "");
        const redirectUrl = params.get("redirect") || "";

        const elements = {
            form: document.getElementById("login-form"),
            name: document.getElementById("login-name"),
            password: document.getElementById("login-password"),
            button: document.getElementById("login-button"),
            message: document.getElementById("login-message"),
            registerForm: document.getElementById("register-form"),
            registerName: document.getElementById("register-name"),
            registerDisplay: document.getElementById("register-display"),
            registerPassword: document.getElementById("register-password"),
            registerConfirm: document.getElementById("register-confirm"),
            registerButton: document.getElementById("register-button"),
            registerMessage: document.getElementById("register-message"),
            tabs: document.getElementById("auth-tabs"),
            tabLogin: document.getElementById("tab-login"),
            tabRegister: document.getElementById("tab-register"),
            note: document.getElementById("auto-login-note"),
            noteText: document.getElementById("auto-login-text"),
            result: document.getElementById("result"),
            resultTitle: document.getElementById("result-title"),
            resultMessage: document.getElementById("result-message"),
            meta: document.getElementById("result-meta"),
            json: document.getElementById("result-json"),
            hint: document.getElementById("api-hint")
        };

        let session = null;

        function showError(text) {
            elements.message.className = "message";
            elements.message.textContent = text;
        }

        function showInfo(text) {
            elements.message.className = "message ok";
            elements.message.textContent = text;
        }

        function setRegisterMessage(text, ok) {
            elements.registerMessage.className = ok ? "message ok" : "message";
            elements.registerMessage.textContent = text || "";
        }

        function selectTab(name) {
            const isLogin = name !== "register";
            elements.form.hidden = !isLogin;
            elements.registerForm.hidden = isLogin;
            elements.tabs.hidden = false;
            elements.tabLogin.classList.toggle("active", isLogin);
            elements.tabRegister.classList.toggle("active", !isLogin);
            elements.tabLogin.setAttribute("aria-selected", String(isLogin));
            elements.tabRegister.setAttribute("aria-selected", String(!isLogin));
            showError("");
            setRegisterMessage("");
            const focus = isLogin ? elements.name : elements.registerName;
            if (focus) focus.focus();
        }

        function postResult(payload) {
            const targets = [];
            if (window.opener && !window.opener.closed) targets.push(window.opener);
            if (window.parent && window.parent !== window) targets.push(window.parent);
            for (const target of targets) {
                try {
                    target.postMessage(payload, "*");
                } catch (error) {
                    /* 忽略跨窗口错误 */
                }
            }
        }

        /**
         * @param {object} result 与 VTX.login() 的返回值一致：
         *        { token, expiresAt, login, account: { username, money, trades } }
         */
        function complete(result) {
            session = result;

            const account = result.account || {};

            elements.form.hidden = true;
            elements.registerForm.hidden = true;
            elements.tabs.hidden = true;
            elements.note.hidden = true;
            elements.result.hidden = false;

            if (elements.resultTitle) {
                elements.resultTitle.textContent = "登录成功";
            }
            if (elements.resultMessage) {
                elements.resultMessage.textContent = "登录成功，如果没有自动跳转，请刷新并重试。";
            }
            elements.meta.textContent = `${account.username || result.login}（登录名 ${result.login}）`;
            elements.json.textContent = JSON.stringify(result, null, 2);

            postResult({ type: "vtx-login", ok: true, result });

            if (redirectUrl) {
                try {
                    const target = new URL(redirectUrl, window.location.href);
                    const json = JSON.stringify(result);

                    if (encodeURIComponent(json).length <= 6000) {
                        // searchParams 会自动做一次 URL 编码，这里传原始 JSON
                        target.searchParams.set("vtx_result", json);
                    } else {
                        target.searchParams.set("vtx_login", result.login);
                        target.searchParams.set("vtx_token", result.token || "");
                        target.searchParams.set("vtx_money", account.money || "0.00");
                    }

                    window.location.replace(target.toString());
                } catch (error) {
                    showError("redirect 参数不是合法网址。");
                }
            }
        }

        async function tryAutoLogin() {
            if (!window.VTX.isLoggedIn()) {
                return false;
            }

            elements.note.hidden = false;
            elements.noteText.textContent = "正在使用上次的登录状态…";
            elements.form.hidden = true;
            elements.registerForm.hidden = true;
            elements.tabs.hidden = true;

            try {
                const data = await window.VTX.me();
                complete({
                    token: window.VTX.getToken(),
                    expiresAt: data.expiresAt,
                    login: data.login,
                    account: data.account
                });
                return true;
            } catch (error) {
                window.VTX.logout();
                elements.note.hidden = true;
                elements.tabs.hidden = false;
                elements.form.hidden = false;
                showError(error.status === 401 ? "登录状态已过期，请重新登录。" : error.message);
            }

            return false;
        }

        document.getElementById("switch-account").addEventListener("click", () => {
            window.VTX.logout();
            session = null;
            elements.note.hidden = true;
            elements.result.hidden = true;
            elements.tabs.hidden = false;
            elements.name.value = "";
            elements.password.value = "";
            showError("");
            selectTab("login");
        });

        document.getElementById("copy-json").addEventListener("click", async () => {
            if (!session) {
                return;
            }
            try {
                await navigator.clipboard.writeText(JSON.stringify(session, null, 2));
                elements.json.textContent = `${JSON.stringify(session, null, 2)}\n\n（已复制完整结果）`;            } catch (error) {
                showError("复制失败，请手动选择上方文本。");
            }
        });

        document.getElementById("copy-token").addEventListener("click", async () => {
            if (!session || !session.token) {
                return;
            }
            try {
                await navigator.clipboard.writeText(session.token);
                showInfo("token 已复制到剪贴板。");
            } catch (error) {
                showError("复制失败，请手动选择上方文本。");
            }
        });

        document.getElementById("logout-button").addEventListener("click", () => {
            window.VTX.logout();
            session = null;
            elements.result.hidden = true;
            elements.tabs.hidden = false;
            elements.password.value = "";
            selectTab("login");
        });

        elements.tabLogin.addEventListener("click", () => selectTab("login"));
        elements.tabRegister.addEventListener("click", () => selectTab("register"));

        elements.registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const login = elements.registerName.value.trim();
            const display = elements.registerDisplay.value.trim();
            const password = elements.registerPassword.value;
            const confirm = elements.registerConfirm.value;

            setRegisterMessage("");

            if (!/^\S{2,20}$/.test(login)) {
                setRegisterMessage("登录账户名需要 2-20 个字符，且不能包含空格。");
                return;
            }
            if (password.length < 6) {
                setRegisterMessage("密码至少 6 个字符。");
                return;
            }
            if (password !== confirm) {
                setRegisterMessage("两次输入的密码不一致。");
                return;
            }

            elements.registerButton.disabled = true;
            elements.registerButton.textContent = "正在创建…";

            try {
                const data = await window.VTX.register({ login, password, username: display });
                elements.registerPassword.value = "";
                elements.registerConfirm.value = "";
                complete(data);
            } catch (error) {
                if (error.code === "account_exists") {
                    setRegisterMessage("这个登录账户名已被占用，换一个试试。");
                } else if (error.code === "write_unavailable") {
                    setRegisterMessage("服务端暂不支持创建账户（未配置写入权限）。");
                } else if (error instanceof TypeError) {
                    setRegisterMessage(`无法连接 API（${apiBase}），请确认 Worker 已部署且地址正确。`);
                } else if (error.code === "not_json" || error.status === 404) {
                    setRegisterMessage(`${apiBase} 没有 /api 接口，请先部署 Worker。`);
                } else {
                    setRegisterMessage(error.message || "创建失败，请重试。");
                }
            } finally {
                elements.registerButton.disabled = false;
                elements.registerButton.textContent = "创建并登录";
            }
        });

        elements.form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const login = elements.name.value.trim();
            const password = elements.password.value;

            showError("");
            elements.button.disabled = true;
            elements.button.textContent = "正在登录…";

            try {
                const data = await window.VTX.login(login, password);
                complete(data);
            } catch (error) {
                if (error.status === 401) {
                    showError("登录名或密码不正确。");
                } else if (error instanceof TypeError) {
                    showError(`无法连接 API（${apiBase}），请确认 Worker 已部署且地址正确。`);
                } else if (error.code === "not_json" || error.status === 404) {
                    showError(`${apiBase} 没有 /api 接口。本地静态服务器（如 http-server）不含 Worker，请先部署 Worker，或用 ?api=<Worker地址> 指定。`);
                } else {
                    showError(error.message);
                }
            } finally {
                elements.button.disabled = false;
                elements.button.textContent = "登录";
            }
        });

        window.VTX.configure({ baseUrl: apiBase });
        elements.hint.textContent = `API：${apiBase}${isLocalPreview ? "（本地预览，默认连线上 Worker；可用 ?api=覆盖）" : ""}`;

        if (params.get("tab") === "register") selectTab("register");

        // 被其它站点以 iframe 嵌入时不做自动登录，交给宿主页面自己管理会话
        if (params.get("embed") !== "1") {
            tryAutoLogin();
        }
    </script>
</body>
</html>
