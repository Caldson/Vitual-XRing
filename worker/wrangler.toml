name = "vtx-api"
main = "index.js"
compatibility_date = "2024-11-01"
# 保留 workers.dev 地址：zone 的安全策略（质询 / Bot Fight）对它不生效，
# 程序或其它站点跨域调用时用 https://vtx-api.minecraftcaldson.workers.dev 更省事
workers_dev = true

# 只把 /api/* 交给 Worker，其余路径（页面、shop.json）继续由 GitHub Pages 提供
# 前提：xsmmc.caldson.us.ci 这条 DNS 记录必须是「已代理」（橙色云朵）
#
# 如果暂时不想动 DNS / 路由，把下面这两行注释掉即可，
# 部署后会得到一个 https://vtx-api.<你的账号>.workers.dev 地址，SDK 里填它就行。
[[routes]]
pattern = "xsmmc.caldson.us.ci/api/*"
zone_name = "caldson.us.ci"

# 8.0 起账户数据（用户名、密码、余额、交易、游戏数据、登录 IP 记录、聊天消息）
# 全部存进 Workers KV，仓库里不再保留可被任何人下载的 account.json。
# 部署前先创建命名空间，然后把输出的 id 填到下面（wrangler dev 本地调试可以用占位 id）：
#   npx wrangler kv namespace create ACCOUNTS_KV
[[kv_namespaces]]
binding = "ACCOUNTS_KV"
id = "25cb4f40f4b0482c8b8e3dbc6f619d8c"

[vars]
REPO = "Caldson/Vitual-XRing"
BRANCH = "main"
PATH = "account.json"
# 允许调用 API 的站点，多个用英文逗号分隔；"*" 表示任意站点（同域名站点无需配置）
ALLOWED_ORIGINS = "*"
# 登录 token 有效期（秒），默认 12 小时
TOKEN_TTL_SECONDS = "43200"
# 旧模式（未绑定 ACCOUNTS_KV 时）读取仓库 account.json 的缓存时间（秒）
CACHE_TTL_SECONDS = "20"
# 拥有「账号修改」等管理权限的登录名
ADMIN_ACCOUNT = "Kitawaga"
# 首次把仓库 account.json 导入 KV 后，是否删除仓库里的那份公开文件
MIGRATE_DELETE_REPO_FILE = "true"
# 是否把 KV 里的账户数据镜像回仓库 account.json（默认关闭，避免数据再次公开）
MIRROR_TO_GITHUB = "false"
# 聊天室接口开关：9.0 才对外开放，先保持 false
CHAT_ENABLED = "false"

# 需要提前设置的机密（不要写进这个文件）：
#   wrangler secret put GITHUB_TOKEN      （迁移旧 account.json / 镜像时需要 Contents 读写权限）
#   wrangler secret put SIGNING_SECRET
