<!DOCTYPE html>
<html lang="zh-CN">
<head><script src="../api-bridge.js"></script>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>XOS 虚拟云电脑 | Vitual XRing</title>
    <script src="vtx-api.js?v=5.1.1"></script>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #eaf0ff;
            background: #070b16;
            --xos-blue: #4c8dff;
            --xos-line: rgba(142, 173, 226, 0.2);
            --xos-panel: rgba(16, 24, 44, 0.94);
            --xos-muted: #8d9bb5;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #070b16;
        }

        body {
            background:
                radial-gradient(circle at 20% 0, rgba(52, 98, 210, 0.3), transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(53, 190, 184, 0.18), transparent 38%),
                #070b16;
        }

        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; }

        .xos-viewport {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .xos-screen {
            position: absolute;
            left: 0;
            top: 0;
            width: 1440px;
            height: 900px;
            overflow: hidden;
            transform-origin: top left;
            background: #0c1222;
            box-shadow: 0 0 0 1px rgba(160, 190, 255, 0.2), 0 40px 120px rgba(0, 0, 0, 0.65);
            user-select: none;
        }

        .xos-wallpaper {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 18% 14%, rgba(76, 141, 255, 0.35), transparent 36%),
                radial-gradient(circle at 82% 22%, rgba(88, 220, 196, 0.18), transparent 34%),
                radial-gradient(circle at 60% 100%, rgba(155, 95, 255, 0.22), transparent 44%),
                linear-gradient(135deg, #0b1224 0%, #101c38 48%, #0b1527 100%);
        }

        .xos-wallpaper::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(to bottom, black, transparent 78%);
        }

        .xos-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 38px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            background: rgba(7, 12, 24, 0.82);
            border-bottom: 1px solid var(--xos-line);
            backdrop-filter: blur(14px);
            z-index: 9000;
            font-size: 12px;
        }

        .xos-topbar .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #fff;
        }

        .xos-mark {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #4c8dff, #60e0c4);
            color: #071019;
            font-size: 11px;
            font-weight: 900;
        }

        .xos-topbar .edition {
            padding: 3px 9px;
            border: 1px solid var(--xos-line);
            border-radius: 999px;
            color: #a9c4ff;
            font-size: 11px;
        }

        .xos-topbar .spacer { flex: 1; }
        .xos-topbar .top-item { color: var(--xos-muted); }

        .xos-topbar select {
            border: 1px solid var(--xos-line);
            border-radius: 7px;
            padding: 3px 7px;
            background: #101b31;
            color: #dce8ff;
            font-size: 11px;
            outline: none;
        }

        .xos-desktop {
            position: absolute;
            top: 38px;
            left: 0;
            right: 0;
            bottom: 52px;
            padding: 22px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 82px);
            grid-auto-rows: 92px;
            align-content: start;
            gap: 10px 6px;
        }

        .xos-icon {
            width: 82px;
            border: 0;
            background: transparent;
            color: #f2f7ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 6px 3px;
            border-radius: 10px;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
        }

        .xos-icon:hover, .xos-icon:focus-visible {
            background: rgba(120, 165, 255, 0.16);
            outline: none;
        }

        .xos-icon .glyph {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: rgba(14, 26, 49, 0.82);
            border: 1px solid rgba(167, 199, 255, 0.2);
            font-size: 23px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .xos-icon span:last-child {
            font-size: 11px;
            line-height: 1.25;
            max-width: 78px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .xos-taskbar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            background: rgba(7, 12, 24, 0.9);
            border-top: 1px solid var(--xos-line);
            backdrop-filter: blur(16px);
            z-index: 9000;
        }

        .xos-start-btn {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(135deg, rgba(76, 141, 255, 0.9), rgba(96, 224, 196, 0.6));
            font-weight: 900;
            font-size: 14px;
        }

        .xos-task-list {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .xos-task {
            max-width: 185px;
            height: 36px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 10px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.055);
            color: #dce8ff;
            font-size: 12px;
            overflow: hidden;
            white-space: nowrap;
        }

        .xos-task.active {
            border-color: rgba(108, 165, 255, 0.55);
            background: rgba(76, 141, 255, 0.22);
        }

        .xos-task span:last-child { overflow: hidden; text-overflow: ellipsis; }

        .xos-tray {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #b7c9e8;
            font-size: 12px;
        }

        .xos-tray .dot {
            width: 7px;
            height: 7px;
            display: inline-block;
            border-radius: 50%;
            background: #55d6a8;
            box-shadow: 0 0 10px rgba(85, 214, 168, 0.8);
        }

        .xos-start {
            position: absolute;
            left: 12px;
            bottom: 60px;
            width: 520px;
            max-height: 610px;
            padding: 18px;
            border: 1px solid var(--xos-line);
            border-radius: 16px;
            background: var(--xos-panel);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(22px);
            z-index: 9500;
            overflow: auto;
        }

        .xos-start h3 { margin: 0 0 4px; font-size: 16px; }
        .xos-start .muted { color: var(--xos-muted); font-size: 12px; line-height: 1.6; }
        .xos-start-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 16px; }

        .xos-start-app {
            border: 0;
            border-radius: 10px;
            padding: 10px 6px;
            background: rgba(255, 255, 255, 0.045);
            color: #dce8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        .xos-start-app:hover { background: rgba(76, 141, 255, 0.18); }
        .xos-start-app .glyph { font-size: 21px; }

        .xos-start-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--xos-line);
            color: var(--xos-muted);
            font-size: 11px;
        }

        .xos-window {
            position: absolute;
            display: flex;
            flex-direction: column;
            min-width: 320px;
            min-height: 220px;
            border: 1px solid rgba(147, 180, 238, 0.24);
            border-radius: 12px;
            background: #0f1729;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 20;
        }

        .xos-window.active { border-color: rgba(108, 165, 255, 0.62); }
        /* 最大化时停在 XOS 顶栏下方，否则窗口标题栏会被 z-index 更高的顶栏盖住，最小化 / 还原 / 关闭都点不到。 */
        .xos-window.maximized { left: 0 !important; top: 38px !important; width: 100% !important; height: calc(100% - 90px) !important; border-radius: 0; }
        .xos-window.maximized .xos-window-resize { display: none; }

        .xos-window-head {
            height: 34px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px 0 12px;
            background: rgba(18, 29, 52, 0.96);
            border-bottom: 1px solid var(--xos-line);
            cursor: move;
            flex: 0 0 auto;
        }

        .xos-window-title { flex: 1; font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .xos-window-actions { display: flex; gap: 4px; }

        .xos-win-btn {
            width: 24px;
            height: 22px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #a9b9d6;
            font-size: 12px;
            line-height: 1;
        }

        .xos-win-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .xos-win-btn.close:hover { background: #c0392b; }

        .xos-window-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
            color: #dce8ff;
            font-size: 13px;
        }

        .xos-window-resize {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 45%, rgba(120, 170, 255, 0.5) 46%);
        }

        .xos-app { padding: 16px; }
        .xos-app h2 { margin: 0 0 4px; font-size: 16px; }
        .xos-app p { margin: 0 0 10px; color: var(--xos-muted); line-height: 1.65; }
        .xos-app .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .xos-app .grow { flex: 1; min-width: 0; }
        .xos-app .muted { color: var(--xos-muted); }
        .xos-app .tiny { font-size: 11px; line-height: 1.55; color: var(--xos-muted); }

        .xos-btn {
            border: 1px solid rgba(147, 180, 238, 0.25);
            border-radius: 8px;
            padding: 7px 11px;
            background: rgba(255, 255, 255, 0.055);
            color: #dce8ff;
            font-size: 12px;
        }

        .xos-btn:hover { border-color: rgba(108, 165, 255, 0.65); color: #fff; }
        .xos-btn.primary { border-color: #4c8dff; background: #3268d8; color: #fff; }
        .xos-btn.danger { border-color: rgba(224, 90, 90, 0.5); color: #ffb9b9; background: rgba(140, 30, 40, 0.22); }
        .xos-btn.small { padding: 5px 8px; font-size: 11px; }

        .xos-input {
            border: 1px solid rgba(147, 180, 238, 0.25);
            border-radius: 8px;
            padding: 8px 10px;
            background: #0a1222;
            color: #eaf0ff;
            font: inherit;
            font-size: 12px;
            outline: none;
            min-width: 0;
        }

        .xos-input:focus { border-color: #4c8dff; }

        .xos-app textarea.xos-input {
            width: 100%;
            resize: vertical;
            line-height: 1.65;
        }

        .xos-app .split { display: grid; grid-template-columns: 210px 1fr; min-height: 420px; }
        .xos-side { border-right: 1px solid var(--xos-line); padding: 10px; overflow: auto; }
        .xos-main { padding: 12px; overflow: auto; min-width: 0; }
        .xos-list { display: flex; flex-direction: column; gap: 3px; }

        .xos-list button {
            border: 0;
            border-radius: 6px;
            padding: 7px 8px;
            background: transparent;
            color: #c6d6f2;
            text-align: left;
            font-size: 12px;
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .xos-list button:hover, .xos-list button.active { background: rgba(76, 141, 255, 0.18); color: #fff; }

        .xos-folder { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; }
        .xos-file-card {
            border: 1px solid rgba(147, 180, 238, 0.12);
            border-radius: 9px;
            padding: 10px 7px;
            background: rgba(255, 255, 255, 0.035);
            color: #dce8ff;
            text-align: center;
            font-size: 11px;
            min-height: 82px;
            overflow: hidden;
        }

        .xos-file-card:hover { border-color: rgba(108, 165, 255, 0.5); background: rgba(76, 141, 255, 0.12); }
        .xos-file-card .glyph { display: block; font-size: 26px; margin-bottom: 5px; }
        .xos-file-card .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .xos-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
        .xos-table th, .xos-table td { padding: 7px 8px; border-bottom: 1px solid rgba(147, 180, 238, 0.1); text-align: left; }
        .xos-table th { color: var(--xos-muted); font-weight: 600; }
        .xos-table tr:hover td { background: rgba(76, 141, 255, 0.06); }

        .xos-status { padding: 5px 8px; border-top: 1px solid var(--xos-line); color: var(--xos-muted); font-size: 10.5px; }
        .xos-canvas { display: block; width: 100%; border: 1px solid rgba(147, 180, 238, 0.18); border-radius: 8px; background: #fff; max-height: 470px; }
        .xos-canvas.dark { background: #0a1120; }
        .xos-toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .xos-toolbar button.on { border-color: #4c8dff; background: rgba(76, 141, 255, 0.22); }
        .xos-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .xos-panel { padding: 10px; border: 1px solid rgba(147, 180, 238, 0.14); border-radius: 9px; background: rgba(255, 255, 255, 0.025); }
        .xos-panel h3 { margin: 0 0 7px; font-size: 12px; }
        .xos-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .xos-kpi div { padding: 10px; border: 1px solid rgba(147, 180, 238, 0.14); border-radius: 9px; background: rgba(255, 255, 255, 0.035); }
        .xos-kpi b { display: block; margin-top: 3px; font-size: 15px; }
        .xos-terminal { min-height: 380px; padding: 10px; border-radius: 8px; background: #050a13; color: #9fe7c8; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow: auto; }
        .xos-terminal input { width: 100%; border: 0; background: transparent; color: #d9fff0; font-family: Consolas, monospace; outline: none; }

        .xos-boot, .xos-gate {
            position: fixed;
            inset: 0;
            z-index: 12000;
            display: grid;
            place-items: center;
            background: #070b16;
            color: #eaf0ff;
        }

        .xos-boot-card { text-align: center; }
        .xos-boot-mark { width: 74px; height: 74px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 20px; background: linear-gradient(135deg, #4c8dff, #60e0c4); color: #071019; font-size: 26px; font-weight: 900; }
        .xos-boot-bar { width: 260px; height: 5px; margin: 18px auto 0; border-radius: 99px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
        .xos-boot-bar i { display: block; width: 0; height: 100%; background: linear-gradient(90deg, #4c8dff, #60e0c4); animation: xos-load 1.2s ease forwards; }
        @keyframes xos-load { to { width: 100%; } }

        .xos-gate-inner { width: min(100% - 40px, 1120px); max-height: calc(100vh - 60px); overflow: auto; padding: 8px 0 24px; }
        .xos-gate-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .xos-gate-head h1 { margin: 0; font-size: 30px; }
        .xos-gate-sub { margin: 0 0 20px; color: var(--xos-muted); line-height: 1.7; }
        .xos-gate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 12px; }
        .xos-gate-card { padding: 16px; border: 1px solid var(--xos-line); border-radius: 14px; background: rgba(15, 24, 44, 0.9); }
        .xos-gate-card h3 { margin: 0 0 6px; font-size: 16px; }
        .xos-gate-card .price { color: #8db8ff; font-size: 20px; font-weight: 800; }
        .xos-gate-card ul { margin: 10px 0; padding-left: 18px; color: #b9c9e5; font-size: 11.5px; line-height: 1.75; }
        .xos-gate-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
        .xos-link { color: #9fc4ff; text-decoration: none; }
        .xos-link:hover { text-decoration: underline; }

        .xos-notify-wrap { position: absolute; right: 16px; bottom: 64px; width: 280px; display: flex; flex-direction: column; gap: 6px; z-index: 9800; }
        .xos-notify { padding: 10px 12px; border: 1px solid var(--xos-line); border-radius: 9px; background: rgba(16, 26, 48, 0.96); color: #dce8ff; font-size: 11.5px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }

        .xos-modal-back {
            position: absolute;
            inset: 0;
            z-index: 9900;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, 0.55);
        }

        .xos-modal {
            width: min(100% - 40px, 520px);
            max-height: 80%;
            overflow: auto;
            padding: 18px;
            border: 1px solid var(--xos-line);
            border-radius: 14px;
            background: #111b30;
            color: #eaf0ff;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 720px) {
            .xos-gate-head h1 { font-size: 23px; }
            .xos-gate-inner { width: calc(100% - 22px); }
            .xos-gate-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="xos-gate" id="xos-gate" hidden>
        <div class="xos-gate-inner">
            <div class="xos-gate-head">
                <div class="xos-mark" style="width: 46px; height: 46px; font-size: 17px;">X</div>
                <div>
                    <h1>XOS 虚拟云电脑</h1>
                    <p class="xos-gate-sub" style="margin: 2px 0 0;">选择一台 XOS PC，在浏览器里打开你的桌面。</p>
                </div>
            </div>
            <p class="xos-gate-sub">购买后授权会写入当前账户；XOS 是网页虚拟桌面，不是真实远程虚拟机。所有应用都在本机浏览器中运行。</p>
            <div class="xos-gate-grid" id="xos-gate-grid"></div>
            <div class="xos-gate-actions">
                <a class="xos-btn primary" href="shop.html?category=XOS%E8%99%9A%E6%8B%9F%E4%BA%91%E7%94%B5%E8%84%91">前往商店购买</a>
                <a class="xos-btn" href="manager.html">返回账户</a>
                <a class="xos-btn" href="login.html?next=xos.html">切换账户</a>
            </div>
            <p class="tiny" id="xos-gate-note"></p>
        </div>
    </div>

    <div class="xos-boot" id="xos-boot" hidden>
        <div class="xos-boot-card">
            <div class="xos-boot-mark">X</div>
            <h1 style="margin: 0 0 4px;">XOS</h1>
            <p class="tiny" id="xos-boot-edition">正在启动虚拟云电脑…</p>
            <div class="xos-boot-bar"><i></i></div>
        </div>
    </div>

    <div class="xos-shell" id="xos-shell" hidden>
        <div class="xos-viewport" id="xos-viewport">
            <div class="xos-screen" id="xos-screen">
                <div class="xos-wallpaper"></div>
                <header class="xos-topbar"><script src="../api-bridge.js"></script>
                    <div class="brand"><span class="xos-mark">X</span> XOS</div>
                    <span class="edition" id="xos-edition-label">PC</span>
                    <span class="top-item" id="xos-config-label">1440 × 900</span>
                    <span class="spacer"></span>
                    <span class="top-item">刷新率</span>
                    <select id="xos-refresh" title="显示刷新率"></select>
                    <span class="top-item" id="xos-user-label">—</span>
                    <a class="top-item xos-link" href="shop.html?category=XOS%E8%99%9A%E6%8B%9F%E4%BA%91%E7%94%B5%E8%84%91" title="XOS 商店">商店</a>
                    <span class="top-item">v5.1.1</span>
                    <button class="xos-btn small" type="button" id="xos-lock-btn">锁定</button>
                </header>

                <div class="xos-desktop" id="xos-desktop"></div>
                <div class="xos-windows" id="xos-windows"></div>

                <div class="xos-start" id="xos-start" hidden>
                    <h3>XOS 开始菜单</h3>
                    <p class="muted" id="xos-start-sub">选择应用开始工作。</p>
                    <div class="xos-start-grid" id="xos-start-grid"></div>
                    <div class="xos-start-footer">
                        <span id="xos-start-edition">XOS</span>
                        <span><a class="xos-link" href="shop.html">商店</a> · <a class="xos-link" href="manager.html">账户</a></span>
                    </div>
                </div>

                <div class="xos-taskbar">
                    <button class="xos-start-btn" type="button" id="xos-start-btn" title="开始">X</button>
                    <div class="xos-task-list" id="xos-task-list"></div>
                    <div class="xos-tray">
                        <span><span class="dot"></span> XOS Online</span>
                        <span id="xos-clock">--:--</span>
                    </div>
                </div>

                <div class="xos-notify-wrap" id="xos-notify-wrap"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            "use strict";

            const API = window.VTXApi;
            const $ = (id) => document.getElementById(id);
            const SCREEN_W = 1440;
            const SCREEN_H = 900;
            const EDITIONS = {
                home: { rank: 0, name: "XOS PC Home 26H1", short: "Home 26H1", cpu: "XOS CPU V1 2025", gpu: "XOS GPU V1 2026", refresh: [15] },
                personal: { rank: 1, name: "XOS PC Personal 26H1", short: "Personal 26H1", cpu: "XOS Core V1 2025", gpu: "XOS Graphic Pro 2026", refresh: [15, 20, 24, 30] },
                professional: { rank: 2, name: "XOS PC Professional 26H1", short: "Professional 26H1", cpu: "XOS Core V3 2026", gpu: "XOS Graphic ULTRA 2026", refresh: [15, 20, 24, 30, 60] },
                ce: { rank: 3, name: "XOS PC CE 26H1", short: "CE 26H1", cpu: "XOS Core V3 2026", gpu: "XOS Graphic ULTRA 2026", refresh: [15, 20, 24, 30, 60] }
            };
            const APP_ORDER = [
                "taskmgr", "files", "browser", "shared", "paint", "txtpro", "calc", "weather",
                "todo", "mail", "screenshot", "vscode", "paint3d", "blender", "musescore",
                "github", "git", "blockbench", "midi", "timer"
            ];
            const APPS = {};
            const state = {
                login: "",
                license: null,
                edition: "home",
                refresh: 15,
                windows: new Map(),
                z: 30,
                fs: [],
                activeId: "",
                scale: 1,
                timerHandles: new Set()
            };

            function esc(value) {
                return String(value == null ? "" : value).replace(/[&<>"']/g, (char) => ({
                    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
                }[char]));
            }

            function toast(message) {
                const wrap = $("xos-notify-wrap");
                if (!wrap) return;
                const node = document.createElement("div");
                node.className = "xos-notify";
                node.textContent = message;
                wrap.appendChild(node);
                setTimeout(() => node.remove(), 3800);
            }

            function storageKey(name) {
                return `xos:${state.login}:${name}`;
            }

            function readStore(name, fallback) {
                try {
                    const raw = localStorage.getItem(storageKey(name));
                    return raw ? JSON.parse(raw) : fallback;
                } catch (error) {
                    return fallback;
                }
            }

            function writeStore(name, value) {
                try {
                    localStorage.setItem(storageKey(name), JSON.stringify(value));
                    return true;
                } catch (error) {
                    toast("本地存储已满，无法保存");
                    return false;
                }
            }

            function fitScreen() {
                const scale = Math.min(window.innerWidth / SCREEN_W, window.innerHeight / SCREEN_H);
                state.scale = scale || 1;
                const screen = $("xos-screen");
                if (screen) {
                    const x = Math.max(0, (window.innerWidth - SCREEN_W * scale) / 2);
                    const y = Math.max(0, (window.innerHeight - SCREEN_H * scale) / 2);
                    screen.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
                }
            }

            /* ───────── 虚拟文件系统 ───────── */

            function defaultFs() {
                return [
                    { path: "Desktop", type: "dir" },
                    { path: "Documents", type: "dir" },
                    { path: "Pictures", type: "dir" },
                    { path: "Shared", type: "dir" },
                    { path: "Desktop/欢迎.txt", type: "file", content: "欢迎来到 XOS 26H1。\n\n这是你的虚拟桌面。双击文件或用 TXTPro 打开。", updated: Date.now() },
                    { path: "Documents/README.md", type: "file", content: "# XOS 云电脑\n\n- 文件保存在当前浏览器\n- TXTPro 支持文本和 Markdown\n- 更多应用在开始菜单里\n", updated: Date.now() }
                ];
            }

            function loadFs() {
                state.fs = readStore("fs", null);
                if (!Array.isArray(state.fs) || !state.fs.length) {
                    state.fs = defaultFs();
                    writeStore("fs", state.fs);
                }
            }

            function saveFs() {
                writeStore("fs", state.fs);
            }

            function fsEntry(path) {
                return state.fs.find((entry) => entry.path === path) || null;
            }

            function fsList(dir) {
                const prefix = dir ? dir.replace(/\/+$/, "") + "/" : "";
                return state.fs
                    .filter((entry) => entry.path.startsWith(prefix) && entry.path !== dir)
                    .filter((entry) => !entry.path.slice(prefix.length).includes("/"))
                    .sort((a, b) => (a.type === b.type ? a.path.localeCompare(b.path, "zh-CN") : a.type === "dir" ? -1 : 1));
            }

            function fsMkdir(dir) {
                if (!fsEntry(dir)) {
                    state.fs.push({ path: dir, type: "dir" });
                    saveFs();
                }
            }

            function joinPath(dir, name) {
                const left = String(dir || "").replace(/\/+$/, "");
                const right = String(name || "").replace(/^\/+/, "");
                return left ? `${left}/${right}` : right;
            }

            function fsWrite(path, content) {
                const entry = fsEntry(path);
                if (entry) {
                    entry.content = String(content);
                    entry.updated = Date.now();
                } else {
                    state.fs.push({ path, type: "file", content: String(content), updated: Date.now() });
                }
                saveFs();
            }

            function fsRemove(path) {
                state.fs = state.fs.filter((entry) => entry.path !== path && !entry.path.startsWith(path + "/"));
                saveFs();
            }

            function fileGlyph(name) {
                const ext = String(name).split(".").pop().toLowerCase();
                if (ext === "md" || ext === "txt") return "📄";
                if (["png", "jpg", "jpeg", "gif", "webp", "svg"].includes(ext)) return "🖼";
                if (["js", "html", "css", "cpp", "c", "h", "json"].includes(ext)) return "⌨";
                if (ext === "sb3") return "🧩";
                return "📄";
            }

            function isTextFile(name) {
                const ext = String(name).split(".").pop().toLowerCase();
                return ["txt", "md", "markdown", "json", "js", "ts", "html", "css", "cpp", "c", "h", "hpp", "py", "java", "dev", "log"].includes(ext);
            }

            function downloadBlob(name, blob) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = name;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            }

            function downloadText(name, text) {
                downloadBlob(name, new Blob([text], { type: "text/plain;charset=utf-8" }));
            }

            /* ───────── 窗口管理 ───────── */

            function appAvailable(id) {
                const app = APPS[id];
                return Boolean(app && EDITIONS[state.edition].rank >= (app.minRank || 0));
            }

            function openApp(id, args) {
                if (!appAvailable(id)) {
                    toast("当前 XOS 版本不支持这个应用");
                    return null;
                }
                if (state.windows.has(id)) {
                    focusWindow(id);
                    const win = state.windows.get(id);
                    if (args && win && win.onArgs) {
                        win.onArgs(args);
                    }
                    return win;
                }
                const app = APPS[id];
                const win = document.createElement("section");
                win.className = "xos-window";
                const width = app.width || 720;
                const height = app.height || 500;
                const offset = state.windows.size % 7;
                win.style.left = `${90 + offset * 34}px`;
                win.style.top = `${62 + offset * 26}px`;
                win.style.width = `${width}px`;
                win.style.height = `${height}px`;
                win.innerHTML = `<div class="xos-window-head">
                    <span>${app.icon}</span>
                    <span class="xos-window-title">${esc(app.name)}</span>
                    <span class="xos-window-actions">
                        <button class="xos-win-btn" type="button" data-win="min" title="最小化">—</button>
                        <button class="xos-win-btn" type="button" data-win="max" title="最大化">▢</button>
                        <button class="xos-win-btn close" type="button" data-win="close" title="关闭">×</button>
                    </span>
                </div>
                <div class="xos-window-body"><div class="xos-app"></div></div>
                <div class="xos-window-resize"></div>`;
                $("xos-windows").appendChild(win);
                const handle = {
                    id, app, node: win, body: win.querySelector(".xos-app"), minimized: false,
                    maximized: false, onClose: null, onArgs: null
                };
                state.windows.set(id, handle);
                bindWindow(handle);
                focusWindow(id);
                app.mount(handle.body, handle, args || {});
                renderTaskbar();
                renderDesktop();
                return handle;
            }

            function bindWindow(handle) {
                const node = handle.node;
                const head = node.querySelector(".xos-window-head");
                const resize = node.querySelector(".xos-window-resize");
                node.addEventListener("mousedown", () => focusWindow(handle.id));
                head.addEventListener("mousedown", (event) => {
                    if (event.target.closest("button")) return;
                    const startX = event.clientX, startY = event.clientY;
                    const startLeft = node.offsetLeft, startTop = node.offsetTop;
                    const move = (moveEvent) => {
                        const dx = (moveEvent.clientX - startX) / (state.scale || 1);
                        const dy = (moveEvent.clientY - startY) / (state.scale || 1);
                        node.style.left = `${Math.max(0, Math.min(SCREEN_W - 80, startLeft + dx))}px`;
                        node.style.top = `${Math.max(0, Math.min(SCREEN_H - 100, startTop + dy))}px`;
                    };
                    const up = () => {
                        window.removeEventListener("mousemove", move);
                        window.removeEventListener("mouseup", up);
                    };
                    window.addEventListener("mousemove", move);
                    window.addEventListener("mouseup", up);
                });
                resize.addEventListener("mousedown", (event) => {
                    event.stopPropagation();
                    const startX = event.clientX, startY = event.clientY;
                    const startW = node.offsetWidth, startH = node.offsetHeight;
                    const move = (moveEvent) => {
                        node.style.width = `${Math.max(300, startW + (moveEvent.clientX - startX) / (state.scale || 1))}px`;
                        node.style.height = `${Math.max(180, startH + (moveEvent.clientY - startY) / (state.scale || 1))}px`;
                    };
                    const up = () => {
                        window.removeEventListener("mousemove", move);
                        window.removeEventListener("mouseup", up);
                    };
                    window.addEventListener("mousemove", move);
                    window.addEventListener("mouseup", up);
                });
                node.querySelectorAll("[data-win]").forEach((button) => {
                    button.addEventListener("click", (event) => {
                        event.stopPropagation();
                        const action = button.dataset.win;
                        if (action === "close") closeWindow(handle.id);
                        if (action === "min") {
                            handle.minimized = true;
                            node.hidden = true;
                            renderTaskbar();
                        }
                        if (action === "max") {
                            handle.maximized = !handle.maximized;
                            node.classList.toggle("maximized", handle.maximized);
                        }
                    });
                });
            }

            function focusWindow(id) {
                const handle = state.windows.get(id);
                if (!handle) return;
                if (handle.minimized) {
                    handle.minimized = false;
                    handle.node.hidden = false;
                }
                state.activeId = id;
                handle.node.style.zIndex = String(++state.z);
                state.windows.forEach((item, key) => item.node.classList.toggle("active", key === id));
                renderTaskbar();
            }

            function closeWindow(id) {
                const handle = state.windows.get(id);
                if (!handle) return;
                if (typeof handle.onClose === "function") {
                    try { handle.onClose(); } catch (error) { /* ignore */ }
                }
                handle.node.remove();
                state.windows.delete(id);
                if (state.activeId === id) state.activeId = "";
                renderTaskbar();
                renderDesktop();
            }

            function renderTaskbar() {
                const list = $("xos-task-list");
                list.textContent = "";
                state.windows.forEach((handle) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "xos-task" + (state.activeId === handle.id ? " active" : "");
                    button.innerHTML = `<span>${handle.app.icon}</span><span>${esc(handle.app.name)}</span>`;
                    button.addEventListener("click", () => {
                        if (handle.minimized) {
                            handle.minimized = false;
                            handle.node.hidden = false;
                        }
                        focusWindow(handle.id);
                    });
                    list.appendChild(button);
                });
            }

            function renderDesktop() {
                const desktop = $("xos-desktop");
                desktop.textContent = "";
                APP_ORDER.filter(appAvailable).forEach((id) => {
                    const app = APPS[id];
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "xos-icon";
                    button.innerHTML = `<span class="glyph">${app.icon}</span><span>${esc(app.name)}</span>`;
                    button.addEventListener("dblclick", () => openApp(id));
                    button.addEventListener("click", () => {
                        if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
                            openApp(id);
                        } else {
                            button.title = "双击打开 " + app.name;
                        }
                    });
                    desktop.appendChild(button);
                });
            }

            function renderStart() {
                const grid = $("xos-start-grid");
                grid.textContent = "";
                APP_ORDER.filter(appAvailable).forEach((id) => {
                    const app = APPS[id];
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "xos-start-app";
                    button.innerHTML = `<span class="glyph">${app.icon}</span><span>${esc(app.name)}</span>`;
                    button.addEventListener("click", () => {
                        $("xos-start").hidden = true;
                        openApp(id);
                    });
                    grid.appendChild(button);
                });
                $("xos-start-sub").textContent = `${EDITIONS[state.edition].name} · ${APP_ORDER.filter(appAvailable).length} 个应用`;
                $("xos-start-edition").textContent = EDITIONS[state.edition].name;
            }

            function showModal(html) {
                const back = document.createElement("div");
                back.className = "xos-modal-back";
                back.innerHTML = `<div class="xos-modal">${html}</div>`;
                $("xos-screen").appendChild(back);
                back.addEventListener("click", (event) => {
                    if (event.target === back) back.remove();
                });
                back.querySelectorAll("[data-modal-close]").forEach((button) => {
                    button.addEventListener("click", () => back.remove());
                });
                return back;
            }

            function refreshClock() {
                const now = new Date();
                $("xos-clock").textContent = now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
            }

            /* ───────── 应用：任务管理器 ───────── */

            APPS.taskmgr = {
                name: "任务管理器", icon: "📊", minRank: 0, width: 760, height: 500,
                mount(body, handle) {
                    body.innerHTML = `<h2>任务管理器</h2><p>查看 XOS 当前运行的应用与资源占用。</p>
                        <div class="xos-kpi" id="tm-kpi"></div>
                        <div style="height: 10px;"></div>
                        <table class="xos-table"><thead><tr><th>名称</th><th>类型</th><th>CPU</th><th>内存</th><th></th></tr></thead><tbody id="tm-body"></tbody></table>`;
                    const render = () => {
                        const apps = Array.from(state.windows.values());
                        $("tm-kpi").innerHTML = `<div>应用<b>${apps.length}</b></div><div>CPU<b>${Math.min(99, 8 + apps.length * 6)}%</b></div><div>内存<b>${Math.min(99, 28 + apps.length * 5)}%</b></div><div>刷新率<b>${state.refresh}fps</b></div>`;
                        const rows = [
                            { name: "XOS Desktop", type: "系统", cpu: 2, mem: 180 },
                            { name: "XOS Window Manager", type: "系统", cpu: 1, mem: 64 }
                        ].concat(apps.map((handle, index) => ({ name: handle.app.name, type: "应用", cpu: 1 + (index % 5), mem: 45 + index * 12, id: handle.id })));
                        $("tm-body").innerHTML = rows.map((row) => `<tr><td>${esc(row.name)}</td><td>${row.type}</td><td>${row.cpu}%</td><td>${row.mem} MB</td><td>${row.id ? `<button class="xos-btn small danger" data-end="${esc(row.id)}">结束</button>` : ""}</td></tr>`).join("");
                        $("tm-body").querySelectorAll("[data-end]").forEach((button) => button.addEventListener("click", () => closeWindow(button.dataset.end)));
                    };
                    render();
                    const timer = setInterval(render, 1000);
                    handle.onClose = () => clearInterval(timer);
                }
            };

            /* ───────── 应用：文件资源管理器 / 共享文件 ───────── */

            function mountFiles(body, handle, startPath) {
                let path = startPath || "Desktop";
                body.innerHTML = `<div class="row" style="margin-bottom: 8px;">
                        <button class="xos-btn small" data-file-up>← 上一级</button>
                        <button class="xos-btn small" data-file-newdir>＋ 文件夹</button>
                        <button class="xos-btn small" data-file-newfile>＋ 文本</button>
                        <button class="xos-btn small" data-file-upload>上传</button>
                        <span class="tiny" data-file-path></span>
                    </div><div class="xos-folder" data-file-list></div>
                    <input type="file" data-file-input hidden>`;
                const list = body.querySelector("[data-file-list]");
                const render = () => {
                    body.querySelector("[data-file-path]").textContent = path ? `/${path}` : "/";
                    body.querySelector("[data-file-up]").disabled = !path;
                    list.textContent = "";
                    const entries = fsList(path);
                    for (const entry of entries) {
                        const name = entry.path.split("/").pop();
                        const card = document.createElement("button");
                        card.type = "button";
                        card.className = "xos-file-card";
                        card.innerHTML = `<span class="glyph">${entry.type === "dir" ? "📁" : fileGlyph(name)}</span><span class="name">${esc(name)}</span>`;
                        card.addEventListener("dblclick", () => {
                            if (entry.type === "dir") {
                                path = entry.path;
                                render();
                            } else {
                                openFile(entry.path);
                            }
                        });
                        card.addEventListener("click", () => {
                            if (entry.type === "file") body.dataset.selected = entry.path;
                            else body.dataset.selected = "";
                        });
                        card.addEventListener("contextmenu", (event) => {
                            event.preventDefault();
                            openFileMenu(entry.path);
                        });
                        list.appendChild(card);
                    }
                };
                const openFileMenu = (target) => {
                    const back = showModal(`<h2 style="margin-top:0">${esc(target.split("/").pop())}</h2>
                        <div class="row" style="flex-wrap:wrap">
                        <button class="xos-btn" data-open>打开</button>
                        <button class="xos-btn" data-download>下载</button>
                        <button class="xos-btn danger" data-delete>删除</button>
                        <button class="xos-btn" data-modal-close>取消</button></div>`);
                    back.querySelector("[data-open]").addEventListener("click", () => { back.remove(); openFile(target); });
                    back.querySelector("[data-download]").addEventListener("click", () => { back.remove(); downloadPath(target); });
                    back.querySelector("[data-delete]").addEventListener("click", () => { back.remove(); fsRemove(target); render(); toast("已删除"); });
                };
                const openFile = (target) => {
                    const entry = fsEntry(target);
                    if (!entry) return;
                    if (isTextFile(target)) {
                        openApp("txtpro", { path: target });
                    } else if (String(target).match(/\.(png|jpe?g|gif|webp|svg)$/i) && entry.content) {
                        const back = showModal(`<h2 style="margin-top:0">${esc(target.split("/").pop())}</h2><img alt="" style="max-width:100%;max-height:60vh;display:block;margin:auto" src="${entry.content}"><div class="row" style="margin-top:10px"><button class="xos-btn" data-modal-close>关闭</button></div>`);
                        back.querySelector("img").src = entry.content;
                    } else {
                        toast("这个文件需要对应应用打开");
                    }
                };
                const downloadPath = (target) => {
                    const entry = fsEntry(target);
                    if (!entry) return;
                    if (entry.content && entry.content.startsWith("data:")) {
                        const a = document.createElement("a");
                        a.href = entry.content;
                        a.download = target.split("/").pop();
                        a.click();
                    } else {
                        downloadText(target.split("/").pop(), entry.content || "");
                    }
                };
                body.querySelector("[data-file-up]").addEventListener("click", () => {
                    if (!path) return;
                    path = path.includes("/") ? path.split("/").slice(0, -1).join("/") : "";
                    render();
                });
                body.querySelector("[data-file-newdir]").addEventListener("click", () => {
                    const name = prompt("文件夹名称");
                    if (name) { fsMkdir(joinPath(path, name.replace(/[\\/:*?"<>|]/g, ""))); render(); }
                });
                body.querySelector("[data-file-newfile]").addEventListener("click", () => {
                    const name = prompt("文件名（.txt / .md）", "新建.txt");
                    if (name) { fsWrite(joinPath(path, name.replace(/[\\/:*?"<>|]/g, "")), ""); render(); }
                });
                const fileInput = body.querySelector("[data-file-input]");
                body.querySelector("[data-file-upload]").addEventListener("click", () => fileInput.click());
                fileInput.addEventListener("change", () => {
                    const file = fileInput.files && fileInput.files[0];
                    if (!file) return;
                    if (file.size > 8 * 1024 * 1024) { toast("演示版单文件最多 8 MB"); return; }
                    const reader = new FileReader();
                    const isImage = file.type.startsWith("image/");
                    reader.onload = () => {
                        const pathName = joinPath(path, file.name);
                        if (isImage) {
                            fsMkdir(path);
                            state.fs.push({ path: pathName, type: "file", content: String(reader.result), updated: Date.now() });
                            saveFs();
                        } else {
                            fsWrite(pathName, String(reader.result));
                        }
                        render();
                        toast("已上传 " + file.name);
                    };
                    if (isImage) reader.readAsDataURL(file);
                    else reader.readAsText(file);
                    fileInput.value = "";
                });
                render();
                handle.onArgs = (args) => { if (args.path) { path = args.path; render(); } };
            }

            APPS.files = {
                name: "文件资源管理器", icon: "📁", minRank: 0, width: 780, height: 540,
                mount(body, handle) { mountFiles(body, handle, "Desktop"); }
            };

            APPS.shared = {
                name: "共享文件", icon: "🤝", minRank: 0, width: 780, height: 540,
                mount(body, handle) {
                    mountFiles(body, handle, "Shared");
                    const note = document.createElement("p");
                    note.className = "tiny";
                    note.textContent = "共享文件夹保存在当前浏览器的 XOS 空间中，不会上传到网站服务器。";
                    body.prepend(note);
                }
            };

            /* ───────── 应用：TXTPro / VSCode ───────── */

            function simpleMarkdown(source) {
                const lines = String(source || "").split(/\r?\n/);
                let html = "";
                let inCode = false;
                for (const line of lines) {
                    if (line.startsWith("```")) { inCode = !inCode; html += inCode ? "<pre><code>" : "</code></pre>"; continue; }
                    if (inCode) { html += esc(line) + "\n"; continue; }
                    if (/^###\s+/.test(line)) html += `<h3>${esc(line.replace(/^###\s+/, ""))}</h3>`;
                    else if (/^##\s+/.test(line)) html += `<h2>${esc(line.replace(/^##\s+/, ""))}</h2>`;

                    else html += `<p>${esc(line).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>")}</p>`;

                    objects.forEach((object) => {
                        const p = project(object.x, object.y, object.z);
                        const size = Math.max(8, object.size * 70);

                    body.innerHTML = `<div class="xos-toolbar"><button class="xos-btn small" data-play>▶ 播放</button><button class="xos-btn small" data-clear>清空</button><span class="tiny">点击五线谱添加音符</span></div><canvas class="xos-canvas" width="860" height="430" data-canvas></canvas>`;
                    const canvas = body.querySelector("[data-canvas]");
                    const ctx = canvas.getContext("2d");
                    const notes = [];
                    const pitches = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5];
                    const draw = () => {
                        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.strokeStyle = "#222"; ctx.lineWidth = 1;
                        for (let line = 0; line < 5; line++) { ctx.beginPath(); ctx.moveTo(40, 100 + line * 36); ctx.lineTo(820, 100 + line * 36); ctx.stroke(); }
                        ctx.fillStyle = "#111"; ctx.font = "48px serif"; ctx.fillText("𝄞", 12, 170);
                        notes.forEach((note) => {
                            const x = 70 + note.beat * 54;
                            const y = 190 - note.step * 18;
                            ctx.beginPath(); ctx.ellipse(x, y, 9, 6, -0.25, 0, Math.PI * 2); ctx.fill();
                            ctx.beginPath(); ctx.moveTo(x + 8, y); ctx.lineTo(x + 8, y - 52); ctx.stroke();
                        });
                    };
                    canvas.addEventListener("click", (event) => {
                        const rect = canvas.getBoundingClientRect();
                        const x = (event.clientX - rect.left) * canvas.width / rect.width;
                        const y = (event.clientY - rect.top) * canvas.height / rect.height;
                        const beat = Math.max(0, Math.round((x - 70) / 54));
                        const step = Math.max(0, Math.min(7, Math.round((190 - y) / 18)));
                        notes.push({ beat, step });
                        draw();
                    });
                    body.querySelector("[data-clear]").addEventListener("click", () => { notes.length = 0; draw(); });
                    body.querySelector("[data-play]").addEventListener("click", async () => {
                        const audio = new (window.AudioContext || window.webkitAudioContext)();

                            const start = audio.currentTime + note.beat * 0.32;
                            gain.gain.setValueAtTime(0.12, start); gain.gain.exponentialRampToValueAtTime(0.001, start + 0.28);
                            osc.start(start); osc.stop(start + 0.3);
                        });
                    });
                    draw();
                }
            };

                    };
                    print("XOS Git 2.0 — 输入 git help 查看命令");
                    input.addEventListener("keydown", (event) => {

            APPS.github = {
                name: "GitHub Desktop", icon: "🐙", minRank: 2, width: 840, height: 580,

            /* ───────── 应用：MIDI 播放器 ───────── */

            function parseMidi(buffer) {
                const view = new DataView(buffer);
                let offset = 0;
                const readString = (length) => { let out = ""; for (let i = 0; i < length; i++) out += String.fromCharCode(view.getUint8(offset++)); return out; };
                const readU32 = () => { const value = view.getUint32(offset); offset += 4; return value; };
                const readU16 = () => { const value = view.getUint16(offset); offset += 2; return value; };
                const readVar = () => { let value = 0; for (let i = 0; i < 4; i++) { const byte = view.getUint8(offset++); value = (value << 7) | (byte & 0x7f); if (!(byte & 0x80)) break; } return value; };
                if (readString(4) !== "MThd") throw new Error("不是 MIDI 文件");
                const headerLength = readU32(); readU16(); const tracks = readU16(); const division = readU16(); offset += Math.max(0, headerLength - 6);
                const tempoEvents = [{ tick: 0, tempo: 500000 }];
                const notes = [];
                for (let track = 0; track < tracks; track++) {
                    if (offset + 8 > buffer.byteLength || readString(4) !== "MTrk") break;
                    const length = readU32();
                    const end = offset + length;
                    let tick = 0, running = 0;
                    while (offset < end) {
                        tick += readVar();
                        let status = view.getUint8(offset);
                        if (status & 0x80) { running = status; offset++; } else status = running;
                        if (status === 0xff) {
                            const type = view.getUint8(offset++); const size = readVar();
                            if (type === 0x51 && size === 3) tempoEvents.push({ tick, tempo: (view.getUint8(offset) << 16) | (view.getUint8(offset + 1) << 8) | view.getUint8(offset + 2) });
                            offset += size;
                        } else if (status === 0xf0 || status === 0xf7) { const size = readVar(); offset += size; }
                        else {
                            const type = status >> 4;
                            if (type === 0x8 || type === 0x9 || type === 0xa || type === 0xb || type === 0xe) {
                                const note = view.getUint8(offset), velocity = view.getUint8(offset + 1); offset += 2;
                                if (type === 0x9 && velocity > 0) notes.push({ tick, note, velocity });
                            } else if (type === 0xc || type === 0xd) offset += 1;
                            else break;
                        }
                    }
                    offset = end;
                }
                tempoEvents.sort((a, b) => a.tick - b.tick);
                const tickToSeconds = (target) => {
                    let seconds = 0, lastTick = 0, tempo = 500000;
                    for (const event of tempoEvents) {
                        if (event.tick > target) break;
                        seconds += ((event.tick - lastTick) / division) * (tempo / 1000000);
                        lastTick = event.tick; tempo = event.tempo;
                    }
                    return seconds + ((target - lastTick) / division) * (tempo / 1000000);
                };
                return { notes, division, duration: notes.length ? tickToSeconds(Math.max(...notes.map((note) => note.tick))) : 0, tickToSeconds };
            }

            APPS.midi = {
                name: "MIDI 播放器", icon: "🎹", minRank: 2, width: 880, height: 560,
                mount(body, handle) {
                    body.innerHTML = `<div class="row"><input type="file" accept=".mid,.midi" data-file><button class="xos-btn primary" data-play disabled>▶ 播放</button><button class="xos-btn" data-stop>■ 停止</button><span class="tiny" data-info>选择一个 .mid 文件</span></div><canvas class="xos-canvas dark" width="840" height="360" data-canvas style="margin-top:10px"></canvas>`;
                    const canvas = body.querySelector("[data-canvas]"); const ctx = canvas.getContext("2d");
                    let midi = null; let audio = null; let sources = [];
                    const draw = () => {
                        ctx.fillStyle = "#08101f"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        if (!midi) return;
                        const total = Math.max(1, midi.duration);
                        midi.notes.forEach((note) => {
                            const x = 30 + (midi.tickToSeconds(note.tick) / total) * (canvas.width - 60);
                            const y = 20 + (127 - note.note) / 127 * (canvas.height - 40);
                            ctx.fillStyle = `hsl(${(note.note * 4) % 360}, 80%, 65%)`; ctx.fillRect(x, y, 3, 3);
                        });
                    };
                    const stop = () => { sources.forEach((osc) => { try { osc.stop(); } catch (error) {} }); sources = []; };
                    handle.onClose = stop;
                    body.querySelector("[data-file]").addEventListener("change", async (event) => {
                        const file = event.target.files && event.target.files[0]; if (!file) return;
                        try {
                            midi = parseMidi(await file.arrayBuffer());
                            body.querySelector("[data-info]").textContent = `${file.name} · ${midi.notes.length} 个音符 · ${midi.duration.toFixed(1)} 秒`;
                            body.querySelector("[data-play]").disabled = false; draw();
                        } catch (error) { body.querySelector("[data-info]").textContent = "MIDI 解析失败：" + error.message; }
                    });
                    body.querySelector("[data-play]").addEventListener("click", () => {
                        if (!midi) return;
                        stop();
                        audio = new (window.AudioContext || window.webkitAudioContext)();
                        const start = audio.currentTime + 0.05;
                        midi.notes.forEach((note) => {
                            const osc = audio.createOscillator(), gain = audio.createGain();
                            osc.type = "triangle"; osc.frequency.value = 440 * Math.pow(2, (note.note - 69) / 12);
                            const at = start + midi.tickToSeconds(note.tick);
                            gain.gain.setValueAtTime(0.0001, at); gain.gain.exponentialRampToValueAtTime(0.12, at + 0.01); gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.25);
                            osc.connect(gain); gain.connect(audio.destination); osc.start(at); osc.stop(at + 0.3); sources.push(osc);
                        });
                        toast("正在播放 MIDI");
                    });
                    body.querySelector("[data-stop]").addEventListener("click", stop);
                    draw();
                }
            };

            /* ───────── 应用：计时器 ───────── */

            APPS.timer = {
                name: "计时器", icon: "⏱", minRank: 3, width: 620, height: 480,
                mount(body, handle) {
                    body.innerHTML = `<div class="row"><button class="xos-btn small primary" data-mode="stopwatch">秒表</button><button class="xos-btn small" data-mode="countdown">倒计时</button></div><div style="text-align:center;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;margin:28px 0" data-display>00:00.00</div><div class="row" style="justify-content:center"><button class="xos-btn primary" data-start>开始</button><button class="xos-btn" data-reset>重置</button><button class="xos-btn" data-lap>计次</button></div><div class="xos-list" data-laps style="margin-top:14px"></div>`;
                    let mode = "stopwatch", running = false, startedAt = 0, elapsed = 0, timer = null, countdown = 60;
                    const display = body.querySelector("[data-display]");
                    const render = () => {
                        const value = mode === "countdown" ? Math.max(0, countdown - elapsed / 1000) : elapsed / 1000;
                        const minutes = Math.floor(value / 60), seconds = Math.floor(value % 60), ms = Math.floor((value % 1) * 100);
                        display.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(ms).padStart(2, "0")}`;
                    };
                    const tick = () => { if (!running) return; elapsed = Date.now() - startedAt; render(); if (mode === "countdown" && elapsed >= countdown * 1000) { running = false; clearInterval(timer); toast("倒计时结束"); } };
                    body.querySelector("[data-start]").addEventListener("click", () => {
                        if (running) { running = false; clearInterval(timer); body.querySelector("[data-start]").textContent = "继续"; return; }
                        running = true; startedAt = Date.now() - elapsed; timer = setInterval(tick, 30); body.querySelector("[data-start]").textContent = "暂停";
                    });
                    body.querySelector("[data-reset]").addEventListener("click", () => { running = false; clearInterval(timer); elapsed = 0; render(); body.querySelector("[data-start]").textContent = "开始"; });
                    body.querySelector("[data-lap]").addEventListener("click", () => { const row = document.createElement("div"); row.className = "xos-panel"; row.textContent = "计次 · " + display.textContent; body.querySelector("[data-laps]").prepend(row); });
                    body.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => {
                        mode = button.dataset.mode; running = false; clearInterval(timer); elapsed = 0;
                        countdown = Number(prompt("倒计时秒数", "60")) || 60;
                        render();
                    }));
                    handle.onClose = () => clearInterval(timer);
                    render();
                }
            };

            /* ───────── 启动 / 授权 ───────── */

            function renderGate(note) {
                $("xos-shell").hidden = true;
                $("xos-gate").hidden = false;
                const grid = $("xos-gate-grid");
                grid.innerHTML = Object.entries(EDITIONS).map(([key, edition]) => `<article class="xos-gate-card">
                    <h3>${esc(edition.name)}</h3>
                    <div class="price">${[1000, 1250, 1500, 1750][edition.rank]} VTX</div>
                    <ul><li>${esc(edition.cpu)} · ${esc(edition.gpu)}</li><li>1440 × 900 · ${edition.refresh.join(" / ")} fps</li><li>${APP_ORDER.filter((id) => APPS[id].minRank <= edition.rank).length} 个应用</li></ul>
                    <a class="xos-btn" href="shop.html?category=XOS%E8%99%9A%E6%8B%9F%E4%BA%91%E7%94%B5%E8%84%91">查看商品</a>
                </article>`).join("");
                $("xos-gate-note").textContent = note || "购买后刷新此页面即可启动。";
            }

            function applyLicense(account) {
                state.license = account && account.xos ? account.xos : null;
                if (!state.license) { renderGate("当前账户还没有 XOS 授权。"); return false; }
                const edition = EDITIONS[state.license.edition] ? state.license.edition : "home";
                state.edition = edition;
                const config = state.license.config || {};
                const rates = Array.isArray(state.license.refreshRates) && state.license.refreshRates.length
                    ? state.license.refreshRates.map(Number).filter(Boolean)
                    : EDITIONS[edition].refresh;
                state.refresh = rates.includes(Number(readStore("refresh", rates[0]))) ? Number(readStore("refresh", rates[0])) : rates[0];
                $("xos-edition-label").textContent = EDITIONS[edition].short;
                $("xos-config-label").textContent = `${config.resolution || "1440 × 900"} · ${config.cpu || EDITIONS[edition].cpu} · ${config.gpu || EDITIONS[edition].gpu}`;
                $("xos-user-label").textContent = account.username || state.login;
                const select = $("xos-refresh");
                select.innerHTML = rates.map((rate) => `<option value="${rate}" ${rate === state.refresh ? "selected" : ""}>${rate}fps</option>`).join("");
                select.addEventListener("change", () => {
                    state.refresh = Number(select.value) || 15;
                    writeStore("refresh", state.refresh);
                    toast("显示刷新率已切换到 " + state.refresh + "fps");
                });
                return true;
            }

            function boot() {
                $("xos-gate").hidden = true;
                $("xos-boot").hidden = false;
                $("xos-boot-edition").textContent = EDITIONS[state.edition].name;
                setTimeout(() => {
                    $("xos-boot").hidden = true;
                    $("xos-shell").hidden = false;
                    renderDesktop(); renderTaskbar(); renderStart(); refreshClock();
                    setInterval(refreshClock, 1000);
                    fitScreen();
                    toast("欢迎使用 " + EDITIONS[state.edition].name);
                }, 1100);
            }

            async function init() {
                fitScreen();
                window.addEventListener("resize", fitScreen);
                $("xos-start-btn").addEventListener("click", () => { $("xos-start").hidden = !$("xos-start").hidden; });
                $("xos-lock-btn").addEventListener("click", () => { closeAll(); showModal('<h2 style="margin-top:0">XOS 已锁定</h2><p class="tiny">这是一个网页虚拟桌面，刷新页面即可重新进入。</p><div style="text-align:right"><button class="xos-btn" data-modal-close>解锁</button></div>'); });
                document.addEventListener("keydown", (event) => { if (event.key === "Escape") { $("xos-start").hidden = true; } });
                if (!API || !API.hasSession) { renderGate("加载 vtx-api.js 失败，请刷新。"); return; }
                if (!API.hasSession()) { renderGate("请先登录账户。"); return; }
                try {
                    const account = await API.me();
                    state.login = account.login || sessionStorage.getItem("vtxAccount") || "user";
                    loadFs();
                    if (applyLicense(account)) boot();
                    else $("xos-gate-note").innerHTML = '当前账户还没有 XOS 授权，<a class="xos-link" href="shop.html?category=XOS%E8%99%9A%E6%8B%9F%E4%BA%91%E7%94%B5%E8%84%91">去商店购买</a>。';
                } catch (error) {
                    renderGate(error && error.message ? error.message : "读取账户失败，请稍后刷新。");
                }
            }

            function closeAll() {
                Array.from(state.windows.keys()).forEach((id) => closeWindow(id));
            }

            init();
        })();
    </script>
