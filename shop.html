<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 停服守卫：停服期间任何页面都会跳到 WebsiteClose.html，时间表见 vtx-closed.js -->
    <script>document.write('<script src="vtx-closed.js?t=' + Date.now() + '"><\/script>');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>商店 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding-bottom: 48px;
            background:
                radial-gradient(circle at 10% 0, #e2edff 0, transparent 34%),
                radial-gradient(circle at 92% 8%, #e4f5f0 0, transparent 28%),
                #f4f7fb;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 14px 24px;
            border-bottom: 1px solid #e7ebf2;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #172033;
            font-weight: 800;
            text-decoration: none;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-size: 16px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 14px;
        }

        .topbar-link {
            color: #4a5871;
            text-decoration: none;
            font-weight: 650;
        }

        .topbar-link:hover,
        .topbar-link.active {
            color: #3158d1;
        }

        .version {
            padding: 4px 10px;
            border-radius: 999px;
            color: #3158d1;
            background: #eef2ff;
            font-size: 12.5px;
            font-weight: 700;
        }

        .balance-chip {
            padding: 6px 12px;
            border-radius: 999px;
            background: #eef7f2;
            color: #1f7a52;
            font-size: 13px;
        }

        main {
            width: min(100%, 1120px);
            margin: 0 auto;
            padding: 32px 24px 0;
        }

        .hero h1 {
            margin: 6px 0 8px;
            font-size: 30px;
        }

        .eyebrow {
            margin: 0;
            color: #738097;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-copy {
            margin: 0 0 24px;
            color: #738097;
            line-height: 1.7;
        }

        .status {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid transparent;
        }

        .status[hidden] {
            display: none;
        }

        .status.error {
            color: #a9202f;
            background: #fdeef0;
            border-color: #f6cdd3;
        }

        .status.success {
            color: #1f7a52;
            background: #edf8f2;
            border-color: #c8e8d6;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .filter-chip {
            padding: 8px 15px;
            border: 1px solid #dce2ec;
            border-radius: 999px;
            color: #4a5871;
            background: #fff;
            font: inherit;
            font-size: 13.5px;
            font-weight: 650;
            cursor: pointer;
            transition: background 150ms, border-color 150ms, color 150ms;
        }

        .filter-chip:hover {
            border-color: #b9c6e8;
            background: #f5f8ff;
        }

        .filter-chip.active {
            border-color: #4169e1;
            color: #fff;
            background: #4169e1;
        }

        .filter-chip .count {
            margin-left: 6px;
            font-weight: 600;
            opacity: 0.75;
        }

        .product-category {
            margin: -4px 0 0;
            color: #7b3fe4;
            font-size: 12.5px;
            font-weight: 700;
        }

        .product {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            border: 1px solid #e7ebf2;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 32px rgba(30, 50, 90, 0.06);
        }

        .product-image {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border: 1px solid #eef1f7;
            border-radius: 12px;
            background: #f6f8fc;
        }

        .product-image-empty {
            display: grid;
            place-items: center;
            width: 100%;
            aspect-ratio: 4 / 3;
            margin: 0;
            border: 1px dashed #dce2ec;
            border-radius: 12px;
            color: #8a94a6;
            background: #fbfcfe;
            font-size: 13px;
            text-align: center;
        }

        .product-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .product-head h2 {
            margin: 0;
            font-size: 18px;
            line-height: 1.4;
        }

        .badge {
            flex: none;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge.on {
            color: #1f7a52;
            background: #edf8f2;
        }

        .badge.off {
            color: #7c8698;
            background: #f1f3f8;
        }

        .product-desc {
            margin: 0;
            color: #5b6880;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        .product-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 0;
            font-size: 13px;
        }

        .product-meta div {
            padding: 8px 10px;
            border-radius: 10px;
            background: #f6f8fc;
        }

        .product-meta dt {
            color: #8a94a6;
            font-size: 12px;
        }

        .product-meta dd {
            margin: 2px 0 0;
            font-weight: 650;
        }

        .product-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: auto;
        }

        .price {
            margin: 0;
            color: #3158d1;
            font-size: 20px;
            font-weight: 800;
        }

        .price small {
            color: #8a94a6;
            font-size: 12px;
            font-weight: 600;
        }

        .buy-button,
        .primary-button {
            border: 0;
            border-radius: 11px;
            color: #fff;
            background: #4169e1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 150ms;
        }

        .buy-button {
            padding: 10px 18px;
        }

        .primary-button {
            width: 100%;
            padding: 13px 18px;
        }

        .buy-button:hover:not(:disabled),
        .primary-button:hover:not(:disabled) {
            background: #3158d1;
        }

        .buy-button:disabled,
        .primary-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .empty {
            padding: 40px;
            border: 1px dashed #d8dfec;
            border-radius: 18px;
            color: #738097;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
        }

        .empty[hidden] {
            display: none;
        }

        .receipt-card {
            margin-top: 26px;
            padding: 22px;
            border: 1px solid #c8e8d6;
            border-radius: 18px;
            background: #f2fbf6;
        }

        .receipt-card[hidden] {
            display: none;
        }

        .receipt-card h2 {
            margin: 0 0 10px;
            font-size: 17px;
            color: #1f7a52;
        }

        .receipt-text {
            margin: 0;
            color: #235c42;
            font-size: 15px;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        dialog {
            width: min(100% - 32px, 420px);
            padding: 0;
            border: 0;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(20, 40, 80, 0.24);
        }

        dialog::backdrop {
            background: rgba(23, 32, 51, 0.42);
        }

        .checkout {
            padding: 24px;
        }

        .checkout h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        .checkout-sub {
            margin: 0 0 18px;
            color: #738097;
            font-size: 14px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 650;
        }

        .field input {
            width: 100%;
            min-height: 46px;
            padding: 0 13px;
            border: 1px solid #dce2ec;
            border-radius: 11px;
            outline: none;
            background: #fff;
            color: #172033;
            font: inherit;
        }

        .field input:focus {
            border-color: #5478ed;
            box-shadow: 0 0 0 3px rgba(84, 120, 237, 0.14);
        }

        .total-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 16px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #f4f7fd;
            font-size: 14px;
        }

        .total-line strong {
            color: #3158d1;
            font-size: 18px;
        }

        .dialog-actions {
            display: flex;
            gap: 10px;
        }

        .ghost-button {
            padding: 13px 18px;
            border: 1px solid #dce2ec;
            border-radius: 11px;
            color: #4a5871;
            background: #fff;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        .dialog-actions .primary-button {
            flex: 1;
        }

        footer {
            margin-top: 34px;
            color: #8a94a6;
            font-size: 13px;
            text-align: center;
        }

        footer a {
            color: #4a5871;
        }

        @media (max-width: 520px) {
            main {
                padding: 24px 16px 0;
            }

            .product-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">V</span>
            <span>Vitual XRing</span>
        </a>
        <div class="topbar-actions">
            <span class="balance-chip">余额 <b id="balance">—</b> VTX</span>
            <span class="version">v1.8.1</span>
            <a class="topbar-link active" href="shop.html">商店</a>
            <a class="topbar-link" href="chatroom.html">聊天室</a>

    <main>
        <section class="hero">

            <h1>商品列表</h1>
            <p class="hero-copy">使用 VTX 购买商品，可按分类筛选。下单后请把凭证截图发到 XRingCR 群，次日线下领取。</p>
        </section>

        <p id="shop-message" class="status" role="status" aria-live="polite" hidden></p>

        <nav id="shop-filters" class="filter-bar" aria-label="商品分类"></nav>

        <p id="shop-empty" class="empty" hidden>商店暂时没有商品。</p>

        <section id="receipt-card" class="receipt-card" aria-labelledby="receipt-title" hidden>

            <p id="receipt-text" class="receipt-text"></p>
        </section>

        <footer>Vitual XRing · 商店商品由站主维护 · <a href="manager.html">返回账户</a></footer>

    <dialog id="checkout-dialog" aria-labelledby="checkout-title">
        <form id="checkout-form" class="checkout">
            <h2 id="checkout-title">确认购买</h2>
            <p id="checkout-sub" class="checkout-sub"></p>

            <div class="field">
                <label for="checkout-quantity">购买数量</label>
                <input id="checkout-quantity" type="number" min="1" step="1" required>
            </div>

                <label for="checkout-password">账户密码确认</label>
                <input id="checkout-password" type="password" autocomplete="current-password" required>
            </div>

            <div class="total-line">
                <span>应付金额</span>
                <strong id="checkout-total">— VTX</strong>
            </div>

            <div class="dialog-actions">
                <button id="checkout-cancel" class="ghost-button" type="button">取消</button>
                <button id="checkout-submit" class="primary-button" type="submit">确认购买</button>
            </div>
        </form>
    </dialog>

    <script src="vtx-api.js?v=1.8.1"></script>


    <script>
        const accountName = sessionStorage.getItem("vtxAccount");
        if (!accountName) {
            window.location.replace("login.html");
        }

        const UNCATEGORIZED = "未分类";
        const ALL_CATEGORIES = "__all__";

        const message = document.getElementById("shop-message");
        const grid = document.getElementById("shop-grid");
        const filters = document.getElementById("shop-filters");
        const empty = document.getElementById("shop-empty");
        const receiptCard = document.getElementById("receipt-card");
        const dialog = document.getElementById("checkout-dialog");
        const form = document.getElementById("checkout-form");
        const quantityInput = document.getElementById("checkout-quantity");
        const passwordInput = document.getElementById("checkout-password");
        const totalLabel = document.getElementById("checkout-total");
        const submitButton = document.getElementById("checkout-submit");

        let shopData = null;
        let accountsData = null;
        let selectedId = null;
        let activeCategory = ALL_CATEGORIES;

        function showMessage(text, kind) {
            message.textContent = text;
            message.className = `status ${kind}`;
            message.hidden = false;
        }

        function clearMessage() {
            message.hidden = true;
        }

        function toCents(value) {
            const amount = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
            return Number.isFinite(amount) ? Math.round(amount * 100) : NaN;
        }

        function fromCents(cents) {
            return (cents / 100).toFixed(2);
        }

        function networkMessage(error, fallback) {
            return error instanceof TypeError ? fallback : error.message;
        }

        function renderBalance() {
            const account = accountsData && accountsData[accountName];
            document.getElementById("balance").textContent = account
                ? new Intl.NumberFormat("zh-CN", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(Number(account.money))
                : "—";
        }

        function stockOf(item) {
            const stock = Number(item.stock);
            return Number.isFinite(stock) ? Math.max(0, Math.floor(stock)) : 0;
        }

        function imageSource(value) {
            const text = String(value || "").trim();
            if (!text) {
                return "";
            }
            if (/^[a-z][a-z0-9+.-]*:/i.test(text) || text.startsWith("//")) {
                return text;
            }
            const segments = text
                .replace(/\\/g, "/")
                .replace(/^\.?\//, "")
                .split("/")
                .map((segment) => {
                    try {
                        return encodeURIComponent(decodeURIComponent(segment));
                    } catch (error) {
                        return encodeURIComponent(segment);
                    }
                })
                .join("/");
            return new URL(segments, window.location.href).href;
        }

        function retrySource(source) {
            if (/^data:/i.test(source)) {
                return "";
            }
            return `${source}${source.includes("?") ? "&" : "?"}retry=${Date.now()}`;
        }

        function renderProductImage(item) {
            const source = imageSource(item.image);
            if (!source) {
                return emptyImage();
            }

            const image = document.createElement("img");
            image.className = "product-image";
            image.loading = "lazy";
            image.decoding = "async";
            image.alt = item.name ? `${item.name} 图片` : "商品图片";

            // 首次失败多半是缓存里的旧 404，用带时间戳的地址重试一次再降级为占位
            image.addEventListener("error", () => {
                const retry = image.dataset.retried ? "" : retrySource(source);
                if (retry) {
                    image.dataset.retried = "1";
                    image.src = retry;
                    return;
                }
                if (image.isConnected) {
                    image.replaceWith(emptyImage());
                } else {
                    image.dataset.failed = "1";
                }
            });

            image.src = source;
            return image;
        }

        function emptyImage() {
            const placeholder = document.createElement("p");
            placeholder.className = "product-image-empty";
            placeholder.textContent = "无图片预览";
            return placeholder;
        }

        // shop.json 支持三种写法：
        // 1. { "items": [未分类商品], "分类名": [该分类商品] }  ← 6.2 推荐
        // 2. { "未分类": [...] }（同上，键名不同）
        // 3. [商品, 商品]（6.1 及更早的旧格式）
        function shopGroups(raw) {
            if (!raw) {
                return [];
            }
            if (Array.isArray(raw)) {
                return [{ name: UNCATEGORIZED, items: raw }];
            }

            const groups = [];
            const loose = [];
            for (const key of ["items", UNCATEGORIZED]) {
                if (Array.isArray(raw[key])) {
                    loose.push(...raw[key]);
                }
            }
            groups.push({ name: UNCATEGORIZED, items: loose });

            for (const [key, value] of Object.entries(raw)) {
                if (key === "items" || key === UNCATEGORIZED || key === "version") {
                    continue;
                }
                if (!Array.isArray(value)) {
                    continue;
                }
                groups.push({ name: key, items: value });
            }
            return groups;
        }

        function catalogEntries(raw) {
            const entries = [];
            for (const group of shopGroups(raw)) {
                for (const item of group.items) {
                    if (!item || typeof item !== "object") {
                        continue;
                    }
                    const own = typeof item.category === "string" ? item.category.trim() : "";
                    entries.push({ item, category: own || group.name });
                }
            }
            return entries;
        }

        function categoryNames(entries) {
            const names = [];
            for (const entry of entries) {
                if (entry.category === UNCATEGORIZED || names.includes(entry.category)) {
                    continue;
                }
                names.push(entry.category);
            }
            return names;
        }

        function findEntry(id) {
            return catalogEntries(shopData).find((entry) => entry.item.id === id) || null;
        }

        function findInShop(raw, id) {
            for (const group of shopGroups(raw)) {
                for (const item of group.items) {
                    if (item && item.id === id) {
                        return { group, item };
                    }
                }
            }
            return null;
        }

        function renderFilters(entries) {
            const names = categoryNames(entries);
            const uncategorized = entries.filter((entry) => entry.category === UNCATEGORIZED).length;
            const tabs = [
                { key: ALL_CATEGORIES, label: "全部", count: entries.length },
                { key: UNCATEGORIZED, label: UNCATEGORIZED, count: uncategorized },
                ...names.map((name) => ({
                    key: name,
                    label: name,
                    count: entries.filter((entry) => entry.category === name).length
                }))
            ];

            if (activeCategory !== ALL_CATEGORIES && !tabs.some((tab) => tab.key === activeCategory)) {
                activeCategory = ALL_CATEGORIES;
            }

            filters.textContent = "";
            for (const tab of tabs) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = tab.key === activeCategory ? "filter-chip active" : "filter-chip";
                button.setAttribute("aria-pressed", String(tab.key === activeCategory));
                button.textContent = tab.label;

                const count = document.createElement("span");
                count.className = "count";
                count.textContent = String(tab.count);
                button.appendChild(count);

                button.addEventListener("click", () => {
                    activeCategory = tab.key;
                    renderShop();
                });
                filters.appendChild(button);
            }
        }

        function renderShop() {
            grid.textContent = "";
            const entries = catalogEntries(shopData);
            renderFilters(entries);

            const visible = activeCategory === ALL_CATEGORIES
                ? entries
                : entries.filter((entry) => entry.category === activeCategory);

            if (visible.length === 0) {
                empty.textContent = entries.length ? "该分类下暂时没有商品。" : "商店暂时没有商品。";
                empty.hidden = false;
                return;
            }
            empty.hidden = true;

            for (const entry of visible) {
                const item = entry.item;
                const stock = stockOf(item);
                const onSale = stock > 0;

                const card = document.createElement("article");
                card.className = "product";
                card.appendChild(renderProductImage(item));

                const head = document.createElement("div");
                head.className = "product-head";

                const title = document.createElement("h2");
                title.textContent = item.name || "未命名商品";
                head.appendChild(title);

                const badge = document.createElement("span");
                badge.className = onSale ? "badge on" : "badge off";
                badge.textContent = onSale ? "在售" : "无货";
                head.appendChild(badge);
                card.appendChild(head);

                if (activeCategory === ALL_CATEGORIES) {
                    const category = document.createElement("p");
                    category.className = "product-category";
                    category.textContent = entry.category;
                    card.appendChild(category);
                }

                const desc = document.createElement("p");
                desc.className = "product-desc";
                desc.textContent = item.description || "暂无详情描述。";
                card.appendChild(desc);

                const meta = document.createElement("dl");
                meta.className = "product-meta";
                const manufacturer = document.createElement("div");
                const manufacturerLabel = document.createElement("dt");
                manufacturerLabel.textContent = "制造商";
                const manufacturerValue = document.createElement("dd");
                manufacturerValue.textContent = item.manufacturer || "未知";
                manufacturer.appendChild(manufacturerLabel);
                manufacturer.appendChild(manufacturerValue);
                const stockBox = document.createElement("div");
                const stockLabel = document.createElement("dt");
                stockLabel.textContent = "库存数量";
                const stockValue = document.createElement("dd");
                stockValue.textContent = `${stock} 件`;
                stockBox.appendChild(stockLabel);
                stockBox.appendChild(stockValue);
                meta.appendChild(manufacturer);
                meta.appendChild(stockBox);
                card.appendChild(meta);

                const foot = document.createElement("div");
                foot.className = "product-foot";
                const price = document.createElement("p");
                price.className = "price";
                price.textContent = fromCents(toCents(item.price)) === "NaN"
                    ? String(item.price || "—")
                    : `${fromCents(toCents(item.price))} VTX`;
                const unit = document.createElement("small");
                unit.textContent = " / 件";
                price.appendChild(unit);
                foot.appendChild(price);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "buy-button";
                button.textContent = onSale ? "购买" : "无货";
                button.disabled = !onSale;
                button.addEventListener("click", () => openCheckout(item));
                foot.appendChild(button);

                card.appendChild(foot);
                grid.appendChild(card);
            }
        }

        function currentTotalCents() {
            const entry = findEntry(selectedId);
            if (!entry) {
                return NaN;
            }
            const quantity = Math.max(1, Math.floor(Number(quantityInput.value) || 1));
            return toCents(entry.item.price) * quantity;
        }

        function renderTotal() {
            const total = currentTotalCents();
            totalLabel.textContent = Number.isFinite(total) ? `${fromCents(total)} VTX` : "— VTX";
        }

        function openCheckout(item) {
            selectedId = item.id;
            clearMessage();
            receiptCard.hidden = true;
            document.getElementById("checkout-sub").textContent = `${item.name} · 单价 ${item.price} VTX · 库存 ${stockOf(item)} 件`;
            quantityInput.min = "1";
            quantityInput.max = String(stockOf(item));
            quantityInput.value = "1";
            passwordInput.value = "";
            renderTotal();
            if (typeof dialog.showModal === "function") {
                dialog.showModal();
            } else {
                dialog.setAttribute("open", "");
            }
            quantityInput.focus();
        }

        function closeCheckout() {
            selectedId = null;
            if (typeof dialog.close === "function") {
                dialog.close();
            } else {
                dialog.removeAttribute("open");
            }
        }

        async function loadShop() {
            // 带上时间戳，避免读到 GitHub Pages CDN 里 10 分钟内的旧版本
            const response = await fetch(`shop.json?t=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) {
                throw new Error("无法读取商店数据，请稍后重试。");
            }
            shopData = await response.json();
            await applyServerStock();
            renderShop();
        }

        // 1.2.0：库存改由 Workers 记账（扣款与扣库存都在服务端），shop.json 里的 stock 只是初始值
        async function applyServerStock() {
            if (!window.VTXApi || typeof window.VTXApi.shopStock !== "function") {
                return;
            }
            try {
                const stock = await window.VTXApi.shopStock();
                eachItem(shopData, (item) => {
                    if (Object.prototype.hasOwnProperty.call(stock, item.id)) {
                        const value = Number(stock[item.id]);
                        if (Number.isFinite(value)) {
                            item.stock = Math.max(0, Math.floor(value));
                        }
                    }
                });
            } catch (error) {
                /* 读不到服务端库存时保留 shop.json 里的值 */
            }
        }

        function eachItem(shop, visit) {
            if (!shop || typeof shop !== "object") {
                return;
            }
            for (const value of Object.values(shop)) {
                if (!Array.isArray(value)) {
                    continue;
                }
                for (const item of value) {
                    if (item && typeof item === "object") {
                        visit(item);
                    }
                }
            }
        }

        async function loadAccount() {
            try {
                accountsData = await window.VTXApi.accounts();
            } catch (error) {
                return;
            }
            renderBalance();
        }

        async function purchase(event) {
            event.preventDefault();

            const entry = findEntry(selectedId);
            if (!entry) {
                showMessage("商品已失效，请刷新页面。", "error");
                return;
            }
            const item = entry.item;

            const quantity = Math.floor(Number(quantityInput.value));
            if (!Number.isFinite(quantity) || quantity <= 0) {
                showMessage("购买数量需要是大于 0 的整数。", "error");
                return;
            }
            if (quantity > stockOf(item)) {
                showMessage(`库存不足，当前只剩 ${stockOf(item)} 件。`, "error");
                return;
            }

            const password = passwordInput.value;
            if (!password) {
                showMessage("请输入账户密码确认购买。", "error");
                return;
            }

            const unitCents = toCents(item.price);
            if (!Number.isFinite(unitCents) || unitCents <= 0) {
                showMessage("商品价格无效，请联系站主。", "error");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "处理中…";

            try {
                const result = await buyItem(item, quantity, password);
                accountsData = result.accounts;
                shopData = result.shop;
                renderBalance();
                renderShop();
                closeCheckout();
                document.getElementById("receipt-text").textContent = result.receipt;
                receiptCard.hidden = false;
                receiptCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
                showMessage(`购买成功：${item.name} ×${quantity}，共 ${result.amount} VTX。`, "success");
            } catch (error) {
                showMessage(
                    networkMessage(error, "网络请求失败，请检查网络后重试。"),
                    "error"
                );
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "确认购买";
            }
        }

        async function buyItem(item, quantity, password) {
            // 1.2.0：价格与库存都由 Workers 依据 shop.json 计算并扣减，
            // 页面只告诉服务端「买哪个商品的几件」，不再上传金额。
            const payment = await window.VTXApi.purchase({
                id: item.id,
                quantity,
                password,
                description: `${item.name} ×${quantity}`
            });

            if (payment.stock && payment.stock.id === item.id) {
                item.stock = Math.max(0, Number(payment.stock.remaining) || 0);
            } else {
                item.stock = Math.max(0, stockOf(item) - quantity);
            }

            const unitCents = toCents(payment.item ? payment.item.unitPrice : item.price);
            const amount = Number.isFinite(unitCents) ? fromCents(unitCents * quantity) : "—";
            const accounts = { ...(accountsData || {}), [accountName]: payment.account };

            return { accounts, shop: shopData, receipt: payment.receipt, amount };
        }

        document.getElementById("checkout-cancel").addEventListener("click", closeCheckout);
        form.addEventListener("submit", purchase);
        quantityInput.addEventListener("input", renderTotal);

        async function init() {
            try {
                await loadShop();
                if (accountName && window.VTXApi.hasSession()) {
                    await loadAccount();
                }
            } catch (error) {
                showMessage(
                    networkMessage(error, "无法读取商店数据，请确认页面通过 https 打开后重试。"),
                    "error"
                );
            }
        }

        init();
    </script>
</body>
</html>
