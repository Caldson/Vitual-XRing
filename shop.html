<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>商店 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding-bottom: 48px;
            background:
                radial-gradient(circle at 10% 0, #e2edff 0, transparent 34%),
                radial-gradient(circle at 92% 8%, #e4f5f0 0, transparent 28%),
                #f4f7fb;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 14px 24px;
            border-bottom: 1px solid #e7ebf2;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #172033;
            font-weight: 800;
            text-decoration: none;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-size: 16px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 14px;
        }

        .topbar-link {
            color: #4a5871;
            text-decoration: none;
            font-weight: 650;
        }

        .topbar-link:hover,
        .topbar-link.active {
            color: #3158d1;
        }

        .version {
            padding: 4px 10px;
            border-radius: 999px;
            color: #3158d1;
            background: #eef2ff;
            font-size: 12.5px;
            font-weight: 700;
        }

        .balance-chip {
            padding: 6px 12px;
            border-radius: 999px;
            background: #eef7f2;
            color: #1f7a52;
            font-size: 13px;
        }

        main {
            width: min(100%, 1120px);
            margin: 0 auto;
            padding: 32px 24px 0;
        }

        .hero h1 {
            margin: 6px 0 8px;
            font-size: 30px;
        }

        .eyebrow {
            margin: 0;
            color: #738097;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-copy {
            margin: 0 0 24px;
            color: #738097;
            line-height: 1.7;
        }

        .status {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid transparent;
        }

        .status[hidden] {
            display: none;
        }

        .status.error {
            color: #a9202f;
            background: #fdeef0;
            border-color: #f6cdd3;
        }

        .status.success {
            color: #1f7a52;
            background: #edf8f2;
            border-color: #c8e8d6;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .product {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            border: 1px solid #e7ebf2;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 32px rgba(30, 50, 90, 0.06);
        }

        .product-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .product-head h2 {
            margin: 0;
            font-size: 18px;
            line-height: 1.4;
        }

        .badge {
            flex: none;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge.on {
            color: #1f7a52;
            background: #edf8f2;
        }

        .badge.off {
            color: #7c8698;
            background: #f1f3f8;
        }

        .product-desc {
            margin: 0;
            color: #5b6880;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        .product-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 0;
            font-size: 13px;
        }

        .product-meta div {
            padding: 8px 10px;
            border-radius: 10px;
            background: #f6f8fc;
        }

        .product-meta dt {
            color: #8a94a6;
            font-size: 12px;
        }

        .product-meta dd {
            margin: 2px 0 0;
            font-weight: 650;
        }

        .product-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: auto;
        }

        .price {
            margin: 0;
            color: #3158d1;
            font-size: 20px;
            font-weight: 800;
        }

        .price small {
            color: #8a94a6;
            font-size: 12px;
            font-weight: 600;
        }

        .buy-button,
        .primary-button {
            border: 0;
            border-radius: 11px;
            color: #fff;
            background: #4169e1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 150ms;
        }

        .buy-button {
            padding: 10px 18px;
        }

        .primary-button {
            width: 100%;
            padding: 13px 18px;
        }

        .buy-button:hover:not(:disabled),
        .primary-button:hover:not(:disabled) {
            background: #3158d1;
        }

        .buy-button:disabled,
        .primary-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .empty {
            padding: 40px;
            border: 1px dashed #d8dfec;
            border-radius: 18px;
            color: #738097;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
        }

        .empty[hidden] {
            display: none;
        }

        .receipt-card {
            margin-top: 26px;
            padding: 22px;
            border: 1px solid #c8e8d6;
            border-radius: 18px;
            background: #f2fbf6;
        }

        .receipt-card[hidden] {
            display: none;
        }

        .receipt-card h2 {
            margin: 0 0 10px;
            font-size: 17px;
            color: #1f7a52;
        }

        .receipt-text {
            margin: 0;
            color: #235c42;
            font-size: 15px;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        dialog {
            width: min(100% - 32px, 420px);
            padding: 0;
            border: 0;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(20, 40, 80, 0.24);
        }

        dialog::backdrop {
            background: rgba(23, 32, 51, 0.42);
        }

        .checkout {
            padding: 24px;
        }

        .checkout h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        .checkout-sub {
            margin: 0 0 18px;
            color: #738097;
            font-size: 14px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 650;
        }

        .field input {
            width: 100%;
            min-height: 46px;
            padding: 0 13px;
            border: 1px solid #dce2ec;
            border-radius: 11px;
            outline: none;
            background: #fff;
            color: #172033;
            font: inherit;
        }

        .field input:focus {
            border-color: #5478ed;
            box-shadow: 0 0 0 3px rgba(84, 120, 237, 0.14);
        }

        .total-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 16px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #f4f7fd;
            font-size: 14px;
        }

        .total-line strong {
            color: #3158d1;
            font-size: 18px;
        }

        .dialog-actions {
            display: flex;
            gap: 10px;
        }

        .ghost-button {
            padding: 13px 18px;
            border: 1px solid #dce2ec;
            border-radius: 11px;
            color: #4a5871;
            background: #fff;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        .dialog-actions .primary-button {
            flex: 1;
        }

        footer {
            margin-top: 34px;
            color: #8a94a6;
            font-size: 13px;
            text-align: center;
        }

        footer a {
            color: #4a5871;
        }

        @media (max-width: 520px) {
            main {
                padding: 24px 16px 0;
            }

            .product-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">V</span>
            <span>Vitual XRing</span>
        </a>
        <div class="topbar-actions">
            <span class="balance-chip">余额 <b id="balance">—</b> VTX</span>
            <span class="version">v6.1</span>
            <a class="topbar-link active" href="shop.html">商店</a>
            <a class="topbar-link" href="chatroom.html">聊天室</a>
            <a class="topbar-link" href="manager.html">返回账户</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">XRing 商店</p>
            <h1>商品列表</h1>
            <p class="hero-copy">使用 VTX 购买商品。下单后请把凭证截图发到 XRingCR 群，次日线下领取。</p>
        </section>

        <p id="shop-message" class="status" role="status" aria-live="polite" hidden></p>

        <section id="shop-grid" class="shop-grid" aria-label="商品列表"></section>
        <p id="shop-empty" class="empty" hidden>商店暂时没有商品。</p>

        <section id="receipt-card" class="receipt-card" aria-labelledby="receipt-title" hidden>
            <h2 id="receipt-title">购买凭证</h2>
            <p id="receipt-text" class="receipt-text"></p>
        </section>

        <footer>Vitual XRing · 商店商品由站主维护 · <a href="manager.html">返回账户</a></footer>
    </main>

    <dialog id="checkout-dialog" aria-labelledby="checkout-title">
        <form id="checkout-form" class="checkout">
            <h2 id="checkout-title">确认购买</h2>
            <p id="checkout-sub" class="checkout-sub"></p>

            <div class="field">
                <label for="checkout-quantity">购买数量</label>
                <input id="checkout-quantity" type="number" min="1" step="1" required>
            </div>
            <div class="field">
                <label for="checkout-password">账户密码确认</label>
                <input id="checkout-password" type="password" autocomplete="current-password" required>
            </div>

            <div class="total-line">
                <span>应付金额</span>
                <strong id="checkout-total">— VTX</strong>
            </div>

            <div class="dialog-actions">
                <button id="checkout-cancel" class="ghost-button" type="button">取消</button>
                <button id="checkout-submit" class="primary-button" type="submit">确认购买</button>
            </div>
        </form>
    </dialog>

    <script src="vtx-crypto.js?v=6.1"></script>
    <script src="vtx-api.js?v=6.1"></script>
    <script src="vtx-repo.js?v=6.1"></script>

    <script>
        const accountName = sessionStorage.getItem("vtxAccount");
        if (!accountName) {
            window.location.replace("login.html");
        }

        const message = document.getElementById("shop-message");
        const grid = document.getElementById("shop-grid");
        const empty = document.getElementById("shop-empty");
        const receiptCard = document.getElementById("receipt-card");
        const dialog = document.getElementById("checkout-dialog");
        const form = document.getElementById("checkout-form");
        const quantityInput = document.getElementById("checkout-quantity");
        const passwordInput = document.getElementById("checkout-password");
        const totalLabel = document.getElementById("checkout-total");
        const submitButton = document.getElementById("checkout-submit");

        let shopData = null;
        let accountsData = null;
        let selectedId = null;

        function showMessage(text, kind) {
            message.textContent = text;
            message.className = `status ${kind}`;
            message.hidden = false;
        }

        function clearMessage() {
            message.hidden = true;
        }

        function toCents(value) {
            const amount = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
            return Number.isFinite(amount) ? Math.round(amount * 100) : NaN;
        }

        function fromCents(cents) {
            return (cents / 100).toFixed(2);
        }

        function timestamp() {
            const now = new Date();
            const pad = (value) => String(value).padStart(2, "0");
            return `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} `
                + `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        function networkMessage(error, fallback) {
            return error instanceof TypeError ? fallback : error.message;
        }

        function renderBalance() {
            const account = accountsData && accountsData[accountName];
            document.getElementById("balance").textContent = account
                ? new Intl.NumberFormat("zh-CN", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(Number(account.money))
                : "—";
        }

        function stockOf(item) {
            const stock = Number(item.stock);
            return Number.isFinite(stock) ? Math.max(0, Math.floor(stock)) : 0;
        }

        function renderShop() {
            grid.textContent = "";
            const items = shopData && Array.isArray(shopData.items) ? shopData.items : [];
            empty.hidden = items.length > 0;

            for (const item of items) {
                const stock = stockOf(item);
                const onSale = stock > 0;

                const card = document.createElement("article");
                card.className = "product";

                const head = document.createElement("div");
                head.className = "product-head";

                const title = document.createElement("h2");
                title.textContent = item.name || "未命名商品";
                head.appendChild(title);

                const badge = document.createElement("span");
                badge.className = onSale ? "badge on" : "badge off";
                badge.textContent = onSale ? "在售" : "无货";
                head.appendChild(badge);
                card.appendChild(head);

                const desc = document.createElement("p");
                desc.className = "product-desc";
                desc.textContent = item.description || "暂无详情描述。";
                card.appendChild(desc);

                const meta = document.createElement("dl");
                meta.className = "product-meta";
                const manufacturer = document.createElement("div");
                const manufacturerLabel = document.createElement("dt");
                manufacturerLabel.textContent = "制造商";
                const manufacturerValue = document.createElement("dd");
                manufacturerValue.textContent = item.manufacturer || "未知";
                manufacturer.appendChild(manufacturerLabel);
                manufacturer.appendChild(manufacturerValue);
                const stockBox = document.createElement("div");
                const stockLabel = document.createElement("dt");
                stockLabel.textContent = "库存数量";
                const stockValue = document.createElement("dd");
                stockValue.textContent = `${stock} 件`;
                stockBox.appendChild(stockLabel);
                stockBox.appendChild(stockValue);
                meta.appendChild(manufacturer);
                meta.appendChild(stockBox);
                card.appendChild(meta);

                const foot = document.createElement("div");
                foot.className = "product-foot";
                const price = document.createElement("p");
                price.className = "price";
                price.textContent = fromCents(toCents(item.price)) === "NaN"
                    ? String(item.price || "—")
                    : `${fromCents(toCents(item.price))} VTX`;
                const unit = document.createElement("small");
                unit.textContent = " / 件";
                price.appendChild(unit);
                foot.appendChild(price);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "buy-button";
                button.textContent = onSale ? "购买" : "无货";
                button.disabled = !onSale;
                button.addEventListener("click", () => openCheckout(item));
                foot.appendChild(button);

                card.appendChild(foot);
                grid.appendChild(card);
            }
        }

        function currentTotalCents() {
            const item = (shopData.items || []).find((entry) => entry.id === selectedId);
            if (!item) {
                return NaN;
            }
            const quantity = Math.max(1, Math.floor(Number(quantityInput.value) || 1));
            return toCents(item.price) * quantity;
        }

        function renderTotal() {
            const total = currentTotalCents();
            totalLabel.textContent = Number.isFinite(total) ? `${fromCents(total)} VTX` : "— VTX";
        }

        function openCheckout(item) {
            selectedId = item.id;
            clearMessage();
            receiptCard.hidden = true;
            document.getElementById("checkout-sub").textContent = `${item.name} · 单价 ${item.price} VTX · 库存 ${stockOf(item)} 件`;
            quantityInput.min = "1";
            quantityInput.max = String(stockOf(item));
            quantityInput.value = "1";
            passwordInput.value = "";
            renderTotal();
            if (typeof dialog.showModal === "function") {
                dialog.showModal();
            } else {
                dialog.setAttribute("open", "");
            }
            quantityInput.focus();
        }

        function closeCheckout() {
            selectedId = null;
            if (typeof dialog.close === "function") {
                dialog.close();
            } else {
                dialog.removeAttribute("open");
            }
        }

        async function loadShop() {
            try {
                const fresh = await window.VTXRepo.readJson("shop.json");
                shopData = fresh.data;
            } catch (error) {
                const response = await fetch("shop.json", { cache: "no-store" });
                if (!response.ok) {
                    throw error;
                }
                shopData = await response.json();
            }
            renderShop();
        }

        async function loadAccount() {
            try {
                accountsData = await window.VTXApi.readAll();
            } catch (error) {
                const response = await fetch("account.json", { cache: "no-store" });
                if (response.ok) {
                    accountsData = await response.json();
                }
            }
            renderBalance();
        }

        async function purchase(event) {
            event.preventDefault();

            const item = (shopData.items || []).find((entry) => entry.id === selectedId);
            if (!item) {
                showMessage("商品已失效，请刷新页面。", "error");
                return;
            }

            const quantity = Math.floor(Number(quantityInput.value));
            if (!Number.isFinite(quantity) || quantity <= 0) {
                showMessage("购买数量需要是大于 0 的整数。", "error");
                return;
            }
            if (quantity > stockOf(item)) {
                showMessage(`库存不足，当前只剩 ${stockOf(item)} 件。`, "error");
                return;
            }

            const password = passwordInput.value;
            if (!password) {
                showMessage("请输入账户密码确认购买。", "error");
                return;
            }

            const unitCents = toCents(item.price);
            if (!Number.isFinite(unitCents) || unitCents <= 0) {
                showMessage("商品价格无效，请联系站主。", "error");
                return;
            }
            const totalCents = unitCents * quantity;

            submitButton.disabled = true;
            submitButton.textContent = "处理中…";

            try {
                const result = await buyItem(item.id, quantity, totalCents, password);
                accountsData = result.accounts;
                shopData = result.shop;
                renderBalance();
                renderShop();
                closeCheckout();
                document.getElementById("receipt-text").textContent = result.receipt;
                receiptCard.hidden = false;
                receiptCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
                showMessage(`购买成功：${item.name} ×${quantity}，共 ${fromCents(totalCents)} VTX。`, "success");
            } catch (error) {
                showMessage(
                    networkMessage(error, "网络请求失败，请确认可以访问 api.github.com 后重试。"),
                    "error"
                );
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "确认购买";
            }
        }

        async function buyItem(itemId, quantity, totalCents, password) {
            let lastError;

            for (let attempt = 0; attempt < 3; attempt += 1) {
                const shop = await window.VTXRepo.readJson("shop.json");
                const accounts = await window.VTXApi.readAll();
                const shopFile = shop.data;
                const items = Array.isArray(shopFile.items) ? shopFile.items : [];
                const item = items.find((entry) => entry.id === itemId);
                const account = accounts[accountName];

                if (!item) {
                    throw new Error("商品已下架，请刷新页面。");
                }
                if (!account) {
                    throw new Error("当前账户在 account.json 中不存在。");
                }
                if (account.password !== password) {
                    throw new Error("账户密码不正确。");
                }
                if (stockOf(item) < quantity) {
                    throw new Error(`库存不足，当前只剩 ${stockOf(item)} 件。`);
                }
                if (toCents(account.money) < totalCents) {
                    throw new Error(`余额不足，当前余额 ${fromCents(toCents(account.money))} VTX。`);
                }

                const time = timestamp();
                const amount = fromCents(totalCents);

                item.stock = stockOf(item) - quantity;

                account.money = fromCents(toCents(account.money) - totalCents);
                account.trades = Array.isArray(account.trades) ? account.trades : [];
                account.trades.push({
                    name: "购买商品",
                    description: `${item.name} ×${quantity}`,
                    price: `-${amount}`,
                    time,
                    from: account.username || accountName,
                    to: "XRingCR"
                });

                const receipt = `购买成功：${item.name} ×${quantity}，共 ${amount} VTX，请不要关闭此窗口，请将此窗口截图在XRingCR群中发给群主，次日将在学校给你商品。购买时间：${time}`;

                try {
                    await window.VTXRepo.commitFiles(
                        [
                            { path: "shop.json", content: `${JSON.stringify(shopFile, null, 4)}\n` },
                            { path: "account.json", content: `${JSON.stringify(accounts, null, 4)}\n` }
                        ],
                        `购买商品：${account.username || accountName} 购买 ${item.name} ×${quantity}`,
                        { attempts: 1 }
                    );
                    return { accounts, shop: shopFile, receipt };
                } catch (error) {
                    if (error.status !== 409 && error.status !== 422) {
                        throw error;
                    }
                    lastError = error;
                }
            }

            throw lastError || new Error("购买写入冲突，请重试。");
        }

        document.getElementById("checkout-cancel").addEventListener("click", closeCheckout);
        form.addEventListener("submit", purchase);
        quantityInput.addEventListener("input", renderTotal);

        async function init() {
            if (!accountName) {
                return;
            }
            try {
                await Promise.all([loadShop(), loadAccount()]);
            } catch (error) {
                showMessage(
                    networkMessage(error, "无法读取商店数据，请确认页面通过 https 打开后重试。"),
                    "error"
                );
            }
        }

        init();
    </script>
</body>
</html>
