<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>AI 生图 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #f4f7fb;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px max(20px, calc((100% - 1120px) / 2));
            border-bottom: 1px solid #e8edf4;
            background: #fff;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #172033;
            font-weight: 750;
            text-decoration: none;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-weight: 800;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-chip {
            padding: 7px 14px;
            border-radius: 999px;
            color: #1f2b45;
            background: #f1f4fa;
            font-size: 13.5px;
        }

        .balance-chip b {
            color: #3158d1;
        }

        .version {
            padding: 5px 10px;
            border-radius: 999px;
            color: #3158d1;
            background: #eef2ff;
            font-size: 12.5px;
            font-weight: 700;
        }

        .topbar-link {
            padding: 9px 14px;
            border: 1px solid #dfe5ee;
            border-radius: 10px;
            color: #536179;
            background: #fff;
            font-size: 14px;
            text-decoration: none;
        }

        .topbar-link:hover {
            border-color: #b9c7df;
            color: #3158d1;
        }

        main {
            width: min(100% - 40px, 1120px);
            margin: 24px auto 48px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 380px;
            gap: 20px;
            align-items: start;
        }

        .card {
            padding: 24px;
            border: 1px solid #e7ebf2;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(30, 50, 90, 0.05);
        }

        .card h2 {
            margin: 0 0 6px;
            font-size: 17px;
        }

        .card-hint {
            margin: 0 0 18px;
            color: #8994a7;
            font-size: 13px;
            line-height: 1.6;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .field label {
            color: #4a576d;
            font-size: 13px;
            font-weight: 650;
        }

        select,
        textarea {
            width: 100%;
            border: 1px solid #dce2ec;
            border-radius: 10px;
            background: #fff;
            color: #172033;
            font: inherit;
            font-size: 14px;
            outline: none;
        }

        select {
            min-height: 42px;
            padding: 0 10px;
        }

        textarea {
            min-height: 110px;
            padding: 12px 14px;
            line-height: 1.6;
            resize: vertical;
        }

        select:focus,
        textarea:focus {
            border-color: #5478ed;
            box-shadow: 0 0 0 3px rgba(84, 120, 237, 0.14);
        }

        .price-line {
            color: #8994a7;
            font-size: 12.5px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }

        .primary-button {
            min-height: 44px;
            padding: 0 22px;
            border: 0;
            border-radius: 11px;
            color: #fff;
            background: #4169e1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-button:hover {
            background: #3158d1;
        }

        .primary-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            margin: 14px 0 0;
            padding: 12px 14px;
            border: 1px solid #e3eaf8;
            border-radius: 12px;
            color: #536179;
            background: #f8faff;
            font-size: 13.5px;
            line-height: 1.6;
        }

        .status[hidden] {
            display: none;
        }

        .status.error {
            border-color: #f2d4d7;
            color: #a4313c;
            background: #fff8f8;
        }

        .status.success {
            border-color: #cfe8da;
            color: #1f7a52;
            background: #f6fdf9;
        }

        .result {
            margin-top: 16px;
            padding: 16px;
            border: 1px solid #eef1f6;
            border-radius: 14px;
            background: #f9fbfe;
        }

        .result[hidden] {
            display: none;
        }

        .result img {
            width: 100%;
            max-height: 520px;
            border-radius: 12px;
            object-fit: contain;
            background: #eef2f8;
        }

        .result-meta {
            margin: 12px 0 0;
            color: #8994a7;
            font-size: 12.5px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .result-meta a {
            color: #3158d1;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .gallery button {
            padding: 0;
            border: 1px solid #e7ebf2;
            border-radius: 10px;
            background: #f7f9fd;
            cursor: pointer;
            overflow: hidden;
            aspect-ratio: 1 / 1;
        }

        .gallery button:hover {
            border-color: #5478ed;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-empty {
            margin: 0;
            color: #9aa4b6;
            font-size: 13px;
        }

        .gallery-empty[hidden] {
            display: none;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true">V</span>
            <span>Vitual XRing</span>
        </a>
        <div class="topbar-actions">
            <span class="balance-chip">余额 <b id="balance">—</b> VTX</span>
            <span class="version">v5.0</span>
            <a class="topbar-link" href="chat.html">AI 聊天</a>
            <a class="topbar-link" href="manager.html">返回账户</a>
        </div>
    </header>

    <main>
        <div class="grid">
            <section class="card">
                <h2>AI 生图</h2>
                <p class="card-hint">输入提示词生成图片，费用 = 提示词字数 × 单价 + 每张图片单价，生成失败会自动退款。</p>

                <div class="field">
                    <label for="image-model">模型</label>
                    <select id="image-model"></select>
                    <span id="image-price" class="price-line"></span>
                </div>

                <div class="field">
                    <label for="prompt">提示词</label>
                    <textarea id="prompt" maxlength="500" placeholder="例如：一只戴着墨镜的橘猫，赛博朋克风格，霓虹灯背景"></textarea>
                    <span id="cost-hint" class="price-line"></span>
                </div>

                <div class="actions">
                    <span class="price-line">尺寸固定 1024 × 1024</span>
                    <button id="generate-button" class="primary-button" type="button">生成图片</button>
                </div>

                <p id="image-message" class="status" role="status" aria-live="polite" hidden></p>

                <div id="result" class="result" hidden>
                    <img id="result-image" alt="生成结果">
                    <p id="result-meta" class="result-meta"></p>
                </div>
            </section>

            <section class="card">
                <h2>我的作品</h2>
                <p class="card-hint">保存在本浏览器中，点击可重新载入。</p>
                <div id="gallery" class="gallery"></div>
                <p id="gallery-empty" class="gallery-empty" hidden>还没有生成过图片。</p>
            </section>
        </div>
    </main>

    <script src="vtx-crypto.js?v=5.0"></script>
    <script src="vtx-api.js?v=5.0"></script>

    <script>
        const MODELS = [
            {
                id: "microsoft/mai-image-2.6",
                label: "Microsoft MAI Image 2.6",
                inputPerChar: 1,
                imageCents: 500
            },
            {
                id: "openai/gpt-image-2",
                label: "GPT Image 2",
                inputPerChar: 0.7,
                imageCents: 475
            },
            {
                id: "community/tomdacatto/gpt-image-2.5-flare",
                label: "GPT Image 2.5 Flare",
                inputPerChar: 3,
                imageCents: 1000
            }
        ];

        const SIZE = 1024;
        const REFERRER = "xsmmc.caldson.us.ci";
        const accountName = sessionStorage.getItem("vtxAccount");
        const storageKey = `vtxImages:${accountName}`;
        const modelKey = `vtxImagesModel:${accountName}`;

        const elements = {
            balance: document.getElementById("balance"),
            model: document.getElementById("image-model"),
            price: document.getElementById("image-price"),
            prompt: document.getElementById("prompt"),
            costHint: document.getElementById("cost-hint"),
            button: document.getElementById("generate-button"),
            feedback: document.getElementById("image-message"),
            result: document.getElementById("result"),
            resultImage: document.getElementById("result-image"),
            resultMeta: document.getElementById("result-meta"),
            gallery: document.getElementById("gallery"),
            galleryEmpty: document.getElementById("gallery-empty")
        };

        let account = null;
        let busy = false;
        let modelId = localStorage.getItem(modelKey) || MODELS[0].id;
        let currentObjectUrl = null;
        let cooldownUntil = 0;
        let cooldownTimer = null;

        function chars(text) {
            return Array.from(text).length;
        }

        function toCents(value) {
            const amount = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
            return Number.isFinite(amount) ? Math.round(amount * 100) : 0;
        }

        function fromCents(cents) {
            return (cents / 100).toFixed(2);
        }

        function currentModel() {
            return MODELS.find((model) => model.id === modelId) || MODELS[0];
        }

        function inputCents(prompt, model) {
            return Math.ceil(Number((chars(prompt) * model.inputPerChar * 100).toFixed(4)));
        }

        function now() {
            const date = new Date();
            const pad = (value) => String(value).padStart(2, "0");
            return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} `
                + `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function formatPrice(model) {
            return `输入 ${model.inputPerChar} VTX/字符 · 输出 ${fromCents(model.imageCents)} VTX/张`;
        }

        function imageUrl(requestModel, prompt, seed) {
            return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`
                + `?model=${requestModel}&width=${SIZE}&height=${SIZE}&nologo=true&seed=${seed}&referrer=${REFERRER}`;
        }

        function showMessage(text, kind) {
            elements.feedback.textContent = text;
            elements.feedback.className = `status ${kind || ""}`;
            elements.feedback.hidden = false;
        }

        function hideMessage() {
            elements.feedback.hidden = true;
        }

        function updateButton() {
            if (busy) {
                elements.button.disabled = true;
                elements.button.textContent = "生成中…";
                return;
            }

            const left = Math.ceil((cooldownUntil - Date.now()) / 1000);
            if (left > 0) {
                elements.button.disabled = true;
                elements.button.textContent = `冷却中 ${left}s`;
                return;
            }

            elements.button.disabled = false;
            elements.button.textContent = "生成图片";
        }

        function startCooldown(seconds) {
            cooldownUntil = Date.now() + seconds * 1000;
            clearInterval(cooldownTimer);
            cooldownTimer = setInterval(() => {
                updateButton();
                if (Date.now() >= cooldownUntil) {
                    clearInterval(cooldownTimer);
                    cooldownTimer = null;
                }
            }, 500);
            updateButton();
        }

        function renderBalance() {
            elements.balance.textContent = account ? fromCents(toCents(account.money)) : "—";
        }

        function renderModelBar() {
            const model = currentModel();
            elements.price.textContent = formatPrice(model);
            updateCostHint();
        }

        function updateCostHint() {
            const model = currentModel();
            const prompt = elements.prompt.value;
            const inputCost = inputCents(prompt, model);

            if (!prompt) {
                elements.costHint.textContent = `输入 ${model.inputPerChar} VTX/字符 + 每张 ${fromCents(model.imageCents)} VTX`;
                return;
            }

            elements.costHint.textContent = `提示词 ${chars(prompt)} 字符 ≈ ${fromCents(inputCost)} VTX + 图片 ${fromCents(model.imageCents)} VTX = ${fromCents(inputCost + model.imageCents)} VTX`;
        }

        function loadHistory() {
            try {
                const parsed = JSON.parse(localStorage.getItem(storageKey) || "[]");
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function saveHistory(history) {
            try {
                localStorage.setItem(storageKey, JSON.stringify(history.slice(-40)));
            } catch (error) {
                /* 存储空间不足时忽略 */
            }
        }

        function showImage(blob, record) {
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
            }
            currentObjectUrl = URL.createObjectURL(blob);
            elements.resultImage.src = currentObjectUrl;
            elements.resultMeta.textContent = `${record.modelLabel} · ${record.prompt} · ${record.time} · ${record.cost} VTX`;
            elements.result.hidden = false;
        }

        function renderGallery() {
            const history = loadHistory().slice().reverse();
            elements.gallery.textContent = "";
            elements.galleryEmpty.hidden = history.length > 0;

            for (const record of history) {
                const button = document.createElement("button");
                button.type = "button";
                button.title = `${record.prompt}\n${record.time} · ${record.cost} VTX`;

                const image = document.createElement("img");
                image.loading = "lazy";
                image.alt = record.prompt;
                image.src = imageUrl(record.requestModel, record.prompt, record.seed);

                button.appendChild(image);
                button.addEventListener("click", () => {
                    if (busy) {
                        return;
                    }
                    elements.resultImage.src = image.src;
                    elements.resultMeta.textContent = `${record.modelLabel} · ${record.prompt} · ${record.time} · ${record.cost} VTX`;
                    elements.result.hidden = false;
                });
                elements.gallery.appendChild(button);
            }
        }

        async function loadImage(url) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 120000);

            try {
                const response = await fetch(url, { signal: controller.signal, cache: "force-cache" });
                const type = response.headers.get("content-type") || "";

                if (!response.ok || !type.startsWith("image/")) {
                    let code = "";
                    let detail = "";
                    try {
                        const payload = JSON.parse(await response.text());
                        code = String(payload && payload.error && payload.error.code || "");
                        detail = String(payload && payload.error && payload.error.message || "");
                    } catch (error) {
                        /* 非 JSON 错误体 */
                    }

                    const failure = new Error(detail || `生成失败（HTTP ${response.status}）`);
                    failure.status = response.status;
                    failure.code = code;
                    throw failure;
                }

                return await response.blob();
            } finally {
                clearTimeout(timer);
            }
        }

        async function requestImage(model, prompt, seed) {
            const blob = await loadImage(imageUrl(model.id, prompt, seed));
            return { blob, requestModel: model.id };
        }

        async function charge(costCents, model, prompt) {
            const updated = await window.VTXApi.commit((data) => {
                const target = data[accountName];
                if (!target) {
                    throw new Error("当前账户在 account.json 中不存在。");
                }
                if (toCents(target.money) < costCents) {
                    throw new Error("余额不足。");
                }

                target.money = fromCents(toCents(target.money) - costCents);
                target.trades = Array.isArray(target.trades) ? target.trades : [];
                target.trades.push({
                    name: "AI 生图",
                    description: `${model.label} · 提示词 ${chars(prompt)} 字符`,
                    price: `-${fromCents(costCents)}`,
                    time: now(),
                    from: target.username || accountName,
                    to: "AI"
                });

                return `AI 生图：${target.username || accountName} -${fromCents(costCents)} VTX（${model.label}）`;
            });

            account = updated[accountName];
            renderBalance();
        }

        async function refund(costCents, model, reason) {
            try {
                const updated = await window.VTXApi.commit((data) => {
                    const target = data[accountName];
                    if (!target) {
                        throw new Error("账户不存在");
                    }

                    target.money = fromCents(toCents(target.money) + costCents);
                    target.trades = Array.isArray(target.trades) ? target.trades : [];
                    target.trades.push({
                        name: "生图退款",
                        description: `${model.label} · ${reason}`,
                        price: `+${fromCents(costCents)}`,
                        time: now(),
                        from: "官方",
                        to: target.username || accountName
                    });

                    return `生图退款：${target.username || accountName} +${fromCents(costCents)} VTX`;
                });

                account = updated[accountName];
                renderBalance();
                return true;
            } catch (error) {
                return false;
            }
        }

        async function generate() {
            if (busy || !account || Date.now() < cooldownUntil) {
                return;
            }

            const model = currentModel();
            const prompt = elements.prompt.value.trim();

            hideMessage();

            if (!prompt) {
                showMessage("请输入提示词。", "error");
                return;
            }
            if (chars(prompt) > 500) {
                showMessage("提示词不能超过 500 字符。", "error");
                return;
            }

            const inputCost = inputCents(prompt, model);
            const totalCents = inputCost + model.imageCents;
            const balanceCents = toCents(account.money);

            if (balanceCents < totalCents) {
                showMessage(`余额不足：本次需要 ${fromCents(totalCents)} VTX，当前余额 ${fromCents(balanceCents)} VTX。`, "error");
                return;
            }

            busy = true;
            elements.prompt.disabled = true;
            elements.model.disabled = true;
            updateButton();
            showMessage(`正在生成，请稍候…（已扣 ${fromCents(totalCents)} VTX，失败会自动退款）`);

            const seed = Math.floor(Math.random() * 1000000);
            let charged = false;

            try {
                await charge(totalCents, model, prompt);
                charged = true;

                const { blob, requestModel } = await requestImage(model, prompt, seed);
                const record = {
                    id: `i${Date.now()}`,
                    prompt,
                    seed,
                    requestModel,
                    modelLabel: model.label,
                    time: now(),
                    cost: fromCents(totalCents)
                };

                showImage(blob, record);
                const history = loadHistory();
                history.push(record);
                saveHistory(history);
                renderGallery();
                showMessage(`生成成功，已扣费 ${fromCents(totalCents)} VTX（${model.label}）。`, "success");
                startCooldown(45);
            } catch (error) {
                const limited = error.code === "FREE_LIMIT" || error.status === 429;

                if (charged) {
                    const refunded = await refund(totalCents, model, limited ? "触发频率限制" : "生成失败");
                    const reason = limited
                        ? "生成太频繁（免费额度：每 45 秒 1 张）"
                        : error.name === "AbortError" ? "生成超时" : error.message;

                    showMessage(
                        `${reason}。${refunded ? `已退款 ${fromCents(totalCents)} VTX` : "退款失败，请联系群主"}，请稍后再试。`,
                        "error"
                    );
                } else {
                    showMessage(error instanceof TypeError ? "网络请求失败，本次未扣费。" : error.message, "error");
                }

                if (limited) {
                    startCooldown(45);
                }
            } finally {
                busy = false;
                elements.prompt.disabled = false;
                elements.model.disabled = false;
                updateButton();
            }
        }

        function initModelSelect() {
            for (const model of MODELS) {
                const option = document.createElement("option");
                option.value = model.id;
                option.textContent = `${model.label} · ${formatPrice(model)}`;
                elements.model.appendChild(option);
            }

            if (!MODELS.some((model) => model.id === modelId)) {
                modelId = MODELS[0].id;
            }
            elements.model.value = modelId;
            renderModelBar();
        }

        elements.prompt.addEventListener("input", updateCostHint);
        elements.model.addEventListener("change", () => {
            modelId = elements.model.value;
            localStorage.setItem(modelKey, modelId);
            renderModelBar();
        });
        elements.button.addEventListener("click", generate);

        async function init() {
            if (!accountName) {
                window.location.replace("login.html");
                return;
            }

            initModelSelect();
            renderGallery();

            try {
                const accounts = await window.VTXApi.readAll();
                account = accounts[accountName];

                if (!account) {
                    sessionStorage.removeItem("vtxAccount");
                    window.location.replace("login.html");
                    return;
                }

                renderBalance();
            } catch (error) {
                showMessage(
                    error instanceof TypeError ? "无法读取账户数据，请检查网络。" : error.message,
                    "error"
                );
            }
        }

        init();
    </script>
</body>
</html>
