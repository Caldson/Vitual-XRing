<script src="vtx-qr.js?v=1.5.0"></script>
<script src="vtx-api.js?v=1.5.0"></script>
<script>
(function () {
    "use strict";

    const el = (id) => document.getElementById(id);
    const state = {
        me: "",
        username: "",
        isAdmin: false,
        tab: "chats",
        conversations: [],
        contacts: { friends: [], blocked: [], incoming: [], outgoing: [] },
        current: null,
        members: [],
        messages: [],
        hasMore: false,
        oldest: 0,
        replyTo: null,
        typing: {},
        online: new Set(),
        ws: null,
        wsConnected: false,
        reconnectDelay: 1000,
        reconnectTimer: null,
        pollTimer: null,
        searchQuery: "",
        searchResults: [],
        lastTypingSent: 0,
        adminConversations: [],
        publicGroups: [],
        uid: 0,
        myMoney: "",
        invite: null,
        /* 1.5.0：@ 选人状态 */
        mention: { active: false, items: [], index: 0 }
    };

    let api = window.VTXApi;
    const REQUIRED_API_VERSION = "1.5.0";
    const SDK_URL = "vtx-api.js";

    /* 1.3.0：iPad / iPhone 视口高度修正（issue #2）
       iOS 的 100vh 取的是「工具栏收起后」的大视口，键盘弹出时也不会变，
       于是聊天区被撑出屏幕、消息列表失去滚动条、输入框落到屏幕外。
       这里用 visualViewport 的实际高度盖掉 CSS 高度，并在键盘 / 旋转时重算。 */
    function syncViewportHeight() {
        const viewport = window.visualViewport;
        const height = Math.round(viewport && viewport.height ? viewport.height : window.innerHeight);
        const appEl = el("app");
        if (!height || !appEl || appEl.style.height === `${height}px`) {
            return;
        }
        const list = el("messages");
        const pinned = Boolean(list) && list.scrollHeight - list.scrollTop - list.clientHeight < 120;
        appEl.style.height = `${height}px`;
        document.documentElement.style.setProperty("--app-height", `${height}px`);
        if (pinned) {
            list.scrollTop = list.scrollHeight;
        }
    }

    syncViewportHeight();
    window.addEventListener("resize", syncViewportHeight);
    window.addEventListener("orientationchange", () => setTimeout(syncViewportHeight, 150));
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncViewportHeight);
        window.visualViewport.addEventListener("scroll", syncViewportHeight);
    }

    function compareVersion(left, right) {
        const a = String(left || "").split(".").map((item) => Number(item) || 0);
        const b = String(right || "").split(".").map((item) => Number(item) || 0);
        for (let index = 0; index < Math.max(a.length, b.length); index += 1) {
            const diff = (a[index] || 0) - (b[index] || 0);
            if (diff !== 0) {
                return diff > 0 ? 1 : -1;
            }
        }
        return 0;
    }

    function sdkReady() {
        return Boolean(window.VTXApi && window.VTXApi.version
            && compareVersion(window.VTXApi.version, REQUIRED_API_VERSION) >= 0);
    }

    function loadSdk(src) {
        return new Promise((resolve) => {
            const script = document.createElement("script");
            script.src = src;
            script.onload = () => resolve(sdkReady());
            script.onerror = () => resolve(false);
            document.head.appendChild(script);
        });
    }

    function showStale(detail) {
        el("app").hidden = true;
        el("gate").hidden = true;
        el("stale-detail").textContent = detail;
        el("stale").hidden = false;
    }

    async function ensureSdk() {
        if (sdkReady()) {
            return true;
        }
        /* 页面缓存的 SDK 可能是旧版本（缺少新接口），先强制加载一次最新文件 */
        if (await loadSdk(`${SDK_URL}?v=${REQUIRED_API_VERSION}&t=${Date.now()}`)) {
            api = window.VTXApi;
            return true;
        }
        const found = window.VTXApi && window.VTXApi.version ? window.VTXApi.version : "未知";
        showStale(`当前加载的 ${SDK_URL} 版本是 ${found}，聊天室需要 ${REQUIRED_API_VERSION}。请点下面按钮重新加载。`);
        return false;
    }

    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function initial(value) {
        const text = String(value || "?").trim();
        return escapeHtml(text.slice(0, 1).toUpperCase());
    }

    /* ───────── 1.5.0：@（mention） ───────── */

    // 当前会话里可以被 @ 的人（不含自己）
    function mentionMembers() {
        return (state.members || []).filter((item) => item && item.login && item.login !== state.me);
    }

    function memberLabel(member) {
        return member.alias || member.username || member.login;
    }

    // 把纯文本里的 @登录名 渲染成高亮片段（先转义，再替换，避免 XSS）
    function renderMentions(text, mentions) {
        const safe = escapeHtml(text);
        const names = Array.from(new Set(
            (Array.isArray(mentions) ? mentions : [])
                .map((item) => String(item || "").trim())
                .filter(Boolean)
        )).sort((left, right) => right.length - left.length);
        if (!names.length) {
            return safe;
        }
        let html = safe;
        for (const name of names) {
            const pattern = new RegExp(`@${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w.-])`, "g");
            html = html.replace(pattern, `<span class="mention">@${escapeHtml(name)}</span>`);
        }
        return html;
    }

    // 从输入框文本里找出真正要通知的人：必须是本会话成员，且 @ 前面是边界
    function collectMentions(text) {
        const value = String(text || "");
        if (!value.includes("@")) {
            return [];
        }
        const found = [];
        for (const member of mentionMembers()) {
            const pattern = new RegExp(`(^|[^\\w.-])@${member.login.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w.-])`);
            if (pattern.test(value)) {
                found.push(member.login);
            }
        }
        return found;
    }

    // 光标前是否正好是一个 @关键词
    function mentionQuery(input) {
        const caret = typeof input.selectionStart === "number" ? input.selectionStart : input.value.length;
        const before = input.value.slice(0, caret);
        const match = before.match(/(?:^|\s)@([^\s@]{0,24})$/);
        if (!match) {
            return null;
        }
        return { query: match[1], start: caret - match[1].length - 1, end: caret };
    }

    function mentionCandidates(query) {
        const keyword = String(query || "").toLowerCase();
        const scored = [];
        for (const member of mentionMembers()) {
            const login = String(member.login || "");
            const label = memberLabel(member);
            const haystack = `${login} ${label}`.toLowerCase();
            let score = -1;
            if (!keyword) {
                score = 0;
            } else if (login.toLowerCase().startsWith(keyword) || String(label).toLowerCase().startsWith(keyword)) {
                score = 2;
            } else if (haystack.includes(keyword)) {
                score = 1;
            }
            if (score >= 0) {
                scored.push({ member, score, label });
            }
        }
        scored.sort((left, right) => right.score - left.score
            || left.member.login.localeCompare(right.member.login, "zh-CN"));
        return scored.slice(0, 8).map((item) => item.member);
    }

    function hideMentionPicker() {
        state.mention.active = false;
        state.mention.items = [];
        state.mention.index = 0;
        const picker = el("mention-picker");
        if (picker) {
            picker.hidden = true;
            picker.innerHTML = "";
        }
    }

    function renderMentionPicker() {
        const picker = el("mention-picker");
        if (!picker) {
            return;
        }
        if (!state.mention.active) {
            picker.hidden = true;
            return;
        }
        picker.hidden = false;
        if (!state.mention.items.length) {
            picker.innerHTML = '<div class="mention-empty">没有匹配的成员</div>';
            return;
        }
        picker.innerHTML = state.mention.items.map((member, index) => `
            <button type="button" class="mention-item${index === state.mention.index ? " active" : ""}" data-mention-login="${escapeHtml(member.login)}">
                <span class="avatar">${initial(memberLabel(member))}</span>
                <span class="mention-item-name">${escapeHtml(memberLabel(member))}</span>
                <span class="mention-item-login">@${escapeHtml(member.login)}</span>
            </button>`).join("");
        picker.querySelectorAll("[data-mention-login]").forEach((node) => {
            node.addEventListener("mousedown", (event) => {
                event.preventDefault();
                applyMention(node.dataset.mentionLogin);
            });
        });
    }

    function updateMentionPicker(input) {
        const token = mentionQuery(input);
        const conv = state.current;
        const canMention = conv && !conv.dissolved && mentionMembers().length > 0;
        if (!token || !canMention) {
            hideMentionPicker();
            return;
        }
        const items = mentionCandidates(token.query);
        state.mention.active = true;
        state.mention.items = items;
        state.mention.index = 0;
        state.mention.token = token;
        renderMentionPicker();
    }

    function moveMentionPicker(step) {
        if (!state.mention.active || !state.mention.items.length) {
            return;
        }
        const total = state.mention.items.length;
        state.mention.index = (state.mention.index + step + total) % total;
        renderMentionPicker();
    }

    function applyMention(login) {
        const input = el("message-input");
        const token = state.mention.token;
        if (!input || !token) {
            hideMentionPicker();
            return;
        }
        const value = input.value;
        const inserted = `@${login} `;
        input.value = `${value.slice(0, token.start)}${inserted}${value.slice(token.end)}`;
        const caret = token.start + inserted.length;
        input.focus();
        input.setSelectionRange(caret, caret);
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 132)}px`;
        hideMentionPicker();
    }

    function toast(message, kind) {
        const node = el("toast");
        node.textContent = message;
        node.className = `toast show${kind === "error" ? " error" : ""}`;
        clearTimeout(node.__timer);
        node.__timer = setTimeout(() => {
            node.className = "toast";
        }, 3200);
    }

    function report(error) {
        const raw = error && error.message ? error.message : String(error || "操作失败");
        const message = /is not a function/.test(raw)
            ? `${raw}（页面资源版本过旧，请按 Ctrl+F5 刷新）`
            : raw;
        toast(message, "error");
        if (error && error.status === 401) {
            setTimeout(showGate, 600);
        }
    }

    function showGate() {
        el("app").hidden = true;
        el("gate").hidden = false;
        try {
            const apiBase = new URLSearchParams(window.location.search).get("api");
            const link = document.querySelector(".gate-card a");
            if (apiBase && link) {
                link.href = `login.html?next=chatroom.html&api=${encodeURIComponent(apiBase)}`;
            }
        } catch (error) {
            /* 忽略 */
        }
    }

    function showApp() {
        el("gate").hidden = true;
        el("app").hidden = false;
        syncViewportHeight();
    }

    function timePart(message) {
        const text = message && message.time ? message.time : "";
        const parts = text.split(" ");
        return parts[1] ? parts[1].slice(0, 5) : "";
    }

    function dayPart(message) {
        const text = message && message.time ? message.time : "";
        return text.split(" ")[0] || "";
    }

    function formatTime(message) {
        const at = Number(message && message.at) || 0;
        if (!at) {
            return "";
        }
        const date = new Date(at);
        const now = new Date();
        if (date.toDateString() === now.toDateString()) {
            return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
        }
        return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function formatSize(bytes) {
        const size = Number(bytes) || 0;
        if (size < 1024) {
            return `${size} B`;
        }
        if (size < 1024 * 1024) {
            return `${(size / 1024).toFixed(1)} KB`;
        }
        return `${(size / 1024 / 1024).toFixed(1)} MB`;
    }

    function isManage(conv) {
        return Boolean(conv) && conv.type === "group"
            && (state.isAdmin || conv.owner === state.me || (conv.admins || []).includes(state.me));
    }

    function isOwner(conv) {
        return Boolean(conv) && (state.isAdmin || conv.owner === state.me);
    }

    async function boot() {
        if (!(await ensureSdk())) {
            return;
        }
        if (!api || !api.hasSession || !api.hasSession()) {
            showGate();
            return;
        }
        try {
            const me = await api.me();
            state.me = api.currentLogin();
            const account = me && me.account ? me.account : (me || {});
            state.username = account.username || state.me;
            state.uid = Number(account.uid) || 0;
            state.myMoney = account.money || "";
        } catch (error) {
            showGate();
            return;
        }
        showApp();
        el("rail-me").textContent = state.uid ? `${state.username} · UID ${state.uid}` : state.username;
        el("rail-me").title = state.uid ? `我的 UID：${state.uid}（点一下复制）` : "";
        el("rail-me").addEventListener("click", () => {
            if (state.uid) {
                copyText(String(state.uid));
            }
        });
        bindUi();
        try {
            await api.chat.adminConversations();
            state.isAdmin = true;
            el("tab-admin").hidden = false;
        } catch (error) {
            state.isAdmin = false;
        }
        await Promise.all([refreshConversations(), refreshContacts()]);
        connectSocket();
        state.pollTimer = setInterval(poll, 7000);
        handleGroupDeepLink().catch(() => {});
    }

    function bindUi() {
        document.querySelectorAll(".rail button[data-tab]").forEach((button) => {
            button.addEventListener("click", () => switchTab(button.dataset.tab));
        });
        el("logout-btn").addEventListener("click", () => {
            api.clearSession();
            location.href = "login.html";
        });
        el("gate-retry").addEventListener("click", () => location.reload());
        el("new-chat-btn").addEventListener("click", openNewChat);
        el("search-input").addEventListener("input", onSearchInput);
        document.addEventListener("click", () => el("menu").classList.remove("open"));
        window.addEventListener("resize", () => el("menu").classList.remove("open"));
    }

    function switchTab(tab) {
        state.tab = tab;
        document.querySelectorAll(".rail button[data-tab]").forEach((button) => {
            button.classList.toggle("active", button.dataset.tab === tab);
        });
        if (tab === "contacts") {
            refreshContacts();
            renderSidebar();
            el("chat-pane").classList.add("hide-mobile");
        } else if (tab === "admin") {
            loadAdmin();
        } else {
            renderSidebar();
            el("chat-pane").classList.remove("hide-mobile");
        }
    }

    async function refreshConversations(silent) {
        try {
            const data = await api.chat.conversations();
            state.conversations = data.conversations || [];
            if (state.current) {
                const fresh = state.conversations.find((item) => item.id === state.current.id);
                if (fresh) {
                    state.current = { ...state.current, ...fresh };
                }
            }
            renderSidebar();
            renderRailBadges();
        } catch (error) {
            if (!silent) {
                report(error);
            }
        }
    }

    async function refreshContacts(silent) {
        try {
            state.contacts = await api.chat.contacts();
            renderRailBadges();
            if (state.tab === "contacts") {
                renderSidebar();
            }
        } catch (error) {
            if (!silent) {
                report(error);
            }
        }
    }

    function renderRailBadges() {
        const unread = state.conversations.reduce((total, item) => total + (Number(item.unread) || 0), 0);
        const mentions = state.conversations.reduce((total, item) => total + (Number(item.mentionUnread) || 0), 0);
        const unreadNode = el("rail-unread");
        unreadNode.hidden = unread <= 0 && mentions <= 0;
        unreadNode.textContent = mentions ? `@${mentions > 9 ? "9+" : mentions}` : (unread > 99 ? "99+" : String(unread));
        unreadNode.classList.toggle("mention", mentions > 0);

        const requests = (state.contacts.incoming || []).length;
        const requestNode = el("rail-requests");
        requestNode.hidden = requests <= 0;
        requestNode.textContent = String(requests);

        /* 1.5.0：有未读 @ 时在标签页标题上提醒 */
        const baseTitle = "聊天室 | Vitual XRing";
        document.title = mentions ? `(${mentions} 条@你) ${baseTitle}` : baseTitle;
    }

    function renderSidebar() {
        if (state.searchQuery.trim()) {
            renderSearchResults();
            return;
        }
        if (state.tab === "contacts") {
            renderContacts();
            return;
        }
        if (state.tab === "admin") {
            renderAdmin();
            return;
        }
        renderConversations();
    }

    function renderConversations() {
        const body = el("sidebar-body");
        if (!state.conversations.length) {
            body.innerHTML = `<div class="section-title">还没有会话</div>
                <div style="padding: 8px 16px; color: var(--muted); font-size: 13px; line-height: 1.8;">
                    点右上角「＋」发起单聊或创建群聊，也可以在通讯录里添加好友。
                </div>`;
            return;
        }

        const items = state.conversations.map((conv) => {
            const dissolved = Boolean(conv.dissolved);
            const preview = dissolved
                ? "群聊已解散，仅可查看历史消息"
                : (conv.lastMessage
                    ? `${conv.type === "group" && conv.lastMessage.sender !== "system" ? `${conv.lastMessage.senderName || conv.lastMessage.sender}：` : ""}${conv.lastMessage.recalled ? "消息已撤回" : messagePreviewText(conv.lastMessage)}`
                    : "还没有消息");
            const active = state.current && state.current.id === conv.id ? " active" : "";
            const avatarClass = conv.public ? "public" : (conv.type === "group" ? "group" : "");
            const mentionUnread = Number(conv.mentionUnread) || 0;
            const unread = Number(conv.unread) || 0;
            const badge = mentionUnread
                ? `<span class="badge-mention" title="${mentionUnread} 条 @ 你">@${mentionUnread > 1 ? mentionUnread : ""}</span>`
                : (unread ? `<span class="badge-red">${unread > 99 ? "99+" : unread}</span>` : "");
            return `<div class="list-item${active}${dissolved ? " dissolved" : ""}" data-conv="${escapeHtml(conv.id)}">
                <div class="avatar ${avatarClass}">${conv.type === "group" ? "群" : initial(conv.name)}</div>
                <div class="list-main">
                    <div class="list-top">
                        <span class="list-name">${escapeHtml(conv.name)}</span>
                        ${mentionUnread ? '<span class="tag mention-tag">有人@你</span>' : ""}
                        ${dissolved ? '<span class="tag">已解散</span>' : ""}
                        ${conv.pinned ? '<span class="tag">置顶</span>' : ""}
                        ${conv.muted ? '<span class="tag muted">免打扰</span>' : ""}
                        <span class="list-time">${conv.lastMessage ? escapeHtml(formatTime(conv.lastMessage)) : ""}</span>
                    </div>
                    <div class="list-preview">
                        <span>${escapeHtml(preview)}</span>
                        ${badge}
                    </div>
                </div>
            </div>`;
        }).join("");

        body.innerHTML = `<div class="section-title">会话（${state.conversations.length}）</div>${items}`;

        body.querySelectorAll("[data-conv]").forEach((node) => {
            node.addEventListener("click", () => openConversation(node.dataset.conv));
            node.addEventListener("contextmenu", (event) => {
                event.preventDefault();
                const conv = state.conversations.find((item) => item.id === node.dataset.conv);
                if (conv) {
                    showConversationMenu(conv, event.clientX, event.clientY);
                }
            });
        });
    }

    function messagePreviewText(message) {
        if (!message) {
            return "";
        }
        if (message.type === "image") {
            return "[图片]";
        }
        if (message.type === "file") {
            return `[文件] ${message.media && message.media.name ? message.media.name : ""}`;
        }
        if (message.type === "redpacket" && message.packet) {
            return `[拼手速红包] ${formatAmount(message.packet.totalCents)} 元`;
        }
        return String(message.text || "");
    }

    function formatAmount(cents) {
        return (Number(cents || 0) / 100).toFixed(2);
    }

    function renderContacts() {
        const body = el("sidebar-body");
        const blocks = [];

        blocks.push(`<div style="display:flex; gap:8px; padding: 4px 14px 10px;">
            <button class="btn small" id="add-friend-btn">添加好友</button>
            <button class="btn small" id="friend-requests-btn">新的朋友${state.contacts.incoming.length ? `（${state.contacts.incoming.length}）` : ""}</button>
        </div>`);

        blocks.push(`<div class="section-title">好友（${state.contacts.friends.length}）</div>`);
        if (!state.contacts.friends.length) {
            blocks.push('<div style="padding: 4px 16px 10px; color: var(--muted); font-size: 13px;">还没有好友，点「添加好友」搜索并发送申请。</div>');
        }
        for (const friend of state.contacts.friends) {
            blocks.push(`<div class="list-item" data-friend="${escapeHtml(friend.login)}">
                <div class="avatar">${initial(friend.username || friend.login)}</div>
                <div class="list-main">
                    <div class="list-top"><span class="list-name">${escapeHtml(friend.username || friend.login)}</span></div>
                    <div class="list-preview"><span>${escapeHtml(friend.login)}</span></div>
                </div>
            </div>`);
        }

        blocks.push(`<div class="section-title">公共频道</div>`);
        for (const id of ["general", "trade", "help"]) {
            const labels = { general: "大厅", trade: "交易", help: "求助" };
            blocks.push(`<div class="list-item" data-public="${id}">
                <div class="avatar public">公</div>
                <div class="list-main">
                    <div class="list-top"><span class="list-name">${labels[id]}</span></div>
                    <div class="list-preview"><span>点击加入或打开公共频道</span></div>
                </div>
            </div>`);
        }

        if (state.contacts.blocked.length) {
            blocks.push(`<div class="section-title">黑名单（${state.contacts.blocked.length}）</div>`);
            for (const user of state.contacts.blocked) {
                blocks.push(`<div class="list-item" data-blocked="${escapeHtml(user.login)}">
                    <div class="avatar" style="background:linear-gradient(135deg,#8d98aa,#b6c0cf)">${initial(user.username || user.login)}</div>
                    <div class="list-main">
                        <div class="list-top"><span class="list-name">${escapeHtml(user.username || user.login)}</span></div>
                        <div class="list-preview"><span>${escapeHtml(user.login)}</span></div>
                    </div>
                </div>`);
            }
        }

        if (state.contacts.outgoing.length) {
            blocks.push(`<div class="section-title">已发送的好友申请</div>`);
            for (const item of state.contacts.outgoing) {
                blocks.push(`<div style="padding: 6px 16px; font-size: 12.5px; color: var(--muted);">→ ${escapeHtml(item.username || item.to)}：等待对方同意</div>`);
            }
        }

        body.innerHTML = blocks.join("");
        el("add-friend-btn").addEventListener("click", openAddFriend);
        el("friend-requests-btn").addEventListener("click", openRequests);

        body.querySelectorAll("[data-friend]").forEach((node) => {
            node.addEventListener("click", () => openFriendActions(node.dataset.friend));
        });
        body.querySelectorAll("[data-public]").forEach((node) => {
            node.addEventListener("click", () => joinPublic(node.dataset.public));
        });
        body.querySelectorAll("[data-blocked]").forEach((node) => {
            node.addEventListener("click", () => openBlockedActions(node.dataset.blocked));
        });
    }

    async function joinPublic(id) {
        try {
            await api.chat.join(id);
            await refreshConversations();
            switchTab("chats");
            await openConversation(id);
        } catch (error) {
            report(error);
        }
    }

    function openFriendActions(login) {
        const friend = state.contacts.friends.find((item) => item.login === login);
        openModal(`好友：${escapeHtml(friend ? friend.username || login : login)}`, `
            <div class="notice">账号：${escapeHtml(login)}</div>
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
                <button class="btn primary" data-act="chat">发消息</button>
                <button class="btn" data-act="unfriend">删除好友</button>
                <button class="btn danger" data-act="block">拉黑</button>
            </div>`, {
            onMount(root) {
                root.querySelector('[data-act="chat"]').addEventListener("click", async () => {
                    closeModal();
                    try {
                        const conv = await api.chat.direct(login);
                        await refreshConversations();
                        await openConversation(conv.conversation.id);
                    } catch (error) {
                        report(error);
                    }
                });
                root.querySelector('[data-act="unfriend"]').addEventListener("click", async () => {
                    if (!confirm(`确定删除好友 ${login} 吗？`)) {
                        return;
                    }
                    try {
                        await api.chat.removeFriend(login);
                        closeModal();
                        await Promise.all([refreshContacts(), refreshConversations()]);
                        toast("已删除好友");
                    } catch (error) {
                        report(error);
                    }
                });
                root.querySelector('[data-act="block"]').addEventListener("click", async () => {
                    if (!confirm(`拉黑 ${login} 后对方无法给你发消息，确定吗？`)) {
                        return;
                    }
                    try {
                        await api.chat.block(login);
                        closeModal();
                        await Promise.all([refreshContacts(), refreshConversations()]);
                        toast("已加入黑名单");
                    } catch (error) {
                        report(error);
                    }
                });
            }
        });
    }

    function openBlockedActions(login) {
        openModal(`黑名单：${escapeHtml(login)}`, `
            <div class="notice">解除拉黑后，对方可以重新添加你为好友。</div>
            <button class="btn primary" data-act="unblock">解除拉黑</button>`, {
            onMount(root) {
                root.querySelector('[data-act="unblock"]').addEventListener("click", async () => {
                    try {
                        await api.chat.unblock(login);
                        closeModal();
                        await refreshContacts();
                        toast("已解除拉黑");
                    } catch (error) {
                        report(error);
                    }
                });
            }
        });
    }

    function renderSearchResults() {
        const body = el("sidebar-body");
        const query = state.searchQuery.trim();
        const rows = state.searchResults.map((result) => `
            <div class="search-result" data-result="${escapeHtml(result.conversation)}" data-mid="${escapeHtml(result.message.id)}">
                <div class="sr-top">
                    <span class="sr-name">${escapeHtml(result.conversationName)}</span>
                    <span>${escapeHtml(result.message.senderName || result.message.sender)}</span>
                    <span>${escapeHtml(formatTime(result.message))}</span>
                </div>
                <div class="sr-text">${highlight(escapeHtml(messagePreviewText(result.message)), query)}</div>
            </div>`).join("");

        body.innerHTML = `<div class="section-title">聊天记录搜索：${escapeHtml(query)}</div>
            ${state.searchResults.length ? rows : '<div style="padding: 10px 16px; color: var(--muted); font-size: 13px;">没有找到匹配的消息</div>'}`;

        body.querySelectorAll("[data-result]").forEach((node) => {
            node.addEventListener("click", async () => {
                state.searchQuery = "";
                el("search-input").value = "";
                await openConversation(node.dataset.result, node.dataset.mid);
            });
        });
    }

    function highlight(text, query) {
        if (!query) {
            return text;
        }
        const safe = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        try {
            return text.replace(new RegExp(safe, "gi"), (match) => `<mark>${match}</mark>`);
        } catch (error) {
            return text;
        }
    }

    let searchTimer = null;
    function onSearchInput(event) {
        state.searchQuery = event.target.value;
        clearTimeout(searchTimer);
        if (!state.searchQuery.trim()) {
            state.searchResults = [];
            renderSidebar();
            return;
        }
        if (state.tab !== "chats") {
            switchTab("chats");
        }
        searchTimer = setTimeout(async () => {
            try {
                const data = await api.chat.search(state.searchQuery.trim());
                state.searchResults = data.results || [];
                renderSidebar();
            } catch (error) {
                report(error);
            }
        }, 320);
    }

    async function openConversation(id, highlightId) {
        try {
            if (state.tab !== "chats") {
                state.tab = "chats";
                document.querySelectorAll(".rail button[data-tab]").forEach((button) => {
                    button.classList.toggle("active", button.dataset.tab === "chats");
                });
            }
            const detail = await api.chat.conversation(id);
            state.current = detail.conversation;
            state.members = detail.members || [];
            state.replyTo = null;
            state.typing = {};
            await loadMessages(id);
            renderChatPane();
            await api.chat.read(id).catch(() => {});
            const conv = state.conversations.find((item) => item.id === id);
            if (conv) {
                conv.unread = 0;
            }
            renderSidebar();
            renderRailBadges();
            if (highlightId) {
                const node = document.querySelector(`[data-message-id="${CSS.escape(highlightId)}"]`);
                if (node) {
                    node.scrollIntoView({ block: "center" });
                    node.classList.add("flash");
                    setTimeout(() => node.classList.remove("flash"), 1600);
                }
            }
            if (window.innerWidth <= 720) {
                el("sidebar").classList.add("hide-mobile");
                el("chat-pane").classList.remove("hide-mobile");
            }
        } catch (error) {
            report(error);
        }
    }

    async function loadMessages(id, options = {}) {
        const data = await api.chat.messages(id, options.before ? { before: options.before } : {});
        state.messages = data.messages || [];
        state.hasMore = Boolean(data.hasMore);
        state.oldest = Number(data.oldest) || 0;
        if (data.conversation) {
            state.current = { ...state.current, ...data.conversation };
        }
        if (!options.silent) {
            renderChatPane();
        }
    }

    function renderChatPane() {
        const pane = el("chat-pane");
        const conv = state.current;
        if (!conv) {
            pane.innerHTML = `<div class="empty-state"><div><h2>聊天室已开放</h2><p>选择一个会话开始聊天。</p></div></div>`;
            return;
        }

        const onlinePeer = conv.type === "direct" && state.online.has(conv.peer);
        const dissolved = Boolean(conv.dissolved);
        const subtitle = conv.type === "direct"
            ? `${onlinePeer ? "在线 · " : ""}${escapeHtml(conv.peer)}`
            : `${conv.public ? "公共频道" : (dissolved ? "群聊（已解散）" : "群聊")} · ${conv.memberCount} 人`;

        const pinned = conv.announcement && conv.announcement.pinned;
        const announce = conv.announcement
            ? `<div class="announce-bar${pinned ? " pinned" : ""}">
                    <strong>${pinned ? "📌 群公告" : "群公告"}</strong>
                    <span class="announce-text">${escapeHtml(conv.announcement.text)}</span>
               </div>`
            : "";

        const dissolvedBar = dissolved
            ? `<div class="dissolved-bar">该群聊已由 ${escapeHtml(conv.dissolvedByName || conv.dissolvedBy || "群主")} 解散${conv.dissolvedAt ? `（${escapeHtml(conv.dissolvedAt)}）` : ""}，只能查看历史消息。</div>`
            : "";

        pane.innerHTML = `
            <div class="chat-view">
                <div class="chat-head">
                    <div class="grow">
                        <h2>${escapeHtml(conv.name)}${conv.muted ? '<span class="tag muted">免打扰</span>' : ""}${dissolved ? '<span class="tag">已解散</span>' : ""}</h2>
                        <p>${subtitle}</p>
                    </div>
                    <button class="icon-btn" id="chat-menu-btn" title="会话设置">⋯</button>
                    <button class="icon-btn" id="chat-info-btn" title="查看资料">☰</button>
                </div>
                ${dissolvedBar}
                ${announce}
                <div class="messages" id="messages"></div>
                <div class="typing-line" id="typing-line"></div>
                <div class="composer${dissolved ? " readonly" : ""}">
                    <div class="mention-picker" id="mention-picker" hidden></div>
                    <div class="reply-bar" id="reply-bar" hidden>
                        <span class="reply-text" id="reply-text"></span>
                        <button type="button" id="reply-cancel">×</button>
                    </div>
                    <div class="composer-row">
                        <button type="button" class="attach-btn" id="attach-btn" title="发送图片或文件（20 分钟后过期）"${dissolved ? " disabled" : ""}>图片/文件</button>
                        ${conv.type === "group" ? `<button type="button" class="attach-btn" id="redpacket-btn" title="发拼手速红包"${dissolved ? " disabled" : ""}>红包</button>` : ""}
                        <textarea id="message-input" placeholder="${dissolved ? "群聊已解散，只能查看历史消息" : "输入消息，Enter 发送，Shift+Enter 换行，@ 提及成员"}"${dissolved ? " disabled" : ""}></textarea>
                        <button type="button" class="send-btn" id="send-btn"${dissolved ? " disabled" : ""}>发送</button>
                    </div>
                    <input type="file" id="file-input" hidden>
                </div>
            </div>`;

        renderMessages();
        renderTyping();
        bindChatUi();
    }

    function renderMessages() {
        const container = el("messages");
        if (!container) {
            return;
        }
        const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 90;
        const conv = state.current;
        const rows = [];
        let lastDay = "";

        if (state.hasMore) {
            rows.push('<button type="button" class="load-more" id="load-more-btn">加载更早的消息</button>');
        }

        let lastAt = 0;
        for (const message of state.messages) {
            const at = Number(message.at) || 0;
            const day = dayPart(message);
            if (day && day !== lastDay) {
                rows.push(`<div class="time-divider">${escapeHtml(day)}</div>`);
                lastDay = day;
            } else if (lastAt && at - lastAt > 5 * 60 * 1000) {
                rows.push(`<div class="time-divider">${escapeHtml(timePart(message))}</div>`);
            }
            lastAt = at;

            if (message.system) {
                rows.push(`<div class="system-row">${escapeHtml(message.text)}</div>`);
                continue;
            }

            if (message.recalled) {
                rows.push(`<div class="system-row" data-message-id="${escapeHtml(message.id)}">${escapeHtml(message.senderName || message.sender)} 撤回了一条消息</div>`);
                continue;
            }

            const mine = message.sender === state.me;
            const mentioned = !mine
                && Array.isArray(message.mentions)
                && message.mentions.includes(state.me);
            const showName = conv.type === "group" && !mine;
            const profile = state.members.find((item) => item.login === message.sender);
            const displayName = profile && profile.alias ? profile.alias : (message.senderName || message.sender);

            let bubble = "";
            if (message.replyTo) {
                bubble += `<div class="quote">${escapeHtml(message.replyTo.senderName || message.replyTo.sender)}：${escapeHtml(message.replyTo.preview || "")}</div>`;
            }
            if (message.forwarded) {
                bubble += `<div class="forwarded">转发自 ${escapeHtml(message.forwardedFrom || "聊天记录")}</div>`;
            }
            bubble += mediaOrText(message);

            rows.push(`<div class="msg-row${mine ? " mine" : ""}${mentioned ? " mentioned" : ""}" data-message-id="${escapeHtml(message.id)}">
                <div class="avatar">${initial(displayName)}</div>
                <div class="msg-body">
                    <div class="msg-meta">${showName ? `<span class="name">${escapeHtml(displayName)}</span>` : ""}${mentioned ? '<span class="mention-flag">@ 你</span>' : ""}<span>${escapeHtml(timePart(message))}</span></div>
                    <div class="bubble">${bubble}</div>
                </div>
                <button type="button" class="msg-actions" data-msg-menu="${escapeHtml(message.id)}" title="更多操作">⋯</button>
            </div>`);
        }

        if (!state.messages.length) {
            rows.push('<div class="system-row">还没有消息，打个招呼吧</div>');
        }

        container.innerHTML = rows.join("");
        if (!state.messages.length || nearBottom) {
            container.scrollTop = container.scrollHeight;
        }

        container.querySelectorAll("[data-msg-menu]").forEach((node) => {
            node.addEventListener("click", (event) => {
                event.stopPropagation();
                const message = state.messages.find((item) => item.id === node.dataset.msgMenu);
                if (message) {
                    showMessageMenu(message, event.clientX, event.clientY);
                }
            });
        });
        container.querySelectorAll(".msg-row").forEach((node) => {
            node.addEventListener("contextmenu", (event) => {
                const message = state.messages.find((item) => item.id === node.dataset.messageId);
                if (!message) {
                    return;
                }
                event.preventDefault();
                showMessageMenu(message, event.clientX, event.clientY);
            });
        });
        container.querySelectorAll("img.media-image").forEach((img) => {
            img.addEventListener("error", () => {
                const holder = img.parentElement;
                if (holder) {
                    holder.innerHTML = '<span class="media-expired">图片已过期（上传后 20 分钟自动删除）</span>';
                }
            });
        });
        const more = el("load-more-btn");
        if (more) {
            more.addEventListener("click", async () => {
                try {
                    const data = await api.chat.messages(state.current.id, { before: state.oldest });
                    const older = data.messages || [];
                    state.messages = [...older, ...state.messages];
                    state.hasMore = Boolean(data.hasMore);
                    state.oldest = Number(data.oldest) || state.oldest;
                    renderMessages();
                    const messageNode = el("messages");
                    if (messageNode) {
                        messageNode.scrollTop = 40;
                    }
                } catch (error) {
                    report(error);
                }
            });
        }
    }

    function mediaOrText(message) {
        const expired = message.media && message.media.expiresAt && Number(message.media.expiresAt) < Date.now();
        const caption = message.text ? renderMentions(message.text, message.mentions) : "";
        if (message.type === "redpacket" && message.packet) {
            return redPacketCard(message);
        }
        if (message.type === "image" && message.media) {
            if (expired) {
                return `<span class="media-expired">图片已过期（上传后 20 分钟自动删除）</span>${message.text ? `<div class="media-caption">${caption}</div>` : ""}`;
            }
            return `<img class="media-image" src="${api.chatMediaUrl(message.media.id, message.media.expiresAt)}" alt="${escapeHtml(message.media.name)}">
                ${message.text ? `<div class="media-caption">${caption}</div>` : ""}`;
        }
        if (message.type === "file" && message.media) {
            if (expired) {
                return `<span class="media-expired">文件已过期（上传后 20 分钟自动删除）</span>${message.text ? `<div class="media-caption">${caption}</div>` : ""}`;
            }
            return `<a class="media-file" href="${api.chatMediaUrl(message.media.id, message.media.expiresAt)}" target="_blank" rel="noopener">📎 ${escapeHtml(message.media.name)}（${formatSize(message.media.size)}）</a>
                ${message.text ? `<div class="media-caption">${caption}</div>` : ""}`;
        }
        return renderMentions(message.text || "", message.mentions);
    }

    function redPacketCard(message) {
        const packet = message.packet || {};
        const mine = (packet.grabs || []).find((item) => item.login === state.me);
        const isSender = message.sender === state.me;
        const closed = Boolean(packet.closed) || Number(packet.remainCents) <= 0;
        const grabs = (packet.grabs || []).length;
        let sub = `${formatAmount(packet.totalCents)} 元`;
        if (mine) {
            sub = `已抢到 ${formatAmount(mine.cents)} 元`;
        } else if (isSender) {
            sub = `${formatAmount(packet.totalCents)} 元 · 已抢 ${grabs} 个`;
        } else if (closed) {
            sub = `${formatAmount(packet.totalCents)} 元 · 已被抢完`;
        } else {
            sub = `${formatAmount(packet.totalCents)} 元 · 点击抢红包`;
        }
        const limit = Number(packet.count) > 0 ? `${packet.count} 人可抢` : "所有人可抢";
        return `<button type="button" class="rp-card${closed && !mine ? " done" : ""}" data-grab="${escapeHtml(message.id)}">
            <div class="rp-head"><span class="rp-icon">🧧</span><span class="rp-note">${escapeHtml(packet.note || "拼手速红包")}</span></div>
            <div class="rp-sub">${escapeHtml(sub)}</div>
            <div class="rp-sub">${escapeHtml(limit)} · 已抢 ${grabs}${Number(packet.count) > 0 ? `/${packet.count}` : ""}</div>
        </button>`;
    }

    function bindChatUi() {
        const input = el("message-input");
        const send = el("send-btn");
        const attach = el("attach-btn");
        const file = el("file-input");
        const menuBtn = el("chat-menu-btn");
        const infoBtn = el("chat-info-btn");
        const replyCancel = el("reply-cancel");

        if (!input) {
            return;
        }
        hideMentionPicker();

        const syncReply = () => {
            const bar = el("reply-bar");
            if (!bar) {
                return;
            }
            if (state.replyTo) {
                bar.hidden = false;
                el("reply-text").textContent = `${state.replyTo.senderName || state.replyTo.sender}：${messagePreviewText(state.replyTo)}`;
            } else {
                bar.hidden = true;
            }
        };
        syncReply();

        if (replyCancel) {
            replyCancel.addEventListener("click", () => {
                state.replyTo = null;
                syncReply();
            });
        }

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = `${Math.min(input.scrollHeight, 132)}px`;
            updateMentionPicker(input);
            const now = Date.now();
            if (now - state.lastTypingSent > 2200 && state.current) {
                state.lastTypingSent = now;
                api.chat.typing(state.current.id).catch(() => {});
            }
        });
        input.addEventListener("keydown", (event) => {
            if (state.mention.active) {
                if (event.key === "ArrowDown") {
                    event.preventDefault();
                    moveMentionPicker(1);
                    return;
                }
                if (event.key === "ArrowUp") {
                    event.preventDefault();
                    moveMentionPicker(-1);
                    return;
                }
                if (event.key === "Escape") {
                    event.preventDefault();
                    hideMentionPicker();
                    return;
                }
                if ((event.key === "Enter" && !event.shiftKey) || event.key === "Tab") {
                    const chosen = state.mention.items[state.mention.index];
                    if (chosen) {
                        event.preventDefault();
                        applyMention(chosen.login);
                        return;
                    }
                }
            }
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendCurrent();
            }
        });
        input.addEventListener("blur", () => hideMentionPicker());
        input.addEventListener("click", () => updateMentionPicker(input));
        send.addEventListener("click", sendCurrent);
        attach.addEventListener("click", () => file.click());
        file.addEventListener("change", async () => {
            const chosen = file.files && file.files[0];
            file.value = "";
            if (!chosen) {
                return;
            }
            if (chosen.size > 4 * 1024 * 1024) {
                toast("文件不能超过 4 MB", "error");
                return;
            }
            toast(`正在上传 ${chosen.name}…`);
            try {
                const media = await api.chat.upload(chosen);
                const isImage = (media.type || "").startsWith("image/") || /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(media.name);
                const caption = input.value.trim();
                const payload = {
                    type: isImage ? "image" : "file",
                    mediaId: media.id,
                    text: caption
                };
                const mentions = collectMentions(caption);
                if (mentions.length) {
                    payload.mentions = mentions;
                }
                await api.chat.send(state.current.id, payload);
                input.value = "";
                hideMentionPicker();
                await loadMessages(state.current.id);
                await refreshConversations(true);
                toast("已发送，图片/文件将在 20 分钟后自动删除");
            } catch (error) {
                report(error);
            }
        });

        if (menuBtn) {
            menuBtn.addEventListener("click", (event) => {
                showConversationMenu(state.current, event.clientX, event.clientY + 8);
            });
        }
        if (infoBtn) {
            infoBtn.addEventListener("click", () => {
                if (state.current && state.current.type === "group") {
                    openGroupInfo();
                } else {
                    openDirectInfo();
                }
            });
        }
        const redPacketBtn = el("redpacket-btn");
        if (redPacketBtn) {
            redPacketBtn.addEventListener("click", openRedPacketDialog);
        }
        const messageBox = el("messages");
        if (messageBox) {
            messageBox.addEventListener("click", (event) => {
                const button = event.target.closest("[data-grab]");
                if (button) {
                    event.stopPropagation();
                    grabRedPacket(button.dataset.grab);
                }
            });
        }
        input.focus();
    }

    async function sendCurrent() {
        const input = el("message-input");
        if (!input || !state.current) {
            return;
        }
        const text = input.value.trim();
        if (!text) {
            return;
        }
        const payload = { text };
        if (state.replyTo) {
            payload.replyTo = state.replyTo.id;
        }
        const mentions = collectMentions(text);
        if (mentions.length) {
            payload.mentions = mentions;
        }
        try {
            const result = await api.chat.send(state.current.id, payload);
            input.value = "";
            input.style.height = "auto";
            hideMentionPicker();
            state.replyTo = null;
            if (result.message && !state.messages.some((item) => item.id === result.message.id)) {
                state.messages.push(result.message);
            }
            renderChatPane();
            await refreshConversations(true);
        } catch (error) {
            report(error);
        }
    }

    function renderTyping() {
        const node = el("typing-line");
        if (!node) {
            return;
        }
        const names = Object.values(state.typing);
        node.textContent = names.length ? `${names.join("、")} 正在输入…` : "";
    }

    function showMessageMenu(message, x, y) {
        const menu = el("menu");
        const canRecall = (message.sender === state.me) || state.isAdmin || (state.current && state.current.type === "group" && isManage(state.current));
        const canDelete = state.isAdmin || (state.current && state.current.type === "group" && isManage(state.current)) || (message.sender === state.me && state.current && state.current.type === "direct");
        const actions = [];

        actions.push('<button data-act="reply">回复</button>');
        if (message.text) {
            actions.push('<button data-act="copy">复制</button>');
        }
        actions.push('<button data-act="forward">转发</button>');
        if (canRecall) {
            actions.push('<button data-act="recall">撤回</button>');
        }
        if (canDelete) {
            actions.push('<hr><button class="danger" data-act="delete">删除消息</button>');
        }

        menu.innerHTML = actions.join("");
        menu.style.left = `${Math.min(x, window.innerWidth - 170)}px`;
        menu.style.top = `${Math.min(y, window.innerHeight - 240)}px`;
        menu.classList.add("open");

        menu.querySelectorAll("button").forEach((button) => {
            button.onclick = async (event) => {
                event.stopPropagation();
                menu.classList.remove("open");
                const action = button.dataset.act;
                if (action === "reply") {
                    state.replyTo = message;
                    renderChatPane();
                    el("message-input").focus();
                } else if (action === "copy") {
                    try {
                        await navigator.clipboard.writeText(message.text || "");
                        toast("已复制");
                    } catch (error) {
                        toast("复制失败，请手动选择文本", "error");
                    }
                } else if (action === "forward") {
                    openForward(message);
                } else if (action === "recall") {
                    if (!confirm("确定撤回这条消息吗？")) {
                        return;
                    }
                    try {
                        await api.chat.recall(state.current.id, message.id);
                        await loadMessages(state.current.id);
                        await refreshConversations(true);
                    } catch (error) {
                        report(error);
                    }
                } else if (action === "delete") {
                    if (!confirm("删除后所有人都看不到这条消息，确定吗？")) {
                        return;
                    }
                    try {
                        await api.chat.removeMessage(state.current.id, message.id);
                        await loadMessages(state.current.id);
                        await refreshConversations(true);
                    } catch (error) {
                        report(error);
                    }
                }
            };
        });
    }

    function showConversationMenu(conv, x, y) {
        if (!conv) {
            return;
        }
        const menu = el("menu");
        const dissolved = Boolean(conv.dissolved);
        menu.innerHTML = `
            <button data-act="pin">${conv.pinned ? "取消置顶" : "置顶会话"}</button>
            <button data-act="mute">${conv.muted ? "取消免打扰" : "消息免打扰"}</button>
            <button data-act="clear">清空聊天记录</button>
            ${conv.type === "group" && !conv.public && !dissolved ? '<hr><button data-act="leave" class="danger">退出群聊</button>' : ""}
            ${conv.type === "direct" ? '<hr><button data-act="delete" class="danger">删除会话</button>' : ""}
            ${conv.public ? '<hr><button data-act="leave" class="danger">退出公共频道</button>' : ""}
            ${conv.public && state.isAdmin ? '<button data-act="dissolve-public" class="danger">解散公共频道</button>' : ""}
            ${dissolved ? '<hr><button data-act="delete-group" class="danger">删除会话</button>' : ""}
            ${conv.type === "group" && !conv.public && !dissolved && isOwner(conv) ? '<button data-act="dissolve" class="danger">解散群聊</button>' : ""}
            ${conv.type === "group" ? `<button data-act="info">${conv.public ? "频道设置" : "群资料"}</button>` : ""}`;
        menu.style.left = `${Math.min(x, window.innerWidth - 180)}px`;
        menu.style.top = `${Math.min(y, window.innerHeight - 300)}px`;
        menu.classList.add("open");

        menu.querySelectorAll("button").forEach((button) => {
            button.onclick = async (event) => {
                event.stopPropagation();
                menu.classList.remove("open");
                const action = button.dataset.act;
                try {
                    if (action === "pin") {
                        await api.chat.settings(conv.id, { pinned: !conv.pinned });
                    } else if (action === "mute") {
                        await api.chat.settings(conv.id, { muted: !conv.muted });
                    } else if (action === "clear") {
                        if (!confirm("清空后只影响你自己的聊天记录，确定吗？")) {
                            return;
                        }
                        await api.chat.clear(conv.id);
                        if (state.current && state.current.id === conv.id) {
                            await loadMessages(conv.id);
                        }
                    } else if (action === "leave") {
                        if (!confirm(conv.public ? "确定退出这个公共频道吗？" : "确定退出群聊吗？")) {
                            return;
                        }
                        await api.chat.leave(conv.id);
                        if (state.current && state.current.id === conv.id) {
                            state.current = null;
                            renderChatPane();
                        }
                    } else if (action === "delete") {
                        if (!confirm("删除会话后，对方再发消息会重新出现，确定吗？")) {
                            return;
                        }
                        await api.chat.remove(conv.id);
                        if (state.current && state.current.id === conv.id) {
                            state.current = null;
                            renderChatPane();
                        }
                    } else if (action === "dissolve") {
                        if (!confirm("解散后群聊会变成只读，成员仍可查看历史消息，确定吗？")) {
                            return;
                        }
                        await api.chat.remove(conv.id);
                        if (state.current && state.current.id === conv.id) {
                            state.current = { ...state.current, dissolved: true };
                            renderChatPane();
                        }
                        await refreshConversations(true);
                        toast("群聊已解散");
                        return;
                    } else if (action === "dissolve-public") {
                        if (!confirm("解散后所有账户都会失去这个公共频道，聊天记录一并删除，确定吗？")) {
                            return;
                        }
                        await api.chat.removePublicGroup(conv.id);
                        if (state.current && state.current.id === conv.id) {
                            state.current = null;
                            renderChatPane();
                        }
                        await refreshConversations(true);
                        if (state.tab === "admin") {
                            await loadAdmin();
                        }
                        toast("公共频道已解散");
                        return;
                    } else if (action === "delete-group") {
                        if (!confirm("确定从会话列表删除这个已解散的群聊吗？")) {
                            return;
                        }
                        await api.chat.leave(conv.id);
                        if (state.current && state.current.id === conv.id) {
                            state.current = null;
                            renderChatPane();
                        }
                        await refreshConversations(true);
                        toast("已删除会话");
                        return;
                    } else if (action === "info") {
                        openGroupInfo();
                        return;
                    }
                    await refreshConversations(true);
                    toast("已更新");
                } catch (error) {
                    report(error);
                }
            };
        });
    }

    function openForward(message) {
        const options = state.conversations.map((conv) => `
            <label class="check-row">
                <input type="checkbox" value="${escapeHtml(conv.id)}">
                <span class="avatar ${conv.type === "group" ? "group" : ""}">${conv.type === "group" ? "群" : initial(conv.name)}</span>
                <span class="grow">${escapeHtml(conv.name)}</span>
                <span class="tag">${conv.type === "direct" ? "单聊" : "群聊"}</span>
            </label>`).join("");

        openModal("转发消息", `
            <div class="notice">${escapeHtml(messagePreviewText(message))}</div>
            <div>${options || "没有可转发的会话"}</div>`, {
            actions: [
                { label: "取消", act: "cancel" },
                { label: "转发", act: "ok", primary: true }
            ],
            onMount(root, footer) {
                footer.querySelector('[data-act="ok"]').addEventListener("click", async () => {
                    const targets = Array.from(root.querySelectorAll('input[type="checkbox"]:checked')).map((item) => item.value);
                    if (!targets.length) {
                        toast("至少选择一个会话", "error");
                        return;
                    }
                    try {
                        await api.chat.forward(state.current.id, message.id, targets);
                        closeModal();
                        await refreshConversations(true);
                        toast(`已转发到 ${targets.length} 个会话`);
                    } catch (error) {
                        report(error);
                    }
                });
            }
        });
    }

    async function openGroupInfo() {
        const conv = state.current;
        if (!conv) {
            return;
        }
        let detail;
        try {
            detail = await api.chat.conversation(conv.id);
        } catch (error) {
            report(error);
            return;
        }
        state.current = detail.conversation;
        state.members = detail.members || [];

        const dissolved = Boolean(state.current.dissolved);
        const manage = !dissolved && isManage(state.current);
        const owner = !dissolved && isOwner(state.current);
        const memberHtml = state.members.map((member) => {
            const actions = [];
            if (!member.me && owner && !member.owner) {
                actions.push(`<button class="btn small" data-member-act="admin" data-login="${escapeHtml(member.login)}">${member.admin ? "取消管理员" : "设为管理员"}</button>`);
                actions.push(`<button class="btn small" data-member-act="owner" data-login="${escapeHtml(member.login)}">转让群主</button>`);
            }
            if (!member.me && manage && !member.owner) {
                actions.push(`<button class="btn small danger" data-member-act="kick" data-login="${escapeHtml(member.login)}">移出</button>`);
            }
            return `<div class="member-row">
                <div class="avatar">${initial(member.alias || member.username || member.login)}</div>
                <div class="member-main">
                    <div class="member-name">${escapeHtml(member.alias || member.username || member.login)}
                        ${member.owner ? '<span class="pill owner">群主</span>' : member.admin ? '<span class="pill admin">管理员</span>' : ""}
                        ${member.me ? '<span class="pill">我</span>' : ""}
                    </div>
                    <div class="member-sub">${escapeHtml(member.login)}${member.alias ? ` · 昵称 ${escapeHtml(member.username || "")}` : ""}</div>
                </div>
                <div class="member-actions">${actions.join("")}</div>
            </div>`;
        }).join("");

        openModal(`${state.current.public ? "公共频道" : "群资料"}：${escapeHtml(state.current.name)}`, `
            <div class="notice">${state.current.public
                ? `公共频道，所有登录用户都可以发言${state.current.description ? ` · ${escapeHtml(state.current.description)}` : ""}${state.isAdmin ? " · 你是站主，可以修改频道资料或解散频道" : ""}`
                : (dissolved
                    ? `这个群聊已由 ${escapeHtml(state.current.dissolvedByName || state.current.dissolvedBy || "群主")} 解散${state.current.dissolvedAt ? `（${escapeHtml(state.current.dissolvedAt)}）` : ""}，只能查看历史消息。`
                    : `群主：${escapeHtml(state.current.owner)} · 群成员 ${state.members.length} 人`)}</div>

    function copyText(text) {
        const value = String(text || "");
        const fallback = () => {
            const area = document.createElement("textarea");
            area.value = value;
            document.body.appendChild(area);
            area.select();
            try {
                document.execCommand("copy");
                toast("已复制");
            } catch (error) {
                toast("复制失败，请手动选择复制", "error");
            }
            document.body.removeChild(area);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(value).then(() => toast("已复制"), fallback);
            return;
        }
        fallback();
    }

    function openRedPacketDialog() {
        const conv = state.current;
        if (!conv) {
            return;
        }
        if (conv.type !== "group") {
            toast("只能在群聊里发红包", "error");
            return;
        }
        const candidates = state.members
            .filter((item) => !item.me)
            .map((item) => `
                <label class="check-row">
                    <input type="checkbox" value="${escapeHtml(item.login)}" class="rp-allow">
                    <span class="avatar">${initial(item.alias || item.username || item.login)}</span>
                    <span class="grow">${escapeHtml(item.alias || item.username || item.login)}</span>
                    <span class="tag">${escapeHtml(item.login)}</span>
                </label>`).join("");

        openModal("发拼手速红包", `
            <div class="field"><label>金额（元，最少 0.01）</label>
                <input type="text" id="rp-total" inputmode="decimal" placeholder="1.00">
            </div>
            <div class="field"><label>最多几人可以抢（留空＝所有人）</label>
                <input type="text" id="rp-count" inputmode="numeric" placeholder="留空">
                <div class="notice" id="rp-hint" style="margin-top:6px;">每人至少 0.01 元，所以 0.02 元最多只能分给 2 个人。</div>
            </div>
            <div class="field"><label>留言</label>
                <input type="text" id="rp-note" maxlength="40" placeholder="恭喜发财">
            </div>
            <div class="field"><label>只让指定的人抢（不选＝所有人）</label>
                <div id="rp-allow-list" style="max-height:180px; overflow:auto;">${candidates || '<div class="notice">群里还没有其他成员。</div>'}</div>
            </div>`, {
            wide: true,
            actions: [
                { label: "取消", act: "cancel" },
                { label: "发红包", act: "send", primary: true }
            ],
            onMount(root) {
                const hint = root.querySelector("#rp-hint");
                const update = () => {
                    const total = Math.round(Number(root.querySelector("#rp-total").value || 0) * 100);
                    const count = Number(root.querySelector("#rp-count").value || 0);
                    const picked = root.querySelectorAll(".rp-allow:checked").length;
                    const people = count > 0 ? count : (picked > 0 ? picked : 0);
                    if (!total) {
                        hint.textContent = "每人至少 0.01 元，所以 0.02 元最多只能分给 2 个人。";
                        return;
                    }
                    if (people > total) {
                        hint.textContent = `${formatAmount(total)} 元最多只能分给 ${total} 个人（每人至少 0.01 元）`;
                        hint.style.color = "#c0342a";
                    } else {
                        hint.textContent = `当前最多可以分给 ${people || total} 个人，每人至少 0.01 元`;
                        hint.style.color = "";
                    }
                };
                root.querySelector("#rp-total").addEventListener("input", update);
                root.querySelector("#rp-count").addEventListener("input", update);
                root.querySelectorAll(".rp-allow").forEach((box) => box.addEventListener("change", update));
            },
            onAction: async (act) => {
                if (act !== "send") {
                    return false;
                }
                const total = el("rp-total").value.trim();
                const countText = el("rp-count").value.trim();
                const allow = Array.from(document.querySelectorAll(".rp-allow:checked")).map((item) => item.value);
                if (!total) {
                    toast("请填写金额", "error");
                    return false;
                }
                try {
                    const sent = await api.chat.sendRedPacket(state.current.id, {
                        total,
                        count: countText ? Number(countText) : 0,
                        allow,
                        note: el("rp-note").value.trim()
                    });
                    if (sent.balance !== undefined) {
                        state.myMoney = sent.balance;
                    }
                    await loadMessages(state.current.id);
                    await refreshConversations(true);
                    toast("红包已发出");
                    return true;
                } catch (error) {
                    report(error);
                    return false;
                }
            }
        });
    }

    async function grabRedPacket(messageId) {
        if (!state.current) {
            return;
        }
        const message = state.messages.find((item) => item.id === messageId);
        if (message && message.sender === state.me) {
            showRedPacketDetail(message);
            return;
        }
        if (message && message.packet && (message.packet.grabs || []).some((item) => item.login === state.me)) {
            showRedPacketDetail(message);
            return;
        }
        try {
            const result = await api.chat.grabRedPacket(state.current.id, messageId);
            toast(`抢到 ${result.amount} 元`);
            await loadMessages(state.current.id);
        } catch (error) {
            if (error && (error.status === 409 || error.status === 410 || error.status === 403)) {
                await loadMessages(state.current.id);
            }
            report(error);
        }
    }

    function showRedPacketDetail(message) {
        const packet = message.packet || {};
        const mine = (packet.grabs || []).find((item) => item.login === state.me);
        const rows = (packet.grabs || []).map((item) => `
            <div class="row">
                <span>${escapeHtml(item.name || item.login)}</span>
                <span class="amount">${formatAmount(item.cents)} 元</span>
            </div>`).join("") || '<div class="notice">还没有人抢到。</div>';
        const summary = mine
            ? `你抢到 ${formatAmount(mine.cents)} 元`
            : (Number(packet.remainCents) > 0 ? `还剩 ${formatAmount(packet.remainCents)} 元` : "已经被抢完了");
        const actions = [{ label: "关闭", act: "cancel", primary: true }];
        if (message.sender === state.me && Number(packet.remainCents) > 0 && !packet.closed) {
            actions.unshift({ label: `退回剩余 ${formatAmount(packet.remainCents)} 元`, act: "refund" });
        }
        openModal(`红包：${escapeHtml(packet.note || "拼手速红包")}`, `
            <div class="notice">${escapeHtml(summary)} · 总额 ${formatAmount(packet.totalCents)} 元 · ${escapeHtml(String((packet.grabs || []).length))} 人已抢${Number(packet.count) > 0 ? ` / ${packet.count} 人可抢` : ""}</div>
            <div class="rp-grabs">${rows}</div>`, {
            actions,
            onAction: async (act) => {
                if (act !== "refund") {
                    return false;
                }
                try {
                    const result = await api.chat.refundRedPacket(state.current.id, message.id);
                    toast(`已退回 ${result.refunded} 元`);
                    await loadMessages(state.current.id);
                    return true;
                } catch (error) {
                    report(error);
                    return false;
                }
            }
        });
    }

            <div style="display:flex; gap:8px; justify-content:center; margin:10px 0;">

            </div>

                <input type="text" id="invite-close-name" maxlength="24" value="${escapeHtml(invite.name || "")}" placeholder="例如：周末开黑">
            </div>`, {
            wide: true,
            actions: [
                { label: "取消邀请", act: "cancel-invite" },
                { label: "结束邀请并建群", act: "close", primary: true }
            ],
            onMount(root) {
                root.querySelector("#copy-invite").addEventListener("click", () => copyText(invite.code));
                root.querySelector("#refresh-invite").addEventListener("click", async () => {
                    try {
                        const fresh = await api.chat.invite(invite.code);
                        closeModal();
                        showInvitePanel(fresh.invite);
                    } catch (error) {
                        report(error);
                    }
                });
                const timer = setInterval(async () => {
                    if (document.getElementById("modal-root").innerHTML === "") {
                        clearInterval(timer);
                        return;
                    }
                    try {
                        const fresh = await api.chat.invite(invite.code);
                        if ((fresh.invite.participants || []).length !== (state.invite && state.invite.participants || []).length) {
                            state.invite = fresh.invite;
                            closeModal();
                            showInvitePanel(fresh.invite);
                        }
                    } catch (error) {
                        /* 静默轮询失败 */
                    }
                }, 4000);
            },
            onAction: async (act) => {
                if (act === "cancel-invite") {
                    if (!confirm("确定取消这个邀请吗？已经加入的人会收到通知。")) {
                        return false;
                    }
                    try {
                        await api.chat.cancelInvite(state.invite.code);
                        state.invite = null;
                        toast("邀请已取消");
                        return true;
                    } catch (error) {
                        report(error);
                        return false;
                    }
                }
                if (act !== "close") {
                    return false;
                }
                try {
                    const closed = await api.chat.closeInvite(state.invite.code, el("invite-close-name").value.trim());
                    state.invite = null;
                    toast("群聊已创建");
                    await refreshConversations(true);
                    setTimeout(() => openConversation(closed.conversation.id), 200);
                    return true;
                } catch (error) {
                    report(error);
                    return false;
                }
            }
        });
    }
