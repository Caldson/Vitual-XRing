            <div class="notice">频道 id：${escapeHtml(group.id)} · ${escapeHtml(String(group.memberCount))} 人 · ${escapeHtml(String(group.messageCount || 0))} 条消息</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;">
                <button class="btn" id="public-group-open">进入频道</button>
                <button class="btn" id="public-group-announcement">编辑群公告</button>
                <button class="btn danger" id="public-group-delete">解散公共频道</button>
            </div>`, {
            actions: [
                { label: "取消", act: "cancel" },
                { label: "保存", act: "save", primary: true }
            ],
            onMount(root) {
                root.querySelector("#public-group-open").addEventListener("click", () => {
                    closeModal();
                    switchTab("chats");
                    openConversation(group.id);
                });
                root.querySelector("#public-group-announcement").addEventListener("click", async () => {
                    closeModal();
                    switchTab("chats");
                    await openConversation(group.id);
                    await openGroupInfo();
                });
                root.querySelector("#public-group-delete").addEventListener("click", async () => {
                    if (!confirm("解散后所有账户都会失去这个公共频道，聊天记录一并删除，确定吗？")) {
                        return;
                    }
                    try {
                        await api.chat.removePublicGroup(group.id);
                        closeModal();
                        await Promise.all([loadAdmin(), refreshConversations(true)]);
                        if (state.current && state.current.id === group.id) {
                            state.current = null;
                            renderChatPane();
                        }
                        toast("公共频道已解散");
                    } catch (error) {
                        report(error);
                    }
                });
            },
            onAction: async (act) => {
                if (act !== "save") {
                    return false;
                }
                const name = el("public-group-name").value.trim();
                const description = el("public-group-desc").value.trim();
                if (!name) {
                    toast("请填写频道名称", "error");
                    return false;
                }
                try {
                    await api.chat.updatePublicGroup(group.id, { name, description });
                    await Promise.all([loadAdmin(), refreshConversations(true)]);
                    toast("公共频道已更新");
                    return true;
                } catch (error) {
                    report(error);
                    return false;
                }
            }
        });
    }

    async function openAdminConversation(id) {
        try {
            const data = await api.chat.adminMessages(id);
            const conv = data.conversation;
            const rows = data.messages.map((message) => `
                <div class="member-row">
                    <div class="avatar">${initial(message.senderName || message.sender)}</div>
                    <div class="member-main">
                        <div class="member-name">${escapeHtml(message.senderName || message.sender)} <span class="pill">${escapeHtml(message.type)}</span></div>
                        <div class="member-sub">${escapeHtml(message.recalled ? "已撤回" : messagePreviewText(message))} · ${escapeHtml(message.time || "")}</div>
                    </div>
                    <div class="member-actions">
                        <button class="btn small danger" data-del-msg="${escapeHtml(message.id)}">删除</button>
                    </div>
                </div>`).join("") || '<div class="notice">这个会话还没有消息。</div>';

            openModal(`管理：${escapeHtml(conv.name)}`, `
                <div class="notice">会话 id：${escapeHtml(conv.id)} · 成员：${escapeHtml((data.members || []).join("、"))}</div>
                ${rows}
                <div style="margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap;">
                    ${conv.type === "group" && !conv.public && !conv.dissolved ? '<button class="btn danger" id="admin-dissolve-conv">解散群聊（保留记录）</button>' : ""}
                    <button class="btn danger" id="admin-delete-conv">删除整个会话</button>
                </div>`, {
                wide: true,
                onMount(root) {
                    root.querySelectorAll("[data-del-msg]").forEach((button) => {
                        button.addEventListener("click", async () => {
                            if (!confirm("永久删除这条消息吗？")) {
                                return;
                            }
                            try {
                                await api.chat.adminRemoveMessage(conv.id, button.dataset.delMsg);
                                closeModal();
                                await loadAdmin();
                                toast("消息已删除");
                            } catch (error) {
                                report(error);
                            }
                        });
                    });
                    root.querySelector("#admin-delete-conv").addEventListener("click", async () => {
                        if (!confirm("永久删除整个会话及全部消息吗？")) {
                            return;
                        }
                        try {
                            await api.chat.adminRemoveConversation(conv.id);
                            closeModal();
                            await Promise.all([loadAdmin(), refreshConversations(true)]);
                            if (state.current && state.current.id === conv.id) {
                                state.current = null;
                                renderChatPane();
                            }
                            toast("会话已删除");
                        } catch (error) {
                            report(error);
                        }
                    });
                    const adminDissolve = root.querySelector("#admin-dissolve-conv");
                    if (adminDissolve) {
                        adminDissolve.addEventListener("click", async () => {
                            if (!confirm("解散后群聊会变成只读，成员仍可查看历史消息，确定吗？")) {
                                return;
                            }
                            try {
                                await api.chat.remove(conv.id);
                                closeModal();
                                await Promise.all([loadAdmin(), refreshConversations(true)]);
                                if (state.current && state.current.id === conv.id) {
                                    state.current = { ...state.current, dissolved: true };
                                    renderChatPane();
                                }
                                toast("群聊已解散");
                            } catch (error) {
                                report(error);
                            }
                        });
                    }
                }
            });
        } catch (error) {
            report(error);
        }
    }

    function openModal(title, bodyHtml, options = {}) {
        const root = el("modal-root");
        const actions = options.actions || [{ label: "关闭", act: "cancel" }];
        root.innerHTML = `<div class="modal-backdrop">
            <section class="modal${options.wide ? " wide" : ""}">
                <header><span class="grow">${title}</span><button type="button" data-act="cancel">×</button></header>
                <div class="modal-body">${bodyHtml}</div>
                <footer>${actions.map((action) => `<button type="button" class="btn${action.primary ? " primary" : ""}" data-act="${action.act}">${action.label}</button>`).join("")}</footer>
            </section>
        </div>`;

        const backdrop = root.firstElementChild;
        const footer = backdrop.querySelector("footer");
        const body = backdrop.querySelector(".modal-body");
        backdrop.querySelectorAll('[data-act="cancel"]').forEach((button) => {
            button.addEventListener("click", closeModal);
        });
        if (typeof options.onAction === "function") {
            footer.querySelectorAll("button[data-act]").forEach((button) => {
                const act = button.dataset.act;
                if (act === "cancel") {
                    return;
                }
                button.addEventListener("click", async () => {
                    button.disabled = true;
                    try {
                        if (await options.onAction(act)) {
                            closeModal();
                        }
                    } finally {
                        button.disabled = false;
                    }
                });
            });
        }
        backdrop.addEventListener("mousedown", (event) => {
            if (event.target === backdrop) {
                closeModal();
            }
        });
        if (options.onMount) {
            options.onMount(body, footer, backdrop);
        }
    }

    function closeModal() {
        el("modal-root").innerHTML = "";
    }

    function setConnection(connected, text) {
        state.wsConnected = Boolean(connected);
        const dot = el("conn-dot");
        if (dot) {
            dot.className = `status-dot ${connected ? "online" : "offline"}`;
        }
        const label = el("conn-text");
        if (label) {
            label.textContent = text || (connected ? "实时连接" : "轮询模式");
        }
    }

    function connectSocket() {
        if (!window.WebSocket) {
            setConnection(false, "轮询模式");
            return;
        }
        let url;
        try {
            url = api.chatSocketUrl();
        } catch (error) {
            setConnection(false, "轮询模式");
            return;
        }
        let socket;
        try {
            socket = new WebSocket(url);
        } catch (error) {
            setConnection(false, "轮询模式");
            scheduleReconnect();
            return;
        }
        state.ws = socket;

        socket.addEventListener("open", () => {
            state.reconnectDelay = 1000;
            setConnection(true, "实时连接");
        });
        socket.addEventListener("message", (event) => {
            let data = null;
            try {
                data = JSON.parse(event.data);
            } catch (error) {
                return;
            }
            handleEvent(data);
        });
        socket.addEventListener("close", () => {
            state.ws = null;
            setConnection(false, "已断开，重连中…");
            scheduleReconnect();
        });
        socket.addEventListener("error", () => {
            setConnection(false, "连接异常");
        });
    }

    function scheduleReconnect() {
        clearTimeout(state.reconnectTimer);
        state.reconnectTimer = setTimeout(() => {
            connectSocket();
        }, state.reconnectDelay);
        state.reconnectDelay = Math.min(state.reconnectDelay * 1.6, 15000);
    }

    function handleEvent(event) {
        if (!event || !event.type) {
            return;
        }
        if (event.type === "hello" || event.type === "presence") {
            state.online = new Set(event.online || []);
            if (state.current && state.current.type === "direct") {
                renderChatPane();
            }
            return;
        }
        if (event.type === "message") {
            const message = event.message;
            if (!message) {
                return;
            }
            const mentionedMe = Array.isArray(message.mentions)
                && message.mentions.includes(state.me)
                && message.sender !== state.me;
            if (state.current && state.current.id === message.conversation) {
                if (!state.messages.some((item) => item.id === message.id)) {
                    state.messages.push(message);
                    renderMessages();
                }
                api.chat.read(state.current.id).catch(() => {});
            } else if (mentionedMe) {
                const conv = state.conversations.find((item) => item.id === message.conversation);
                toast(`${message.senderName || message.sender} 在「${conv ? conv.name : "聊天室"}」@ 了你`);
            }
            if (event.conversation && typeof event.conversation === "object" && state.current && state.current.id === event.conversation.id) {
                state.current = { ...state.current, ...event.conversation };
            }
            refreshConversations(true);
            return;
        }
        if (event.type === "message:recall" || event.type === "message:delete") {
            const targetId = typeof event.conversation === "string"
                ? event.conversation
                : (event.conversation && event.conversation.id) || "";
            if (state.current && state.current.id === targetId) {
                loadMessages(state.current.id).catch(() => {});
            }
            refreshConversations(true);
            return;
        }
        if (event.type === "conversation:update" || event.type === "conversation:new") {
            const conv = event.conversation;
            if (!conv) {
                return;
            }
            const index = state.conversations.findIndex((item) => item.id === conv.id);
            if (index >= 0) {
                state.conversations[index] = { ...state.conversations[index], ...conv };
            } else {
                state.conversations.push(conv);
            }
            if (state.current && state.current.id === conv.id) {
                state.current = { ...state.current, ...conv };
                renderChatPane();
            }
            renderSidebar();
            refreshConversations(true);
            return;
        }
        if (event.type === "conversation:dissolved") {
            const id = event.conversation;
            const target = state.conversations.find((item) => item.id === id);
            if (target) {
                target.dissolved = true;
            }
            if (state.current && state.current.id === id) {
                state.current = { ...state.current, dissolved: true };
                renderChatPane();
                toast("群聊已被解散，只能查看历史消息");
            }
            renderSidebar();
            refreshConversations(true);
            return;
        }
        if (event.type === "conversation:remove") {
            state.conversations = state.conversations.filter((item) => item.id !== event.conversation);
            if (state.current && state.current.id === event.conversation) {
                state.current = null;
                renderChatPane();
                toast("这个会话已被解散或你已被移出");
            }
            renderSidebar();
            return;
        }
        if (event.type === "message:packet") {
            const message = event.message;
            if (!message) {
                return;
            }
            const index = state.messages.findIndex((item) => item.id === message.id);
            if (index >= 0) {
                state.messages[index] = message;
                renderMessages();
            }
            return;
        }
        if (event.type === "invite:update") {
            if (state.invite && event.invite && event.invite.code === state.invite.code) {
                state.invite = event.invite;
                const box = document.querySelector(".code-big");
                if (box) {
                    const joined = document.querySelectorAll("#modal-root .check-row").length;
                    if (joined !== (event.invite.participants || []).length) {
                        closeModal();
                        showInvitePanel(event.invite);
                    }
                }
            }
            return;
        }
        if (event.type === "invite:closed") {
            closeModal();
            toast("发起人结束了邀请，群聊已建好");
            refreshConversations(true).then(() => {
                if (event.invite && event.invite.conversation) {
                    openConversation(event.invite.conversation).catch(() => {});
                }
            });
            return;
        }
        if (event.type === "invite:cancelled") {
            closeModal();
            toast("发起人取消了邀请");
            return;
        }
        if (event.type === "typing") {
            if (state.current && state.current.id === event.conversation && event.login !== state.me) {
                state.typing[event.login] = event.name || event.login;
                renderTyping();
                setTimeout(() => {
                    delete state.typing[event.login];
                    renderTyping();
                }, 3200);
            }
            return;
        }
        if (event.type === "friend:request") {
            refreshContacts();
            toast(`${event.request && event.request.username ? event.request.username : "有人"} 请求加你为好友`);
            return;
        }
        if (event.type === "friend:accept") {
            refreshContacts();
            refreshConversations(true);
            toast("好友申请已通过");
            return;
        }
        if (event.type === "friend:decline" || event.type === "friend:remove") {
            refreshContacts();
            toast("好友关系有更新");
            return;
        }
    }

    function poll() {
        if (state.wsConnected) {
            return;
        }
        refreshConversations(true);
        refreshContacts(true);
        if (state.current) {
            const nearBottom = (() => {
                const node = el("messages");
                return !node || node.scrollHeight - node.scrollTop - node.clientHeight < 90;
            })();
            loadMessages(state.current.id, { silent: true }).then(() => {
                renderMessages();
                const node = el("messages");
                if (node && nearBottom) {
                    node.scrollTop = node.scrollHeight;
                }
            }).catch(() => {});
        }
    }

    document.addEventListener("DOMContentLoaded", boot);
    el("gate-retry").addEventListener("click", () => location.reload());
    el("stale-reload").addEventListener("click", async () => {
        el("stale-reload").disabled = true;
        if (await loadSdk(`${SDK_URL}?v=${REQUIRED_API_VERSION}&t=${Date.now()}`)) {
            api = window.VTXApi;
            location.reload();
            return;
        }
        el("stale-reload").disabled = false;
        showStale("重新加载失败，请手动刷新页面（Ctrl+F5），或稍后再试。");
    });
})();
</script>
</body>
</html>
