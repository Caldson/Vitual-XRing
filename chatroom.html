<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>聊天室 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, #e2edff 0, transparent 34%),
                radial-gradient(circle at 90% 85%, #e4f5f0 0, transparent 30%),
                #f4f7fb;
        }

        .placeholder-card {
            width: min(100%, 460px);
            padding: 48px 40px;
            border: 1px solid #e7ebf2;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 24px 70px rgba(30, 50, 90, 0.12);
            text-align: center;
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            margin: 0 auto;
            display: grid;
            place-items: center;
            border-radius: 16px;
            color: #fff;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-size: 22px;
            font-weight: 800;
        }

        p {
            margin: 24px 0 0;
            color: #3158d1;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 26px;
            color: #68768d;
            font-size: 14px;
            text-decoration: none;
        }

        a:hover {
            color: #3158d1;
        }

        .version-badge {
            position: fixed;
            top: 18px;
            right: 20px;
            padding: 6px 12px;
            border-radius: 999px;
            color: #3158d1;
            background: #eef2ff;
            font-size: 12.5px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <span class="version-badge">v6.2</span>
    <main class="placeholder-card">
        <div class="brand-mark" aria-hidden="true">V</div>
        <p>功能开发中，敬请期待。</p>
        <a href="manager.html">← 返回账户</a>
    </main>
</body>
</html>
