<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f2430">
    <title>聊天室 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            --app-height: 100vh;
            --blue: #3867e8;
            --blue-soft: #eef2ff;
            --ink: #172033;
            --muted: #68768d;
            --line: #e7ebf2;
            --bg: #f4f7fb;
            --rail: #1f2430;
            --rail-soft: #2b3140;
            --bubble: #ffffff;
            --mine: #3867e8;
            --danger: #d6455d;
            --ok: #2f9e6f;
        }

        * { box-sizing: border-box; }

        [hidden] { display: none !important; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }

        button, input, textarea {
            font: inherit;
            color: inherit;
        }

        button { cursor: pointer; touch-action: manipulation; }

        /* 1.3.0：iPad / iPhone 的 100vh 是「工具栏收起后」的大视口，键盘弹出也不会变，
           聊天区会被撑出屏幕且没有滚动条。这里优先用 dvh，脚本再用 visualViewport
           的实际高度写成内联 height（见 syncViewportHeight），保证输入框始终可见。 */
        .app {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            height: auto;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 18px;
            padding-top: calc(env(safe-area-inset-top, 0px));
            padding-left: calc(18px + env(safe-area-inset-left, 0px));
            padding-right: calc(18px + env(safe-area-inset-right, 0px));
            background: #fff;
            border-bottom: 1px solid var(--line);
            flex: 0 0 auto;
            box-sizing: border-box;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-size: 15px;
            font-weight: 800;
        }

        .version-badge {
            padding: 3px 9px;
            border-radius: 999px;
            color: var(--blue);
            background: var(--blue-soft);
            font-size: 12px;
            font-weight: 700;
        }

        .topbar-spacer { flex: 1; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12.5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #c4ccd9;
        }

        .status-dot.online { background: var(--ok); }
        .status-dot.offline { background: var(--danger); }

        .topbar a {
            color: var(--muted);
            text-decoration: none;
            font-size: 13.5px;
        }

        .topbar a:hover { color: var(--blue); }

        .layout {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 68px 292px minmax(0, 1fr);
            overflow: hidden;
        }

        .rail {
            background: var(--rail);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            gap: 8px;
            min-height: 0;
            overflow-y: auto;
        }

        .rail button {
            position: relative;
            width: 48px;
            min-height: 48px;
            border: 0;
            border-radius: 14px;
            background: transparent;
            color: #c9d2e3;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .rail button .glyph { font-size: 18px; line-height: 1; }
        .rail button:hover { background: var(--rail-soft); color: #fff; }
        .rail button.active { background: #3867e8; color: #fff; }

        .rail .badge {
            position: absolute;
            top: 3px;
            right: 3px;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            border-radius: 999px;
            background: #ff5a5f;
            color: #fff;
            font-size: 10.5px;
            line-height: 17px;
            font-weight: 700;
        }

        .rail .badge[hidden] { display: none; }

        .rail-bottom {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #8e99ad;
            font-size: 11px;
            text-align: center;
            padding: 0 4px;
        }

        .rail-bottom .me {
            max-width: 58px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e6ecf7;
            font-weight: 600;
        }

        .sidebar {
            border-right: 1px solid var(--line);
            background: #fff;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar-head {
            padding: 12px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--line);
        }

        .sidebar-head input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 11px;
            background: #f7f9fd;
            outline: none;
            font-size: 13.5px;
        }

        .sidebar-head input:focus {
            border-color: #b9c8f5;
            background: #fff;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--blue);
            font-size: 18px;
            line-height: 1;
            display: grid;
            place-items: center;
        }

        .icon-btn:hover { background: var(--blue-soft); }

        .sidebar-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 6px 0 14px;
        }

        .section-title {
            padding: 14px 16px 7px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .list-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 14px;
            cursor: pointer;
            border-left: 3px solid transparent;
            position: relative;
        }

        .list-item:hover { background: #f7f9fd; }
        .list-item.active { background: var(--blue-soft); border-left-color: var(--blue); }
        .list-item.dissolved { opacity: 0.62; }
        .list-item.dissolved .list-name { color: #7b8494; }

        .avatar {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            background: linear-gradient(135deg, #4b74e8, #7f9bff);
            overflow: hidden;
        }

        .avatar.group { background: linear-gradient(135deg, #2f9e6f, #5cc79a); }
        .avatar.public { background: linear-gradient(135deg, #8a6ce0, #b29bff); }

        .list-main { flex: 1; min-width: 0; }

        .list-top {
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        .list-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
        }

        .list-time {
            color: #9aa5b6;
            font-size: 11.5px;
            flex: 0 0 auto;
        }

        .list-preview {
            margin-top: 3px;
            display: flex;
            gap: 6px;
            align-items: center;
            color: var(--muted);
            font-size: 12.5px;
        }

        .list-preview span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tag {
            flex: 0 0 auto;
            padding: 1px 6px;
            border-radius: 6px;
            background: #f0f3f9;
            color: #7c8798;
            font-size: 10.5px;
            font-weight: 700;
        }

        .tag.muted { color: #9aa5b6; }

        .badge-red {
            flex: 0 0 auto;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: #ff5a5f;
            color: #fff;
            font-size: 10.5px;
            font-weight: 700;
            line-height: 18px;
            text-align: center;
        }

        /* 1.5.0：@ 提醒 */
        .badge-mention {
            flex: 0 0 auto;
            min-width: 18px;
            height: 18px;
            padding: 0 6px;
            border-radius: 999px;
            background: #f0a13b;
            color: #fff;
            font-size: 10.5px;
            font-weight: 700;
            line-height: 18px;
            text-align: center;
        }

        .rail .badge.mention { background: #f0a13b; }

        .tag.mention-tag {
            background: #fdf1dd;
            color: #b7791f;
        }

        .chat-pane {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 15% 15%, #eaf0ff 0, transparent 34%),
                radial-gradient(circle at 90% 85%, #e6f6ef 0, transparent 30%),
                var(--bg);
        }

        .empty-state {
            flex: 1;
            display: grid;
            place-items: center;
            color: var(--muted);
            text-align: center;
            padding: 30px;
        }

        .empty-state h2 { margin: 0 0 8px; color: var(--ink); font-size: 20px; }
        .empty-state p { margin: 0; font-size: 13.5px; line-height: 1.8; }

        .chat-view {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .chat-head {
            flex: 0 0 auto;
            padding: 11px 18px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-head h2 {
            margin: 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-head p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .chat-head .grow { flex: 1; }

        .announce-bar {
            flex: 0 0 auto;
            margin: 10px 18px 0;
            padding: 9px 12px;
            border: 1px solid #f1dfb6;
            background: #fffaf0;
            border-radius: 10px;
            color: #806430;
            font-size: 12.5px;
            line-height: 1.6;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .announce-bar.pinned { border-color: #f0c97a; background: #fff5dc; }
        .announce-bar strong { flex: 0 0 auto; }
        .announce-bar .announce-text { flex: 1; white-space: pre-wrap; word-break: break-word; }

        /* 1.0.0：红包 */
        .rp-card {
            display: block;
            min-width: 190px;
            max-width: 240px;
            padding: 10px 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f0564a 0%, #e0362a 100%);
            color: #fff;
            cursor: pointer;
            border: none;
            text-align: left;
            font: inherit;
        }

        .rp-card .rp-head { display: flex; gap: 8px; align-items: center; }
        .rp-card .rp-icon { font-size: 20px; }
        .rp-card .rp-note { font-size: 13px; font-weight: 600; line-height: 1.4; word-break: break-word; }
        .rp-card .rp-sub { margin-top: 6px; font-size: 11.5px; opacity: 0.9; }
        .rp-card.done { background: linear-gradient(135deg, #b9bcc4 0%, #9aa0aa 100%); }

        .rp-grabs { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
        .rp-grabs .row { display: flex; justify-content: space-between; gap: 10px; }
        .rp-grabs .row .amount { color: var(--blue); font-weight: 600; }

        .code-big {
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 8px;
            text-align: center;
            padding: 14px 8px;
            border-radius: 12px;
            background: #f2f6ff;
            color: var(--blue);
            user-select: all;
        }

        .qr-box {
            display: grid;
            place-items: center;
            padding: 12px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-top: 10px;
        }

        .qr-box canvas { width: 220px; height: 220px; image-rendering: pixelated; }

        .code-line {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--muted);
        }

        .code-line .mono {
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 14px;
            color: var(--text);
            font-weight: 600;
            user-select: all;
        }

        .dissolved-bar {
            flex: 0 0 auto;
            margin: 10px 18px 0;
            padding: 9px 12px;
            border: 1px solid #dfe3e9;
            background: #f5f6f8;
            border-radius: 10px;
            color: #6b7280;
            font-size: 12.5px;
            line-height: 1.6;
        }

        .composer.readonly {
            background: #f7f8fa;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: #c7d2e4 transparent;
            padding: 18px 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 桌面 / 鼠标设备给一条常驻滚动条；iPadOS 仍是系统浮层滚动条 */
        .messages::-webkit-scrollbar { width: 10px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb {
            border: 3px solid transparent;
            border-radius: 999px;
            background: #c7d2e4;
            background-clip: content-box;
        }

        .load-more {
            align-self: center;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 12px;
        }

        .msg-row {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            max-width: 100%;
        }

        .msg-row.mine { flex-direction: row-reverse; }

        .msg-row .avatar { width: 34px; height: 34px; border-radius: 10px; font-size: 13px; }

        .msg-body { max-width: min(72%, 640px); }

        .msg-meta {
            display: flex;
            gap: 8px;
            align-items: baseline;
            margin-bottom: 3px;
            color: #9aa5b6;
            font-size: 11.5px;
        }

        .msg-row.mine .msg-meta { justify-content: flex-end; }
        .msg-meta .name { color: #5c6b83; font-weight: 600; }

        .bubble {
            position: relative;
            padding: 9px 12px;
            border-radius: 4px 14px 14px 14px;
            background: var(--bubble);
            border: 1px solid #e8ecf4;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(30, 50, 90, 0.04);
        }

        .msg-row.mine .bubble {
            background: var(--mine);
            border-color: var(--mine);
            color: #fff;
            border-radius: 14px 4px 14px 14px;
        }

        .bubble.recalled {
            background: #f1f3f8;
            border-style: dashed;
            color: #8d98aa;
            font-style: italic;
            box-shadow: none;
        }

        .msg-row.mine .bubble.recalled {
            background: #e8edf8;
            border-color: #cbd6ee;
            color: #7b879b;
        }

        .bubble .quote {
            margin-bottom: 6px;
            padding: 5px 8px;
            border-left: 3px solid #a8b8df;
            background: rgba(0, 0, 0, 0.045);
            border-radius: 6px;
            color: #5c6b83;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .msg-row.mine .bubble .quote {
            background: rgba(255, 255, 255, 0.16);
            border-left-color: rgba(255, 255, 255, 0.6);
            color: rgba(255, 255, 255, 0.86);
        }

        .bubble .forwarded {
            margin-bottom: 5px;
            color: #8d98aa;
            font-size: 11.5px;
        }

        .msg-row.mine .bubble .forwarded { color: rgba(255, 255, 255, 0.72); }

        .bubble img.media-image {
            display: block;
            max-width: 260px;
            max-height: 260px;
            border-radius: 8px;
            cursor: zoom-in;
            background: #f3f5fa;
        }

        .bubble .media-caption { margin-top: 6px; }

        .bubble .media-file {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            color: inherit;
            font-weight: 600;
            text-decoration: underline;
        }

        .bubble .media-expired {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.06);
            color: #8d98aa;
            font-size: 12px;
        }

        .msg-row.mine .bubble .media-expired {
            background: rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.8);
        }

        .msg-actions {
            opacity: 0;
            align-self: center;
            border: 0;
            background: transparent;
            color: #97a2b4;
            font-size: 16px;
            padding: 2px 4px;
        }

        .msg-row:hover .msg-actions { opacity: 1; }
        .msg-actions:hover { color: var(--blue); }

        /* 1.5.0：消息里被 @ 的名字 */
        .mention {
            padding: 0 3px;
            border-radius: 6px;
            background: var(--blue-soft);
            color: var(--blue);
            font-weight: 600;
        }

        .msg-row.mine .bubble .mention {
            background: rgba(255, 255, 255, 0.24);
            color: #fff;
        }

        .msg-row.mentioned .bubble {
            border-color: #f0c97a;
            background: #fffaf0;
            box-shadow: 0 2px 10px rgba(240, 161, 59, 0.18);
        }

        .msg-meta .mention-flag {
            padding: 0 6px;
            border-radius: 999px;
            background: #fdf1dd;
            color: #b7791f;
            font-size: 10.5px;
            font-weight: 700;
        }

        /* 1.5.0：输入 @ 时弹出的成员选择器 */
        .mention-picker {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 100%;
            margin-bottom: 8px;
            max-height: 216px;
            overflow-y: auto;
            padding: 6px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(23, 32, 51, 0.16);
            z-index: 30;
        }

        .mention-item {
            display: flex;
            gap: 9px;
            align-items: center;
            width: 100%;
            padding: 7px 9px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            text-align: left;
            font-size: 13.5px;
        }

        .mention-item .mention-item-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }

        .mention-item .mention-item-login {
            color: var(--muted);
            font-size: 12px;
        }

        .mention-item.active,
        .mention-item:hover {
            background: var(--blue-soft);
        }

        .mention-item .avatar {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 12px;
        }

        .mention-empty {
            padding: 10px 12px;
            color: var(--muted);
            font-size: 12.5px;
        }


        .system-row {
            align-self: center;
            max-width: 80%;
            padding: 3px 12px;
            border-radius: 999px;
            background: rgba(120, 135, 160, 0.12);
            color: #7b879b;
            font-size: 11.5px;
            text-align: center;
        }

        .time-divider {
            align-self: center;
            color: #9aa5b6;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.6);
            padding: 2px 10px;
            border-radius: 999px;
        }

        .typing-line {
            height: 20px;
            padding: 0 22px;
            color: var(--muted);
            font-size: 12px;
        }

        .composer {
            position: relative;
            flex: 0 0 auto;
            background: #fff;
            border-top: 1px solid var(--line);
            padding: 9px 14px 11px;
            padding-bottom: calc(11px + env(safe-area-inset-bottom, 0px));
        }

        .reply-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px;
            padding: 6px 10px;
            border-radius: 8px;
            background: #f3f6fd;
            color: var(--muted);
            font-size: 12.5px;
        }

        .reply-bar .reply-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reply-bar button {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 16px;
        }

        .composer-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .composer-row textarea {
            flex: 1;
            min-height: 42px;
            max-height: 132px;
            resize: none;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            background: #f8fafd;
            outline: none;
            font-size: 14px;

        @media (hover: none) and (pointer: coarse) {

    </style>
</head>
