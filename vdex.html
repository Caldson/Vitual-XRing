<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7fb">
    <title>VDEX · Vitual XRing</title>
    <link rel="icon" href="XRingLogo.png?v=12.1.1">
    <link rel="stylesheet" href="vtx-theme.css?v=12.1.1">
    <script src="vtx-theme.js?v=12.1.1"></script>
    <style>
        :root { --vdex: #5b4bdb; --vdex-soft: #efedff; --vdex-dark: #372a9e; }
        body { background: radial-gradient(circle at 85% 0%, #f0edff 0, transparent 32%), var(--vtx-bg); }
        .vtx-topbar .top-links { display: flex; align-items: center; gap: 18px; margin-left: auto; color: var(--vtx-muted); font-size: 13px; font-weight: 800; }
        .vtx-topbar .top-links a { color: inherit; text-decoration: none; }
        .vtx-topbar .top-links a:hover, .vtx-topbar .top-links a.is-active { color: var(--vtx-text); }
        .vtx-topbar .top-links a.is-active { background: var(--vtx-accent-soft); color: var(--vtx-accent); padding: 6px 10px; border-radius: 999px; }
        .shell { width: min(100% - 36px, 1050px); margin: 0 auto; padding: 30px 0 80px; }
        .hero { display: flex; align-items: center; gap: 22px; padding: 34px 0 24px; }
        .hero h1 { margin: 0 0 8px; font-size: clamp(32px, 5vw, 54px); letter-spacing: -.05em; }
        .hero p { margin: 0; max-width: 660px; color: var(--vtx-muted); font-size: 14px; line-height: 1.75; }
        .logo { width: 88px; height: 88px; flex: 0 0 88px; display: grid; place-items: center; border-radius: 24px; background: var(--vdex); color: #fff; font-size: 44px; box-shadow: 0 18px 40px rgba(91,75,219,.3); }
        .card { padding: 22px; border: 1px solid var(--vtx-border); border-radius: 16px; background: var(--vtx-surface); box-shadow: var(--vtx-shadow-soft); }
        .card h2 { margin: 0 0 6px; font-size: 18px; }
        .card p { margin: 0 0 14px; color: var(--vtx-muted); font-size: 12.5px; line-height: 1.7; }
        .download { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; background: var(--vdex); color: #fff; font-weight: 800; text-decoration: none; font-size: 13px; }
        .download:hover { filter: brightness(1.05); }
        .table-wrap { max-height: 380px; overflow: auto; margin-top: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 8px 7px; border-bottom: 1px solid var(--vtx-border); text-align: left; }
        th { color: var(--vtx-muted); font-size: 11px; }
        .price { color: var(--vdex-dark); font-weight: 850; }
        .note { color: var(--vtx-faint); font-size: 11.5px; line-height: 1.7; margin-top: 14px; }
        #vdex-public { position: fixed; inset: 0; z-index: 300; background: #0b1020; }
        #vdex-public[hidden] { display: none; }
        #vdex-public-frame { width: 100%; height: 100%; border: 0; background: #fff; }
        .error { padding: 22px; color: var(--vtx-muted); font-size: 13px; }
        @media (max-width: 700px) { .hero { align-items: flex-start; } .logo { width: 62px; height: 62px; flex-basis: 62px; font-size: 30px; } }
    </style>
</head>
<body>
    <header class="vtx-topbar">
        <a class="vtx-brand" href="index.html"><img src="XRingLogo.png?v=12.1.1" alt="Vitual XRing" width="38" height="38"></a>
        <nav class="top-links"><a href="index.html">首页</a><a href="vtoy.html">Vtoy</a><a href="vdex.html" class="is-active">VDEX</a><a href="settings.html">设置</a></nav>
    </header>

    <main class="shell" id="vdex-landing">
        <section class="hero">
            <div>
                <h1>VDEX.HTML</h1>
                <p>VDEX 不再在网站里编辑代码。安装 VS Code 扩展后，登录 VTX 账户，用 <code>Vtoy VDEX</code> 文件夹准备、缓存、推送网站。</p>
            </div>
            <div class="logo">🌐</div>
        </section>
        <section class="card">
            <h2>Vtoy / VDEX VS Code 扩展</h2>
            <p>在 VS Code 左侧活动栏登录 VTX，准备Git文件夹，编辑 HTML / CSS / JS，再推送更新。公开地址仍是 <code>vdex.html?name=名称</code>。</p>
            <a class="download" href="downloads/vtoy-vdex-editor-0.2.4.vsix" download>下载 VSIX 扩展</a>
            <div class="table-wrap"><table><thead><tr><th>版本</th><th>容量</th><th>价格</th><th>能力</th></tr></thead><tbody id="plan-rows"></tbody></table></div>
            <p class="note">网站标题只从 HTML 的 <code>&lt;title&gt;</code> 读取；没有 <code>&lt;title&gt;</code> 时默认显示 <b>Document</b>，网站不再提供标题输入框。</p>
        </section>
    </main>

    <div id="vdex-public" hidden><iframe id="vdex-public-frame" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox" title="VDEX 站点"></iframe></div>

    <script src="vtx-api.js?v=12.1.1"></script>
    <script>
        (function () {
            "use strict";
            const el = (id) => document.getElementById(id);
            const params = new URLSearchParams(location.search);
            const publicName = String(params.get("name") || "").trim().toLowerCase();
            const NAME_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
            function api() { return window.VTXApi; }
            function escapeHtml(value) { return String(value == null ? "" : value).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

            async function loadPlans() {
                try {
                    const data = await api().request("/vdex/plans");
                    const rows = el("plan-rows");
                    rows.textContent = "";
                    (data.plans || []).forEach((plan) => {
                        const tr = document.createElement("tr");
                        const capability = plan.tier === "light" ? "轻量静态托管" : plan.tier === "standard" ? "静态托管" : plan.tier === "pro" ? "支持登录 + 游戏数据" : "完整 VTX 调用";
                        tr.innerHTML = `<td>${escapeHtml(plan.label)}</td><td>${plan.gb >= 1 ? plan.gb + "GB" : "100MB"}</td><td class="price">${plan.price} VTX/月</td><td>${capability}</td>`;
                        rows.appendChild(tr);
                    });
                } catch (error) {
                    el("plan-rows").innerHTML = '<tr><td colspan="4">套餐加载失败</td></tr>';
                }
            }

            function buildDocument(site) {
                const css = `<style>${site.css || ""}</style>`;
                let bridge = "";
                if (site.plan === "pro" || site.plan === "enterprise") {
                    bridge = `<script>window.VDEX={plan:${JSON.stringify(site.plan)},login:function(){return new Promise(function(resolve,reject){var origin="https://xsmmc.caldson.us.ci";var popup=window.open(origin+"/API_LOGIN.html","vdex-login","width=480,height=680");if(!popup){var blocked=new Error("登录窗口被拦截");blocked.status=402;blocked.code="login_rejected";reject(blocked);return;}var done=false;function finish(){if(done)return;done=true;window.removeEventListener("message",onMessage);clearInterval(timer);}function onMessage(event){if(event.origin!==origin)return;var data=event.data||{};if(data.type!=="vtx-login"||!data.ok)return;finish();var account=(data.result&&data.result.account)||{};resolve({login:data.result.login,username:account.username,uid:account.uid});}window.addEventListener("message",onMessage);var timer=setInterval(function(){if(popup.closed){finish();var error=new Error("用户拒绝登录");error.status=402;error.code="login_rejected";reject(error);}},300);});},getData:function(){return fetch("/api/vdex/data?name=${encodeURIComponent(site.name)}").then(function(r){return r.json();}).then(function(r){return r.data;});}${site.plan === "enterprise" ? ',pay:function(){window.open("API_VTXPAY.html","_blank");}' : ""}};<\/script>`;
                }
                const script = bridge + `<script>${site.js || ""}<\/script>`;
                if (/<html[\s>]/i.test(site.html || "")) {
                    let html = site.html;
                    if (/<\/head>/i.test(html)) html = html.replace(/<\/head>/i, css + "</head>"); else html = css + html;
                    if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, script + "</body>"); else html += script;
                    return html;
                }
                return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">${css}</head><body>${site.html || ""}${script}</body></html>`;
            }

            function openPublic(site) {
                el("vdex-landing").hidden = true;
                el("vdex-public").hidden = false;
                document.title = `${site.title || "Document"} · VDEX`;
                el("vdex-public-frame").srcdoc = buildDocument(site);
            }

            if (publicName) {
                if (!NAME_RE.test(publicName)) {
                    el("vdex-landing").innerHTML = '<div class="error">无效的站点名称。</div>';
                } else {
                    api().request(`/vdex/site?name=${encodeURIComponent(publicName)}`).then((data) => openPublic(data.site)).catch((error) => {
                        el("vdex-landing").innerHTML = '<div class="error">' + escapeHtml(error.message) + '</div>';
                    });
                }
            } else {
                loadPlans();
            }
        })();
    </script>
</body>
</html>
