<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>登录 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, #e2edff 0, transparent 34%),
                radial-gradient(circle at 90% 85%, #e4f5f0 0, transparent 30%),
                #f4f7fb;
        }

        .login-card {
            width: min(100%, 420px);
            padding: 40px;
            border: 1px solid #e7ebf2;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 24px 70px rgba(30, 50, 90, 0.12);
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            color: #fff;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-size: 22px;
            font-weight: 800;
        }

        h1 {
            margin: 24px 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #738097;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 0 14px;
            border: 1px solid #dce2ec;
            border-radius: 12px;
            outline: none;
            background: #fff;
            color: #172033;
            font: inherit;
            transition: border-color 150ms, box-shadow 150ms;
        }

        input:focus {
            border-color: #5478ed;
            box-shadow: 0 0 0 3px rgba(84, 120, 237, 0.14);
        }

        button {
            width: 100%;
            min-height: 50px;
            margin-top: 6px;
            border: 0;
            border-radius: 12px;
            color: white;
            background: #4169e1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 150ms, transform 150ms;
        }

        button:hover {
            background: #3158d1;
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        .message {
            min-height: 22px;
            margin: 14px 0 0;
            color: #bd3545;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #68768d;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #3158d1;
        }

        .version-badge {
            position: fixed;
            top: 18px;
            right: 20px;
            padding: 6px 12px;
            border-radius: 999px;
            color: #3158d1;
            background: #eef2ff;
            font-size: 12.5px;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            padding: 4px;
            border-radius: 12px;
            background: #f1f4fa;
        }

        .tab {
            flex: 1;
            min-height: 38px;
            border: 0;
            border-radius: 9px;
            color: #66748c;
            background: transparent;
            font: inherit;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: none;
        }

        .tab.active {
            color: #1f2b45;
            background: #fff;
            box-shadow: 0 2px 8px rgba(30, 50, 90, 0.08);
        }

        .tabs + button {
            border-radius: 9px;
        }

        form[hidden] {
            display: none;
        }

        .message.success {
            color: #1f7a52;
        }

        .auto-note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            padding: 11px 14px;
            border: 1px solid #d8e3fb;
            border-radius: 11px;
            color: #3158d1;
            background: #f5f8ff;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .auto-note[hidden] {
            display: none;
        }

        .link-button {
            flex: none;
            padding: 0;
            border: 0;
            color: #3158d1;
            background: none;
            font: inherit;
            font-size: 13.5px;
            font-weight: 650;
            text-decoration: underline;
            cursor: pointer;
        }

        .link-button:hover {
            background: none;
            transform: none;
        }

        form.disabled {
            opacity: 0.55;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    <span class="version-badge">v7.0</span>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">V</div>
        <h1>欢迎回来</h1>
        <p class="subtitle">登录 Vitual XRing，查看你的账户与 VTX 余额。</p>

        <div class="tabs" role="tablist">
            <button id="login-tab" class="tab active" type="button" role="tab" aria-selected="true">登录</button>
            <button id="register-tab" class="tab" type="button" role="tab" aria-selected="false">创建账户</button>
        </div>

        <div id="auto-login-note" class="auto-note" hidden>
            <span id="auto-login-text">正在自动登录…</span>
            <button id="switch-account" class="link-button" type="button">切换账户</button>
        </div>

        <form id="login-form">
            <div class="field">
                <label for="account-name">登录账户名</label>
                <input id="account-name" name="name" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="account-password">密码</label>
                <input id="account-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button id="login-button" type="submit">登录账户</button>
            <p id="login-message" class="message" role="alert" aria-live="polite"></p>
        </form>

        <form id="register-form" hidden>
            <div class="field">
                <label for="register-name">登录账户名</label>
                <input id="register-name" type="text" maxlength="20" autocomplete="username" required placeholder="2-20 个字符，登录时使用">
            </div>
            <div class="field">
                <label for="register-password">密码</label>
                <input id="register-password" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="register-confirm">确认密码</label>
                <input id="register-confirm" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <button id="register-button" type="submit">创建账户</button>
            <p id="register-message" class="message" role="alert" aria-live="polite"></p>
        </form>

        <a class="back-link" href="index.html">← 返回首页</a>
    </main>

    <script src="vtx-crypto.js?v=7.0"></script>
    <script src="vtx-api.js?v=7.0"></script>

    <script>
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const loginMessage = document.getElementById("login-message");
        const registerMessage = document.getElementById("register-message");
        const loginTab = document.getElementById("login-tab");
        const registerTab = document.getElementById("register-tab");

        function selectTab(name) {
            const isLogin = name === "login";
            loginForm.hidden = !isLogin;
            registerForm.hidden = isLogin;
            loginTab.classList.toggle("active", isLogin);
            registerTab.classList.toggle("active", !isLogin);
            loginTab.setAttribute("aria-selected", String(isLogin));
            registerTab.setAttribute("aria-selected", String(!isLogin));
            loginMessage.textContent = "";
            registerMessage.textContent = "";
        }

        loginTab.addEventListener("click", () => selectTab("login"));
        registerTab.addEventListener("click", () => selectTab("register"));

        async function readAccounts() {
            const response = await fetch("account.json", { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`读取账户数据失败（HTTP ${response.status}）`);
            }
            return response.json();
        }

        function networkMessage(error, fallback) {
            return error instanceof TypeError ? fallback : error.message;
        }

        async function verifyCredentials(name, password) {
            let accounts = await readAccounts();
            let account = accounts[name];

            if (!account || account.password !== password) {
                accounts = await window.VTXApi.readAll();
                account = accounts[name];
            }

            if (!account || account.password !== password) {
                return null;
            }
            return account;
        }

        function enterAccount(name) {
            sessionStorage.setItem("vtxAccount", name);
            markLoginPending(name);
            window.location.href = "manager.html";
        }

        // manager.html 读取该标记后记录本次登录的公网 IP 与经纬度
        function markLoginPending(name) {
            try {
                sessionStorage.setItem("vtxLoginPending", name);
            } catch (error) {
                /* 忽略 */
            }
        }

        function remember(name, password) {
            try {
                localStorage.setItem("vtxRemembered", JSON.stringify({ login: name, password }));
            } catch (error) {
                /* 隐私模式忽略 */
            }
        }

        function forget() {
            try {
                localStorage.removeItem("vtxRemembered");
            } catch (error) {
                /* 忽略 */
            }
        }

        function readRemembered() {
            try {
                const parsed = JSON.parse(localStorage.getItem("vtxRemembered") || "null");
                if (parsed && parsed.login && parsed.password) {
                    return parsed;
                }
            } catch (error) {
                /* 忽略损坏数据 */
            }
            return null;
        }

        async function tryAutoLogin() {
            const saved = readRemembered();
            if (!saved) {
                return false;
            }

            const note = document.getElementById("auto-login-note");
            const text = document.getElementById("auto-login-text");
            note.hidden = false;
            text.textContent = `正在自动登录 ${saved.login}…`;
            loginForm.classList.add("disabled");
            registerTab.disabled = true;

            try {
                const account = await verifyCredentials(saved.login, saved.password);

                if (account) {
                    enterAccount(saved.login);
                    return true;
                }

                forget();
                note.hidden = true;
                loginMessage.textContent = "自动登录失败（账户信息已变更），请重新输入密码。";
                document.getElementById("account-name").value = saved.login;
            } catch (error) {
                note.hidden = true;
                loginMessage.textContent = networkMessage(
                    error,
                    "无法读取账户数据，请检查网络后重试。"
                );
            } finally {
                loginForm.classList.remove("disabled");
                registerTab.disabled = false;
            }

            return false;
        }

        document.getElementById("switch-account").addEventListener("click", () => {
            forget();
            document.getElementById("auto-login-note").hidden = true;
            document.getElementById("account-name").value = "";
            document.getElementById("account-password").value = "";
            document.getElementById("account-name").focus();
        });

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("login-button");
            loginMessage.textContent = "";
            button.disabled = true;
            button.textContent = "正在登录…";

            try {
                const name = loginForm.elements.name.value.trim();
                const password = loginForm.elements.password.value;
                const account = await verifyCredentials(name, password);

                if (!account) {
                    loginMessage.textContent = "账户名称或密码不正确。";
                    return;
                }

                remember(name, password);
                enterAccount(name);
            } catch (error) {
                loginMessage.textContent = networkMessage(
                    error,
                    "无法读取账户数据。请通过本地服务器或网站打开此页面，不要直接以 file:// 打开。"
                );
            } finally {
                button.disabled = false;
                button.textContent = "登录账户";
            }
        });

        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("register-button");
            const nameInput = document.getElementById("register-name");
            const passwordInput = document.getElementById("register-password");
            const confirmInput = document.getElementById("register-confirm");

            const name = nameInput.value.trim();
            const password = passwordInput.value;

            registerMessage.textContent = "";
            registerMessage.classList.remove("success");

            if (!/^\S{2,20}$/.test(name)) {
                registerMessage.textContent = "账户名称需要 2-20 个字符，且不能包含空格。";
                return;
            }
            if (password.length < 6) {
                registerMessage.textContent = "密码至少 6 个字符。";
                return;
            }
            if (password !== confirmInput.value) {
                registerMessage.textContent = "两次输入的密码不一致。";
                return;
            }

            button.disabled = true;
            button.textContent = "正在创建…";

            try {
                await window.VTXApi.commit((accounts) => {
                    if (accounts[name]) {
                        throw new Error(`账户名称 ${name} 已被占用。`);
                    }

                    accounts[name] = { username: name, password, money: "0.00", trades: [] };
                    return `创建账户：${name}`;
                });

                sessionStorage.setItem("vtxAccount", name);
                remember(name, password);
                markLoginPending(name);
                window.location.href = "manager.html";
            } catch (error) {
                registerMessage.textContent = networkMessage(
                    error,
                    "无法连接 GitHub。请确认网络与 secure.json 配置正常。"
                );
            } finally {
                button.disabled = false;
                button.textContent = "创建账户";
            }
        });

        tryAutoLogin();
    </script>
</body>
</html>
