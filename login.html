<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 停服守卫：停服期间任何页面都会跳到 WebsiteClose.html，时间表见 vtx-closed.js -->
    <script>document.write('<script src="vtx-closed.js?t=' + Date.now() + '"><\/script>');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">
    <title>登录 | Vitual XRing</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, #e2edff 0, transparent 34%),
                radial-gradient(circle at 90% 85%, #e4f5f0 0, transparent 30%),
                #f4f7fb;
        }

        .login-card {
            width: min(100%, 420px);
            padding: 40px;
            border: 1px solid #e7ebf2;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 24px 70px rgba(30, 50, 90, 0.12);
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            color: #fff;
            background: linear-gradient(135deg, #3867e8, #6c8cff);
            font-size: 22px;
            font-weight: 800;
        }

        h1 {
            margin: 24px 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #738097;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 0 14px;
            border: 1px solid #dce2ec;
            border-radius: 12px;
            outline: none;
            background: #fff;
            color: #172033;
            font: inherit;
            transition: border-color 150ms, box-shadow 150ms;
        }

        input:focus {
            border-color: #5478ed;
            box-shadow: 0 0 0 3px rgba(84, 120, 237, 0.14);
        }

        button {
            width: 100%;
            min-height: 50px;
            margin-top: 6px;
            border: 0;
            border-radius: 12px;
            color: white;
            background: #4169e1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 150ms, transform 150ms;
        }

        button:hover {
            background: #3158d1;
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        .message {
            min-height: 22px;
            margin: 14px 0 0;
            color: #bd3545;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #68768d;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #3158d1;
        }

        .version-badge {
            position: fixed;
            top: 18px;
            right: 20px;
            padding: 6px 12px;
            border-radius: 999px;
            color: #3158d1;
            background: #eef2ff;
            font-size: 12.5px;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            padding: 4px;
            border-radius: 12px;
            background: #f1f4fa;
        }

        .tab {
            flex: 1;
            min-height: 38px;
            border: 0;
            border-radius: 9px;
            color: #66748c;
            background: transparent;
            font: inherit;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: none;
        }

        .tab.active {
            color: #1f2b45;
            background: #fff;
            box-shadow: 0 2px 8px rgba(30, 50, 90, 0.08);
        }

        .tabs + button {
            border-radius: 9px;
        }

        form[hidden] {
            display: none;
        }

        .message.success {
            color: #1f7a52;
        }

        .auto-note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            padding: 11px 14px;
            border: 1px solid #d8e3fb;
            border-radius: 11px;
            color: #3158d1;
            background: #f5f8ff;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .auto-note[hidden] {
            display: none;
        }

        .link-button {
            flex: none;
            padding: 0;
            border: 0;
            color: #3158d1;
            background: none;
            font: inherit;
            font-size: 13.5px;
            font-weight: 650;
            text-decoration: underline;
            cursor: pointer;
        }

        .link-button:hover {
            background: none;
            transform: none;
        }

        form.disabled {
            opacity: 0.55;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    <span class="version-badge">v1.7.1</span>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">V</div>
        <h1>欢迎回来</h1>
        <p class="subtitle">登录 Vitual XRing，查看你的账户与 VTX 余额。</p>

        <div class="tabs" role="tablist">
            <button id="login-tab" class="tab active" type="button" role="tab" aria-selected="true">登录</button>
            <button id="register-tab" class="tab" type="button" role="tab" aria-selected="false">创建账户</button>
        </div>

        <div id="auto-login-note" class="auto-note" hidden>
            <span id="auto-login-text">正在自动登录…</span>
            <button id="switch-account" class="link-button" type="button">切换账户</button>
        </div>

        <form id="login-form">
            <div class="field">
                <label for="account-name">登录账户名</label>
                <input id="account-name" name="name" type="text" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="account-password">密码</label>
                <input id="account-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button id="login-button" type="submit">登录账户</button>
            <p id="login-message" class="message" role="alert" aria-live="polite"></p>
        </form>

        <form id="register-form" hidden>
            <div class="field">
                <label for="register-name">登录账户名</label>
                <input id="register-name" type="text" maxlength="20" autocomplete="username" required placeholder="2-20 个字符，登录时使用">
            </div>
            <div class="field">
                <label for="register-password">密码</label>
                <input id="register-password" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="register-confirm">确认密码</label>
                <input id="register-confirm" type="password" minlength="6" autocomplete="new-password" required>
            </div>
            <button id="register-button" type="submit">创建账户</button>
            <p id="register-message" class="message" role="alert" aria-live="polite"></p>
        </form>

        <a class="back-link" href="index.html">← 返回首页</a>
    </main>

    <script src="vtx-api.js?v=1.7.1"></script>
    <script src="vtx-geo.js?v=1.7.1"></script>

    <script>
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const loginMessage = document.getElementById("login-message");
        const registerMessage = document.getElementById("register-message");
        const loginTab = document.getElementById("login-tab");
        const registerTab = document.getElementById("register-tab");

        function selectTab(name) {
            const isLogin = name === "login";
            loginForm.hidden = !isLogin;
            registerForm.hidden = isLogin;
            loginTab.classList.toggle("active", isLogin);
            registerTab.classList.toggle("active", !isLogin);
            loginTab.setAttribute("aria-selected", String(isLogin));
            registerTab.setAttribute("aria-selected", String(!isLogin));
            loginMessage.textContent = "";
            registerMessage.textContent = "";
        }

        loginTab.addEventListener("click", () => selectTab("login"));
        registerTab.addEventListener("click", () => selectTab("register"));

        function networkMessage(error, fallback) {
            return error instanceof TypeError ? fallback : error.message;
        }

        // 定位服务最多等 2 秒，超时就先登录（Worker 仍会记录 cf-connecting-ip）
        function browserGeo() {
            if (!window.VTXGeo) {
                return Promise.resolve(undefined);
            }
            const timeout = new Promise((resolve) => setTimeout(() => resolve(undefined), 2000));
            return Promise.race([
                Promise.resolve(window.VTXGeo.locate()).catch(() => undefined),
                timeout
            ]);
        }

        // 登录成功时 Workers 会顺便把本次登录的公网 IP 与位置写进账户记录
        async function signIn(name, password) {
            const geo = await browserGeo();
            const data = await window.VTXApi.login(name, password, geo);
            return data.account;
        }

        async function verifyCredentials(name, password) {
            try {
                return await signIn(name, password);
            } catch (error) {
                if (error.status === 401) {
                    return null;
                }
                throw error;
            }
        }

        function enterAccount(name) {
            try {
                sessionStorage.setItem("vtxAccount", name);
            } catch (error) {
                /* 忽略 */
            }
            const params = new URLSearchParams(window.location.search);
            const next = params.get("next") || "";
            const safe = /^[A-Za-z0-9._-]+\.html$/.test(next) ? next : "manager.html";
            // 1.2.0：不再把未知的 api 参数带到下一个页面（会被用来劫持 API 地址）
            window.location.href = new URL(safe, window.location.href).href;
        }

        // 1.4.0：恢复「记住上次登录的账户并自动登录」——把登录名与密码一起存在本地
        function remember(name, password) {
            try {
                localStorage.setItem("vtxRemembered", JSON.stringify({ login: name, password }));
            } catch (error) {
                /* 隐私模式忽略 */
            }
        }

        function forget() {
            try {
                localStorage.removeItem("vtxRemembered");
            } catch (error) {
                /* 忽略 */
            }
        }

        function readRemembered() {
            try {
                const parsed = JSON.parse(localStorage.getItem("vtxRemembered") || "null");
                if (!parsed || !parsed.login) {
                    return null;
                }
                return { login: parsed.login, password: typeof parsed.password === "string" ? parsed.password : "" };
            } catch (error) {
                /* 忽略损坏数据 */
            }
            return null;
        }

        async function tryAutoLogin() {
            const saved = readRemembered();
            if (!saved) {
                return false;
            }

            const nameInput = document.getElementById("account-name");
            const note = document.getElementById("auto-login-note");
            const text = document.getElementById("auto-login-text");
            const form = document.getElementById("login-form");

            if (!saved.password) {
                // 1.2.0 只记了登录名，没有密码就没法自动登录
                if (nameInput && !nameInput.value) {
                    nameInput.value = saved.login;
                }
                if (note && text) {
                    note.hidden = false;
                    text.textContent = `上次登录：${saved.login}（请输入密码登录）`;
                }
                return false;
            }

            if (note && text) {
                note.hidden = false;
                text.textContent = `正在自动登录 ${saved.login}…`;
            }
            form.classList.add("disabled");

            try {
                const account = await verifyCredentials(saved.login, saved.password);

                if (account) {
                    enterAccount(saved.login);
                    return true;
                }
                text.textContent = `上次登录：${saved.login}（自动登录失败，请输入密码）`;
            } catch (error) {
                text.textContent = `上次登录：${saved.login}（自动登录失败，请输入密码）`;
            } finally {
                form.classList.remove("disabled");
            }

            if (nameInput && !nameInput.value) {
                nameInput.value = saved.login;
            }
            return false;
        }

        document.getElementById("switch-account").addEventListener("click", () => {
            forget();
            document.getElementById("auto-login-note").hidden = true;
            document.getElementById("account-name").value = "";
            document.getElementById("account-password").value = "";
            document.getElementById("account-name").focus();
        });

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("login-button");
            loginMessage.textContent = "";
            button.disabled = true;
            button.textContent = "正在登录…";

            try {
                const name = loginForm.elements.name.value.trim();
                const password = loginForm.elements.password.value;
                const account = await verifyCredentials(name, password);

                if (!account) {
                    loginMessage.textContent = "账户名称或密码不正确。";
                    return;
                }

                remember(name, password);
                enterAccount(name);
                enterAccount(name);
            } catch (error) {
                loginMessage.textContent = networkMessage(
                    error,
                    "无法读取账户数据。请通过本地服务器或网站打开此页面，不要直接以 file:// 打开。"
                );
            } finally {
                button.disabled = false;
                button.textContent = "登录账户";
            }
        });

        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("register-button");
            const nameInput = document.getElementById("register-name");
            const passwordInput = document.getElementById("register-password");
            const confirmInput = document.getElementById("register-confirm");

            const name = nameInput.value.trim();
            const password = passwordInput.value;

            registerMessage.textContent = "";
            registerMessage.classList.remove("success");

            if (!/^\S{2,20}$/.test(name)) {
                registerMessage.textContent = "账户名称需要 2-20 个字符，且不能包含空格。";
                return;
            }
            if (password.length < 6) {
                registerMessage.textContent = "密码至少 6 个字符。";
                return;
            }
            if (password !== confirmInput.value) {
                registerMessage.textContent = "两次输入的密码不一致。";
                return;
            }

            button.disabled = true;
            button.textContent = "正在创建…";

            try {
                const geo = await browserGeo();
                await window.VTXApi.register({ login: name, password, username: name, geo });

                remember(name, password);
                enterAccount(name);
            } catch (error) {
                registerMessage.textContent = networkMessage(
                    error,
                    "无法连接 Vitual XRing 服务，请检查网络后重试。"
                );
            } finally {
                button.disabled = false;
                button.textContent = "创建账户";
            }
        });

        tryAutoLogin();
    </script>
</body>
</html>
